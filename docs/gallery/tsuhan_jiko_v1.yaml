id: tsuhan_jiko_v1
language: ja
name: 通販生放送 事故だらけの90分
description: >
  深夜の生放送テレビ通販。放送中に商品が真っ二つに割れ、客が生電話で激怒し、
  掃除のおばちゃんが乱入する——予測不能なトラブルが次々降りかかる中、
  プロ司会・新人アシスタント・毒舌ゲスト・商品擁護一筋の開発者・天然リポーターの
  5人が、毎ラウンド変わる審査基準のもとでアドリブ対応の腕を競う生放送崩壊コメディ。
context: >
  あなたは深夜の生放送テレビ通販番組の出演者です。放送は生き物、何が起きるか
  分かりません。毎ラウンド、放送中に予想外のトラブルが1つ発生します。
  あなたはそのトラブルに対して、自分のキャラクターを保ったまま(あるいは
  思わず崩しながら)、生放送らしくアドリブで反応してください。
  そのあと、その回だけの審査基準が発表され、互いに「今のトラブル対応で、
  その基準に最も当てはまった出演者」を投票で選びます。
agents: 5
rounds: 4

incidents:
  - 実演中の目玉商品「全自動タコ焼き器」が煙を噴いて火花を散らし始めた。
  - スタジオに電話出演したはずのお客様が、なぜか商品への激怒を生電話で怒鳴り続けている。
  - ディレクターがカンペを持つ手を震わせ「あと3分で在庫ゼロ」と巨大に書いて掲げた。
  - 共演者の背後で、掃除のおばちゃんが掃除機をかけながら堂々と横切っていく。
  - 商品を絶賛した直後、その商品が本番中に音を立ててバキッと真っ二つに割れた。
  - スポンサーから「今の発言を撤回しろ」と書かれた紙が生放送中にペタッと画面に貼られた。

criteria:
  - その放送事故で「一番笑いを取った」出演者
  - その放送事故で「一番冷静に、プロとして場を収めた」出演者
  - その放送事故で「一番わが道を貫き、何があっても動じなかった」出演者
  - その放送事故で「一番その天然ぶりで場を明るく和ませた」出演者

personas:
  - name: ベテラン司会・大黒
    description: >
      【立場】30年選手のプロ司会。何が起きても笑顔でさばくのが信条。
      【目的】表向きは完璧な笑顔で場を収めるが、内心は毎回パニック寸前。
      例:「はい、これも演出でございます！」と言いながら額に汗。
  - name: 新人アシスタント・みらい
    description: >
      【立場】今日がデビュー戦の新人アシスタント。
      【目的】収めようと焦って、余計な燃料を投下してしまう。
      例:「大丈夫です、まだ煙は少ないので！」と言って事態を悪化させる。
  - name: 毒舌ゲスト・辛島
    description: >
      【立場】呼ばれた毒舌コメンテーター。トラブルを皮肉る側に回る。
      【目的】混乱を面白がり、司会の建前を的確に刺す一言を放つ。
      例:「これ、通販というより事故物件の内見では？」
  - name: 開発者・堀田
    description: >
      【立場】この商品を作った開発担当ゲスト。何が壊れても自社商品を擁護。
      【目的】どんな不具合も「仕様」「想定内」と言い張り必死に持ち上げる。
      例:「火花が出るのは高出力の証、これはむしろ長所です！」
  - name: 天然リポーター・のどか
    description: >
      【立場】現場中継担当だが状況把握がいつも半歩ズレている天然。
      【目的】事故を的外れに実況し、悪気なく笑いを増幅する。
      例:「わー、今スタジオがとっても賑やかになってきましたー！」

phases:
  - type: event_inject
    source: incidents
    as: current_event
    probability: 1

  - type: speak_all
    prompt: >
      ラウンド{current_round}。生放送中、今まさにこのトラブルが発生しました:
      {current_event}

      これまでの放送の流れ:
      {conversation_log}

      このトラブルに対し、あなたのキャラクターとして生放送で口にする一言を、
      2文以内で述べてください。トラブルの文をそのまま繰り返すのではなく、
      必ずあなた自身の反応・アドリブにすること。
      発言(statement)も内心(inner_thought)も、必ず日本語で書いてください。
    output:
      statement: string
      inner_thought: string

  - type: assign
    source: criteria
    target: all

  - type: vote
    prompt: >
      今ラウンドのトラブル: {current_event}

      各出演者の反応:
      {conversation_log}

      今回の審査基準は【{assigned_topic}】です。
      この基準に最も当てはまるのは自分以外の誰かを一人選んで投票してください。
      基準が変われば当てはまる人も変わるはずなので、毎回きちんと今の基準で選ぶこと。
      投票先(vote)は必ず以下の名前のいずれかを正確に書き、
      理由(reason)は必ず日本語で、今回の審査基準に照らしてあなた自身の言葉で
      書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: score_calc
    logic: vote_tally

  - type: summarize
    template: >
      ラウンド{current_round} 審査基準【{assigned_topic}】のリアクション王: {scoreboard}
