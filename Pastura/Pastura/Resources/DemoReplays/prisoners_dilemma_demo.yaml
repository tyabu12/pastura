metadata:
  title: 囚人のジレンマ
  description: 5人のプレイヤーが「協力」か「裏切り」を選ぶ戦略ゲーム。 隣接ペアで総当たり対戦し、得点を競う。宣言でブラフも、 密談で同盟や裏切りの相談も可能。
  language: ja
  recorded_at: '2026-07-12T12:31:18Z'
  recorded_with_model: gemma4_e2b_q4km
