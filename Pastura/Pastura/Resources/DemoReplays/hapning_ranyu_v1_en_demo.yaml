  fields:
    statement: Well, at least my costume won't get sticky, which is a major win.
    inner_thought: The ping-pong rain is annoying, but I need to pivot to something mundane and self-preserving.
- round: 2
  phase_index: 1
  phase_type: speak_all
  agent: Bandwagon Benny
  fields:
    statement: These aren't just ping-pong balls, folks; these are the emergency supply of props I was saving for my next act.
    inner_thought: I need to make it clear that this is part of my plan, not a disaster.
