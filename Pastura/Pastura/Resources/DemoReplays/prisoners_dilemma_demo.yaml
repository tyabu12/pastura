- round: 1
  phase_index: 2
  phase_type: choose
  agent: リュウジ
  fields:
    inner_thought: ハルカが協力的だと主張するなら、そこを逆手に取るのが一番だ。俺の利益だけ見てるってことを証明してやる必要がある。
    action: betray
- round: 1
  phase_index: 2
  phase_type: choose
  agent: ハルカ
  fields:
    inner_thought: リュウジさんは自分の利益を優先しているようですが、私は同盟を組むことで全体の得点を最大化したいと考えます。協力すれば全員が3点を得られるのが一番良いでしょう。
