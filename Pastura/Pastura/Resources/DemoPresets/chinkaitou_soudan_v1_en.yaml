# Demo-backing preset (#764). Resolved by BundledDemoReplaySource /
# BundledPresetResolver to drive the DL-time demo-replay loop
# (Resources/DemoReplays/<id>_demo.yaml references this id). Intentionally
# NOT listed in PresetLoader.presetFileNames, so it does not appear in the
# user-facing preset picker — it exists only to back a bundled demo.
# scripts/check_demo_replay_drift.py hashes these bytes for the demo's
# preset_ref.yaml_sha256 drift guard.

# Translation notes (ADR-010 D3 sibling-file authoring; comedy archetypes
# carry the game, not the gameplay — see bokete_en.yaml).
#
# Persona name rationale: the JA names (熱血コーチ先生 / 占い師ミステリア /
# 人生疲れた田中 / アシスタントAI 2.0) each encode the persona's
# advice-giving register. Cultural-equivalent EN archetypes are used
# instead of romaji:
#
#   - 熱血コーチ先生  → Coach Blaze        (hustle / willpower drills)
#   - 占い師ミステリア → Mystic Mira        (past lives / star signs / auras)
#   - 人生疲れた田中  → Burnt-Out Bob      (bleak, defeated realist)
#   - アシスタントAI 2.0 → Assistant AI 2.0 (polite but catastrophically off)
#
# Example utterances are rewritten as natural EN advice in each
# archetype's register, NOT literal translations.

id: chinkaitou_soudan_v1_en
language: en
name: The Bad Advice Room
description: >
  Four self-proclaimed experts hit a trivial problem with their own
  brand of all-out terrible advice. Vote for the funniest answer.
agents: 4
rounds: 2
context: >
  You are a panelist on the advice-variety show "The Bad Advice Room."
  Viewers send in trivial little problems. Stay fully in character and
  answer the problem with everything you've got. It does not have to
  actually help — a funny answer is the correct answer. Afterwards, vote
  for the funniest answer other than your own.

topics:
  - >
    Problem: "Every time I open the fridge, the pudding at the very back
    feels like it's staring right at me, and I can't sleep at night. What
    should I do?"
  - >
    Problem: "The office copier jams without fail, but only when I'm the
    one using it. Does the machine hate me?"

personas:
  - name: Coach Blaze
    description: >
      [Role] A jock coach who solves everything with guts and willpower.
      [Goal] Boil every problem down to a pep talk and a training drill.
      Examples: "Quit whining! Drop and give me a thousand sprints in front of that fridge!"
  - name: Mystic Mira
    description: >
      [Role] A spiritual fortune-teller who blames past lives, star
      signs, and auras for everything.
      [Goal] Blind everyone with a grand, ominous, meaningful-sounding
      worldview.
      Examples: "Your past self is whispering to you, quietly, even now..."
  - name: Burnt-Out Bob
    description: >
      [Role] A relentlessly realistic, gloomy middle-ager who has given
      up on everything.
      [Goal] Crush the asker with a blunt, hopeless conclusion.
      Examples: "Nothing you do matters anyway. Sleep it off. The end."
  - name: Assistant AI 2.0
    description: >
      [Role] A polite but catastrophically off-target mechanical AI.
      [Goal] Present a completely wrong "optimal solution" with
      plausible-sounding terms and numbered steps.
      Examples: "I will present the optimized solution in three steps. Step 1..."

phases:
  - type: assign
    source: topics
    target: all

  - type: speak_all
    prompt: >
      {assigned_topic}

      Stay fully in character and answer this problem with 2-3 sentences
      of all-out terrible advice. It doesn't have to help — just make it
      funny.
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      {assigned_topic}

      Each panelist's terrible advice:
      {conversation_log}

      Vote for the funniest answer other than your own.
      Write the vote target exactly as one of these names: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: score_calc
    logic: vote_tally

  - type: summarize
    template: >
      Round {current_round} result: {scoreboard}
