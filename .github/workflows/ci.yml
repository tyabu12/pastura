name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily green-main canary. main's ui-test runs on macos-26, which is most
  # reliable in the low-GitHub-load window (peak load ≈ UTC 12:00-20:00 =
  # JST 21:00-05:00 — the "JST night"). 01:11 UTC = 10:11 JST sits in the
  # low-load trough, and is off the top of the hour where scheduled runs are
  # most delayed. Purpose is high-signal, not flake-hunting: a red run in this
  # low-noise JST-morning window points at a real regression on main, not infra
  # noise (empirically JST 07:00-09:00 ui-test was 20/20 across push/PR runs;
  # the morning trough carries into the 10:xx slot).
  # NOTE: GitHub auto-disables a scheduled workflow after 60 days of *no
  # repository activity* — harmless for an active repo, but that is the silent
  # failure mode if the daily ever stops firing.
  schedule:
    - cron: '11 1 * * *'
  # Manual trigger for an on-demand full main run (a human dispatched it and is
  # watching, so — unlike `schedule` — it is intentionally NOT auto-retried by
  # ci-retry.yml).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled (or workflow_dispatch) run on main shares main's `github.ref`
  # with a push to main, so a plain `ci-${{ github.ref }}` group would let a
  # concurrent push cancel the daily run (or vice versa). Suffix the group with
  # the run id for `schedule` only, giving each daily run its own group so it is
  # never cancelled. push / pull_request / workflow_dispatch keep the empty
  # suffix and their per-ref mutual-cancellation (a manual dispatch on main thus
  # shares push's group — harmless, since a push is itself a full main run).
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  # Path classification (#642). Emits `ios=true` when the changeset contains
  # any build/test-relevant path, so web-only / docs-only PRs skip the heavy
  # macOS jobs below. Reuses scripts/precommit-gate-classify.sh — the SAME
  # conservative-by-inversion classifier as the pre-commit hook (#625) — so CI
  # and pre-commit never drift.
  #
  # Gating is PR-ONLY: push events (merges to main) always emit `ios=true`, so
  # main runs the full suite unconditionally for stability. The optimization
  # only spares redundant work on web/docs-only PRs.
  #
  # Why a job-level `if:` (not a trigger-level `paths:`/`paths-ignore`): a job
  # skipped via `if:` reports "Success" and SATISFIES a required check (even
  # under a ruleset); only a workflow/trigger-level skip leaves the check
  # "Pending" and blocks merge. See .claude/rules/ci-workflows.md.
  #
  # The gated jobs use `if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}`
  # — run UNLESS explicitly classified non-iOS. `!cancelled()` is a status
  # function, so it drops the implicit needs-success gate: if THIS job fails
  # (infra / a future bad edit) its `ios` output is empty, `'' != 'false'` is
  # true, and the macOS jobs run the full suite rather than false-skipping a
  # required check. A genuine non-iOS change still classifies `ios=false` and
  # skips (= Success). Cancellation supersedes the run, so `!cancelled()` skips.
  changes:
    name: Classify changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-scoped (overrides the top-level `contents: read`): the PR-files
    # endpoint needs `pull-requests: read`; checkout needs `contents: read`.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.classify.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main stability: a push to main (post-merge) ALWAYS runs the full
          # iOS suite — path-gating is a PR-only optimization. Short-circuit
          # every non-PR event before any classification, so a merged change
          # can never skip tests on main. (Also keeps push off the API path.)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event → always run the full iOS suite (main stability)."
            exit 0
          fi

          # PR event: resolve the changed-file list. `--paginate` defeats the
          # 30-files/page default; the endpoint caps at 3000 files, but
          # truncation only shortens the list, never empties it — and only an
          # EMPTY/errored list trips the conservative default below. `|| FILES=""`
          # keeps `set -e` (GHA default) from aborting on a transient API failure.
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename') || FILES=""

          # CONSERVATIVE DEFAULT (#625 — "a false skip is the worst case"). The
          # classifier emits "" (NOT `build`) on empty input, so the fail-safe
          # must live HERE, before invoking it: an empty / unresolved / errored
          # file list ⇒ run the full iOS suite.
          if [ -z "$FILES" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "No file list resolved → defaulting to the full iOS suite."
            exit 0
          fi

          # Gate on the `build` token (not `lint`): `build ⊇ lint` because every
          # *.swift / .swiftlint.yml path is also non-SAFE, and non-Swift build
          # inputs (project.pbxproj, Localizable.xcstrings) must still run
          # lint-and-test. See scripts/precommit-gate-classify.sh.
          # `if !` keeps a classifier crash from aborting the step under
          # `set -e` (a failing `TOKENS=$(...)` would otherwise fail the whole
          # `changes` job → macOS jobs skip-on-failed-dep = a false skip on a
          # real iOS change). Default to the full suite instead.
          if ! TOKENS=$(printf '%s\n' "$FILES" | bash scripts/precommit-gate-classify.sh); then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Classifier failed → defaulting to the full iOS suite."
            exit 0
          fi
          echo "Changed paths classified as: '${TOKENS:-<none>}'"
          if printf '%s\n' "$TOKENS" | grep -qw build; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}
      test-parse-error: ${{ steps.test.outputs.parse_error }}
      coverage-pct: ${{ steps.coverage.outputs.pct }}
      lint-result: ${{ steps.lint.outputs.result }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and Simulator
        run: |
          ls /Applications/Xcode*.app
          xcodebuild -version
          # List available iPhone simulators for diagnostics
          xcrun simctl list devices available iPhone | head -20
          # Resolve simulator destination via shared script
          source scripts/sim-dest.sh
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      # NOTE: CI intentionally uses the default ~/Library DerivedData path so
      # this cache key keeps hitting. Local dev builds go to
      # Pastura/DerivedData/ via -derivedDataPath — see CLAUDE.md
      # "DerivedData location". If CI ever adopts -derivedDataPath, update
      # this cache path to match (and both instances of it in this file).
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: SwiftLint
        id: lint
        run: |
          brew install swiftlint
          if swiftlint lint --strict --reporter github-actions-logging; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Test with Coverage
        id: test
        run: |
          # Stream xcodebuild output to the job log via tee so per-test lines
          # are visible live (command substitution would buffer until exit,
          # losing all output on timeout-kill). Trailing `|| true` prevents
          # `set -eo pipefail` (GHA default) from aborting the script before
          # PIPESTATUS is captured.
          #
          # `-parallel-testing-enabled NO` — workaround for CI OOM cascade
          # first observed on `main` post-#186 (sha e650f13). Multiple
          # simulator clones on the macos-26 runner (~7 GB RAM) pushed the
          # test host over the OOM threshold; symptoms were trivial unit
          # tests taking ~3.1 s each (vs <10 ms locally) followed by a
          # host kill that marked 262–736 queued tests as "signal trap".
          # With this flag, `lint-and-test` completes in ~8 min — well
          # within the 10-min budget (CLAUDE.md). Root-cause investigation
          # is tracked in #189; when that lands, revisit whether to restore
          # full parallelism or settle on a targeted
          # `-parallel-testing-worker-count N`.
          xcodebuild test \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -destination "$DEST" \
            -only-testing PasturaTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xctest-unit.log || true
          TEST_EXIT=${PIPESTATUS[0]}

          # xcodebuild outputs per-case lines:
          #   Test case '...' passed on '...' (X.XXX seconds)
          #   Test case '...' failed on '...' (X.XXX seconds)
          # `|| true` swallows grep's exit-1 on zero matches and exit-2 on
          # missing file (timeout-kill case). Do NOT use `|| echo 0` here —
          # grep -c already prints "0" on zero matches, so appending another
          # "0" via echo yields a two-line "0\n0" value that corrupts
          # `$GITHUB_OUTPUT` and breaks the numeric comparison below. The
          # `:-0` default covers the missing-file case where grep produced no
          # stdout at all.
          PASSED=$(grep -c "^Test case .* passed " /tmp/xctest-unit.log 2>/dev/null || true)
          FAILED=$(grep -c "^Test case .* failed " /tmp/xctest-unit.log 2>/dev/null || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          if [ "$PASSED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            echo "parse_error=true" >> "$GITHUB_OUTPUT"
          else
            echo "parse_error=false" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          fi

          exit ${TEST_EXIT:-0}

      - name: Coverage Report
        id: coverage
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xccov view --report TestResults.xcresult
            xcrun xccov view --report --json TestResults.xcresult > coverage.json
            PCT=$(python3 -c "import sys,json; print(round(json.load(sys.stdin)['lineCoverage']*10000)/100)" < coverage.json)
            PCT=${PCT:-0.00}
            if ! [[ "$PCT" =~ ^[0-9]+\.[0-9]+$ ]]; then
              PCT=0.00
            fi
            echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          else
            echo "pct=0.00" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            TestResults.xcresult
            coverage.json
          retention-days: 7

  ui-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    # UI tests are far slower on the GPU-less CI simulator than locally
    # (~25s/suite locally either way). With continuous animations suppressed
    # under --ui-test (#728) a clean CI run is ~12-13 min. The per-test
    # execution-time cap in the test step below bounds a first-clone infra-flake
    # stall so even a flake-struck run stays comfortably under this budget.
    timeout-minutes: 25
    outputs:
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}
      test-parse-error: ${{ steps.test.outputs.parse_error }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and Simulator
        run: |
          xcodebuild -version
          source scripts/sim-dest.sh
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          # Extract UDID for the pre-boot step. DEST format:
          # "platform=iOS Simulator,id=<UDID>"
          SIM_UDID=$(echo "$DEST" | sed -n 's/.*id=\([^,]*\).*/\1/p')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Pre-boot Simulator
        # UI tests on GitHub Actions macOS runners frequently fail with
        # "Simulator device failed to launch ... xctrunner (RequestDenied)"
        # when xcodebuild test tries to boot, install, and launch the
        # runner all at once on a fresh VM. Booting explicitly first and
        # waiting for the system to be fully up ("-b") avoids the race.
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      # NOTE: CI intentionally uses the default ~/Library DerivedData path so
      # this cache key keeps hitting. Local dev builds go to
      # Pastura/DerivedData/ via -derivedDataPath — see CLAUDE.md
      # "DerivedData location". If CI ever adopts -derivedDataPath, update
      # this cache path to match (and both instances of it in this file).
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test PasturaUITests
        id: test
        run: |
          # Coverage intentionally omitted — UI tests inflate line coverage
          # without adding meaningful unit-level signal, and disabling it
          # shaves a non-trivial amount off the run.
          # -retry-tests-on-failure auto-reruns failing tests up to
          # -test-iterations N total times. Combined with the per-test
          # tearDown that terminates the app, this absorbs intermittent
          # CI-only infrastructure errors like "Failed to get background
          # assertion" without masking real test failures (those fail on
          # every retry).
          # See unit-test step for rationale on tee / PIPESTATUS / || true.
          # ScreenshotTourTests is a review-only capture tour (scripts/
          # ui-tour.sh), not a gate — skipped here so it never burns CI
          # minutes or inherits UI-test infra flakes. StoreScreenshotTests
          # (scripts/store-shots.sh) is the same class of local-only,
          # 6.9"-pinned capture and is skipped for the same reason.
          # -test-timeouts-enabled + -default-test-execution-time-allowance cap
          # each test ITERATION at 250s. After the #728 animation fix the
          # flake-prone heavy tests pass in <=149s on CI (observed across runs,
          # high variance), so 250s clears them with margin while killing a
          # first-clone infra-flake stall (which otherwise crawls to ~350-380s)
          # early enough for the fast retry to keep the job under its 25-min
          # budget. InFlightIndicatorReconnectUITests is slow by design (~225s)
          # and opts out with its own executionTimeAllowance in setUp.
          xcodebuild test \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -destination "$DEST" \
            -only-testing PasturaUITests \
            -skip-testing PasturaUITests/ScreenshotTourTests \
            -skip-testing PasturaUITests/StoreScreenshotTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 250 \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xctest-ui.log || true
          TEST_EXIT=${PIPESTATUS[0]}

          PASSED=$(grep -c "^Test case .* passed " /tmp/xctest-ui.log 2>/dev/null || true)
          FAILED=$(grep -c "^Test case .* failed " /tmp/xctest-ui.log 2>/dev/null || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          if [ "$PASSED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            echo "parse_error=true" >> "$GITHUB_OUTPUT"
          else
            echo "parse_error=false" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          fi

          exit ${TEST_EXIT:-0}

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  # Enforces ADR-005 §8.5 on every PR: `OllamaService` must not link into the
  # Release-iphoneos binary (App-Store-submission target). Runs in parallel
  # with lint-and-test and ui-test. See ADR-005 §8 and docs/decisions/ADR-005.md.
  release-build:
    name: Release build (iphoneos) + ADR-005 §8 guard
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: xcodebuild -version

      # Same key/path as lint-and-test / ui-test — shared warm SPM cache.
      # See the lint-and-test Cache step for the rationale on CI staying on
      # the default ~/Library DerivedData path.
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Deliberately NO `|| true` / PIPESTATUS dance here, unlike the
      # unit/UI test steps above. Those steps must continue past xcodebuild
      # failure to parse log output for the sticky PR comment; this step
      # only needs the binary for the symbol grep. With GHA's default
      # `bash -eo pipefail`, a non-zero xcodebuild exit short-circuits the
      # `tee` pipeline naturally — that is the intended behaviour here.
      # -sdk iphoneos (not iphonesimulator) because Release-simulator still
      # defines targetEnvironment(simulator), which would pull OllamaService
      # back in and make the guard fire vacuously.
      - name: Release build
        run: |
          xcodebuild build \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release-build.log

      - name: Verify ADR-005 §8 — OllamaService excluded
        run: |
          # Locate the Release-iphoneos binary. xcodebuild uses the default
          # ~/Library/... DerivedData on CI (see Cache step). Multiple matches
          # would indicate a cache-layout bug — fail loudly rather than pick one.
          # Portable while/read loop because `mapfile` is bash 4+ and GHA
          # macOS runners default to /bin/bash 3.2 (Apple GPLv3 avoidance).
          BINS=()
          while IFS= read -r -d '' f; do
            BINS+=("$f")
          done < <(find ~/Library/Developer/Xcode/DerivedData \
            -type f \
            -path '*/Build/Products/Release-iphoneos/Pastura.app/Pastura' \
            -print0)
          if [ "${#BINS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 Release binary, found ${#BINS[@]}"
            printf '%s\n' "${BINS[@]}"
            exit 1
          fi
          BIN="${BINS[0]}"
          echo "Checking $BIN"
          # Demangle before grep: failure output stays human-readable and the
          # check catches future helpers like OllamaClient / ollamaBridge that
          # a narrower match would miss. Matches ADR-005 §8.5.
          MATCHES=$(nm -a "$BIN" | xcrun swift-demangle | grep -i ollama || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ollama symbols leaked into Release binary (ADR-005 §8)"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: zero ollama symbols in Release-iphoneos binary"

      - name: Upload Release build log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: /tmp/release-build.log
          retention-days: 7

  # ADR-013: the harness SwiftPM package compiles the same Engine/LLM/Models
  # sources as the app but is invisible to the pre-commit hook (xcodebuild
  # only) — without this job an iOS-only PR can silently break `swift build`.
  # Runs in parallel with the xcodebuild jobs, so it does not extend the
  # critical path (ui-test remains the slowest job).
  harness-build:
    name: Harness package build + tests (ADR-013)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Separate cache family from the xcodebuild jobs: SwiftPM CLI builds
      # into ./.build (checkouts + the ~555 MB unpacked llama.cpp
      # xcframework artifact), not ~/Library DerivedData. Keyed on the
      # ROOT Package.resolved only — '**/Package.resolved' would also hash
      # the xcodeproj's copy and churn this key on app-only pin changes.
      - name: Cache SwiftPM build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: harness-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: harness-spm-${{ runner.os }}-

      - name: Build harness package
        run: swift build

      - name: Run harness package tests
        run: swift test

  # Drift guard for bundled DL-time demo replays (#170, spec §3.3 / §5.2).
  # Re-hashes shipped preset YAMLs and validates each bundled demo's
  # `preset_ref.yaml_sha256` + curation-quality floors (turns, language,
  # filter-applied flag, bundle count/size). Pure-python so shell-tool
  # differences across runners don't matter — ubuntu-latest keeps this job
  # fast and cheap.
  demo-replay-drift:
    name: Demo replay drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # GHA ubuntu-latest ships python3 >= 3.12 and pip. No setup-python
      # action needed — fewer pinned action versions to maintain.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      - name: Run drift guard
        run: python3 scripts/check_demo_replay_drift.py

  blocklist-drift:
    name: ContentBlocklist drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # jq is pre-installed on ubuntu-latest runners. The script's
      # --check mode validates source.json shape, contentCategory enum
      # values, and byte-level drift against the bundled
      # ContentBlocklist.json (ADR-005 §10.1). No `|| true` wrapper —
      # any failure must fail the job so merge-time drift cannot land
      # silently.
      - name: Run blocklist drift guard
        run: bash scripts/build-blocklist.sh --check

  shell-tests:
    name: Shell gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # gallery-scripts-test.sh delegates to add/check-gallery-entry.sh,
      # which parse YAML via PyYAML. Pin major to match the gallery-drift
      # job's install. The other shell tests don't need it; the install
      # is cheap and unconditional keeps the job simple.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      # Regression tests for the repo's shell gates (p8 secret-gate,
      # gallery tooling, …). Pure git + bash, so ubuntu — no Xcode needed.
      # The `*-test.sh` naming convention is the contract: any matching
      # file becomes a CI gate. GHA's default shell runs `set -eo pipefail`,
      # so a non-zero test exit fails the job (no `|| true` wrapper).
      - name: Run scripts/tests/*-test.sh
        run: |
          for f in scripts/tests/*-test.sh; do
            [ -e "$f" ] || continue
            echo "== $f =="
            bash "$f"
          done

  gallery-drift:
    name: Gallery drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # jq + shasum are pre-installed on ubuntu-latest. PyYAML is the
      # only third-party dep — pin major to keep the install
      # deterministic. The script's --all mode validates yaml_sha256
      # byte-match, size cap (256 KiB), id uniqueness across
      # gallery.json + bundled presets, and filename-stem == id. No
      # `|| true` wrapper — any failure must fail the job so merge-time
      # drift cannot land silently. (GallerySeedYAMLTests inside the
      # iOS test target is the second line of defense.)
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      - name: Run gallery drift guard
        run: bash scripts/check-gallery-entry.sh --all

  # Job-only guard like blocklist-drift / gallery-drift (no pr-comment
  # wiring — the red check itself is the gate; the map is review tooling,
  # not a shipped surface). Pure stdlib — no pip install needed.
  navigation-map-drift:
    name: Navigation map drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run scanner self-test
        run: python3 scripts/generate-navigation-map.py --self-test

      - name: Run navigation map drift guard
        run: python3 scripts/generate-navigation-map.py --check

  # Job-only guard like the drift siblings above. Counts buildScenario()
  # occurrences in ScenarioEditorViewModel*.swift (#338 funnel tripwire);
  # != 3 fails. Pure git + bash, no deps. The shell-tests job exercises the
  # gate logic on synthetic repos; this runs it against the real tree.
  scenario-editor-funnel-drift:
    name: ScenarioEditor funnel drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run ScenarioEditor funnel drift guard
        run: bash scripts/scenario-editor-funnel-gate.sh --check

  # Job-only guard like the drift siblings above. Keeps ds/tokens.css (the
  # CSS mirror consumed by the claude.ai Design System project) faithful to
  # DesignTokens*.swift, and validates @dsCard markers. Pure stdlib.
  design-tokens-drift:
    name: Design tokens drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run checker self-test
        run: python3 scripts/check_design_tokens_css.py --self-test

      - name: Run design tokens drift guard
        run: python3 scripts/check_design_tokens_css.py --check

  localization-coverage:
    name: Localization coverage (ja 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # GHA ubuntu-latest ships python3 >= 3.12. No third-party deps —
      # the script uses only stdlib (json, argparse, pathlib).
      - name: Run validator self-test
        run: python3 scripts/check_localization_coverage.py --self-test

      - name: Verify Localizable.xcstrings ja coverage
        run: python3 scripts/check_localization_coverage.py

  engine-language-axis:
    name: Engine language-axis guard (ADR-010 D5 / D8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Bash + grep only — both pre-installed on ubuntu-latest. The script
      # blocks future regressions of the `scenario.language` → Engine
      # dispatch antipattern; see docs/decisions/ADR-010.md § D5, D7, D8.
      - name: Run Engine language-axis guard
        run: bash scripts/check_engine_language_axis.sh

      # ADR-010 D8 dependency-rule guard — `import NaturalLanguage` is
      # forbidden in Engine / LLM / Models / Data; only App/ imports the
      # framework. The script catches `@preconcurrency` /
      # `@_implementationOnly` / submodule import shapes alongside the
      # bare `import NaturalLanguage`.
      - name: Run NaturalLanguage import boundary guard
        run: bash scripts/check_naturallanguage_axis.sh

  coverage:
    name: Coverage
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # SECURITY: This condition prevents fork PRs from accessing GIST_SECRET.
    # Do not remove or weaken without reviewing secret exposure implications.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # GIST_SECRET must be a PAT with only the "gist" scope (classic)
      # or "gists: write" (fine-grained). No other permissions needed.
      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2e86dcd3eddf5d5294d75870c9ad62e7
          filename: pastura-coverage.json
          label: coverage
          message: ${{ needs.lint-and-test.outputs.coverage-pct }}%
          valColorRange: ${{ needs.lint-and-test.outputs.coverage-pct }}
          minColorRange: 0
          maxColorRange: 100

  # SECURITY: Do NOT add actions/checkout or run untrusted code in this job.
  # This job has pull-requests: write and must never execute PR code.
  # Do NOT change the trigger to pull_request_target.
  pr-comment:
    name: PR Comment
    needs: [lint-and-test, ui-test, release-build, demo-replay-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate comment body
        env:
          UNIT_JOB_RESULT: ${{ needs.lint-and-test.result }}
          UI_JOB_RESULT: ${{ needs.ui-test.result }}
          RELEASE_JOB_RESULT: ${{ needs.release-build.result }}
          DRIFT_JOB_RESULT: ${{ needs.demo-replay-drift.result }}
          TEST_PASSED: ${{ needs.lint-and-test.outputs.test-passed }}
          TEST_FAILED: ${{ needs.lint-and-test.outputs.test-failed }}
          TEST_PARSE_ERROR: ${{ needs.lint-and-test.outputs.test-parse-error }}
          UI_TEST_PASSED: ${{ needs.ui-test.outputs.test-passed }}
          UI_TEST_FAILED: ${{ needs.ui-test.outputs.test-failed }}
          UI_TEST_PARSE_ERROR: ${{ needs.ui-test.outputs.test-parse-error }}
          COVERAGE_PCT: ${{ needs.lint-and-test.outputs.coverage-pct }}
          LINT_RESULT: ${{ needs.lint-and-test.outputs.lint-result }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## CI Report"
            echo ""

            # Job-level failure banner
            for job_result in "$UNIT_JOB_RESULT" "$UI_JOB_RESULT" "$RELEASE_JOB_RESULT" "$DRIFT_JOB_RESULT"; do
              if [ "$job_result" = "skipped" ] || [ "$job_result" = "cancelled" ]; then
                echo "> One or more CI jobs were ${job_result}."
                echo ""
                break
              fi
            done
            if [ "$UNIT_JOB_RESULT" = "failure" ] \
                || [ "$UI_JOB_RESULT" = "failure" ] \
                || [ "$RELEASE_JOB_RESULT" = "failure" ] \
                || [ "$DRIFT_JOB_RESULT" = "failure" ]; then
              echo "> **CI job failed.** See [CI logs](${CI_RUN_URL}) for details."
              echo ""
            fi

            # Lint results
            echo "### Lint"
            echo ""
            if [ "$LINT_RESULT" = "pass" ]; then
              echo "SwiftLint: **passed**"
            elif [ "$LINT_RESULT" = "fail" ]; then
              echo "SwiftLint: **FAILED**"
            else
              echo "SwiftLint: did not run"
            fi

            # Release build (ADR-005 §8 submission-blocker gate — surfaced
            # here so a silent regression is visible on the PR, not only in
            # the Actions tab)
            echo ""
            echo "### Release Build (ADR-005 §8 guard)"
            echo ""
            if [ "$RELEASE_JOB_RESULT" = "success" ]; then
              echo "Release-iphoneos symbol guard: **passed**"
            elif [ "$RELEASE_JOB_RESULT" = "failure" ]; then
              echo "Release-iphoneos symbol guard: **FAILED** — see [CI logs](${CI_RUN_URL})"
            else
              echo "Release-iphoneos symbol guard: did not run"
            fi

            # Demo replay drift guard (#170 / spec §3.3 / §5.2 — surfaced
            # here so preset-vs-demo SHA mismatches and §5.2 floor violations
            # are visible on the PR, not only in the Actions tab)
            echo ""
            echo "### Demo Replay Drift Guard"
            echo ""
            if [ "$DRIFT_JOB_RESULT" = "success" ]; then
              echo "Demo replay drift guard: **passed**"
            elif [ "$DRIFT_JOB_RESULT" = "failure" ]; then
              echo "Demo replay drift guard: **FAILED** — see [CI logs](${CI_RUN_URL})"
            else
              echo "Demo replay drift guard: did not run"
            fi

            # Test results — unit + UI shown separately so a slow UI suite
            # never blocks fast unit-test feedback signalling
            echo ""
            echo "### Test Results"
            echo ""
            if [ "$TEST_PARSE_ERROR" = "true" ]; then
              echo "- Unit: > Could not parse test output."
            elif [ -n "$TEST_PASSED" ]; then
              PASSED=$(echo "${TEST_PASSED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              FAILED=$(echo "${TEST_FAILED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              if [ "$FAILED" = "0" ]; then
                echo "- Unit: **${PASSED} passed**"
              else
                echo "- Unit: **${PASSED} passed, ${FAILED} FAILED**"
              fi
            else
              echo "- Unit: > did not run"
            fi

            if [ "$UI_TEST_PARSE_ERROR" = "true" ]; then
              echo "- UI: > Could not parse test output."
            elif [ -n "$UI_TEST_PASSED" ]; then
              UI_PASSED=$(echo "${UI_TEST_PASSED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              UI_FAILED=$(echo "${UI_TEST_FAILED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              if [ "$UI_FAILED" = "0" ]; then
                echo "- UI: **${UI_PASSED} passed**"
              else
                echo "- UI: **${UI_PASSED} passed, ${UI_FAILED} FAILED**"
              fi
            else
              echo "- UI: > did not run"
            fi

            # Coverage
            echo ""
            echo "### Coverage"
            echo ""
            if [ "$COVERAGE_PCT" = "0.00" ] || [ -z "$COVERAGE_PCT" ]; then
              echo "> Coverage measurement failed. See [CI logs](${CI_RUN_URL}) for details."
            else
              echo "**${COVERAGE_PCT}%** line coverage"
            fi

            echo ""
            echo "---"
            echo "[View full CI run](${CI_RUN_URL})"
          } > /tmp/pr-comment.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        # Fork PRs have read-only GITHUB_TOKEN; comment posting will fail gracefully.
        continue-on-error: true
        with:
          header: ci-report
          path: /tmp/pr-comment.md
