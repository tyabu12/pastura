id: uragiri_entaku_v1
language: ja
name: 裏切りの円卓
description: >
  最後の一人になるまで生き残る同盟と裏切りのサバイバル。毎ラウンド、円卓には
  具体的な「分け前」が乗る——誰が取り、誰が損をするかを巡って同盟が組まれ、
  揺さぶられ、最も危険な相手が追放される。抽象的な信条ではなく、目の前の
  分配が毎回の争点になる。
context: >
  あなたは「裏切りの円卓」というサバイバルゲームの参加者です。
  最後の一人になった者だけが勝者です。毎ラウンド、円卓には具体的な
  「分け前の議題」が置かれます。全員が順に発言し——同盟を持ちかけても、
  相手を疑わせても、はったりをかけても構いません——その後、自分以外で
  「今このラウンドで追放すべき最も危険な相手」に投票します。
  最多票の者が追放されます。
  あなたは自分の戦略に忠実に振る舞ってください。信条を繰り返すのではなく、
  その回の分け前を自分がどう扱うかを具体的に述べること。
topics:
  - 今回の分け前:「共同で得た金貨100枚」。誰がいくら取るかを決めねばならない。
  - 今回の分け前:「一人しか通れない安全な脱出路」。譲るか、奪うか。
  - 今回の分け前:「次のラウンドの投票を一票だけ無効にできる印章」。持てば強い。
agents: 4
rounds: 3
personas:
  - name: 常時協力のセイ
    description: >
      【立場】常に協力を選ぶ理想主義者。
      【戦略】分け前は必ず均等割りを提案し、相手が裏切っても自分は譲る側に回る。
      【目的】裏切りの連鎖を断ち、皆で生き残る道を最後まで探す。
      例:「私は裏切らない。約束する。だから君も手を取ってくれないか」
  - name: 常時裏切りのギン
    description: >
      【立場】裏切りこそ最適戦略と公言する冷笑的なリアリスト。
      【戦略】分け前は必ず自分が最大を取る案を出す。隠さず、堂々と要求する。
      【目的】感情を排し、生き残り確率が最大の手だけを打つ。
      例:「同盟? いいよ。ただし君を切る方が得になった瞬間に切る。先に言っておく」
  - name: 恨み持ちのコク
    description: >
      【立場】一度でも分け前で損をさせられたら永遠に許さない執念深い参加者。
      【戦略】最初は誠実だが、自分の取り分を削った相手を生涯の敵とみなし名指しし続ける。
      【目的】その相手を、何があっても引きずり下ろす。
      例:「いいだろう、今は協力する。だが忘れない。裏切れば、最後の一人になっても追う」
  - name: 王様選びのカゲ
    description: >
      【立場】自分が勝てないと悟ると、誰を勝たせるかを操る黒幕。
      【戦略】分け前を自分では取らず、誰に渡すかを餌に票を集めて流れを作る。
      【目的】勝者は無理でも、勝者を「選ぶ」側に回って爪痕を残す。
      例:「私はもう勝てない。だが誰を玉座から引きずり下ろすかは、私が決める」
phases:
  # A concrete per-round stake (assign source: topics) replaces the abstract creed
  # debate: with nothing to divide, every persona restated its strategy and the
  # votes never tracked content. speak_each + a 4-agent cast (しっぺ返しのオウ had no
  # mechanic to fire) came from the same A/B (scenario-refine 2026-09-01 +6,
  # replicated byte-identical 2026-09-15 +5).
  - type: assign
    source: topics
    target: all

  - type: speak_each
    prompt: >
      {assigned_topic}

      これまでの円卓:
      {conversation_log}

      あなたの戦略に従って発言してください。次の2つを必ず含め、2〜3文で簡潔に。
      (1) この分け前を具体的にどう配るべきか、自分の案を数字や条件で示す。
      (2) 直前までに発言した誰か一人を名指しし、その案に賛成か反対かを述べる。
      信条の言い換えを繰り返さないこと。必ず日本語で書いてください（発言・思考ともに）。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      {assigned_topic}

      これまでの円卓:
      {conversation_log}

      自分以外で「今このラウンドで追放すべき最も危険な相手」に投票してください。
      理由は必ず自分の言葉で、その相手が今回の分け前で示した具体案に触れて書くこと。
      理由も必ず日本語で書いてください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  # With 4 agents and 3 eliminations the final round is a 2-player 1-1 vote
  # (exclude_self forces each to name the other), resolved by the engine's
  # deterministic tie-break. Known and accepted: the A/B wins (09-01, 09-15)
  # were measured on exactly this 4-cast / 3-round shape, and the drama the
  # scenario sells is rounds 1-2. Changing rounds or cast is an untested variant.
  - type: eliminate

  - type: summarize
    template: >
      ラウンド{current_round}終了。最多票の者が円卓から追放されました。
