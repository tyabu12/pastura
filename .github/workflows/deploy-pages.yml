# Builds the public pastura.app site from the Astro project under `web/` and
# deploys it to GitHub Pages (issue #475 — migrated from the former
# hand-written `pages/` tree).
#
# Pipeline: `npm ci` + `astro build` (in `web/`) → upload `web/dist/` as the
# Pages artifact → deploy. Astro emits the whole site, so there is no
# explicit per-file staging step any more; `web/dist/` is a clean build
# output (no editor detritus), which is why a wholesale upload is safe here.
#
# Files that must reach the deployed root come from `web/public/` (Astro
# copies that directory verbatim into `dist/`):
#
#   - `web/public/CNAME`      → `dist/CNAME` (apex custom domain, `pastura.app`)
#     GitHub Pages reads CNAME from the deployed artifact root to persist
#     `Settings → Pages → Custom domain` across deploys — omission would wipe
#     the custom-domain binding on the next deploy.
#   - `web/public/.nojekyll`  → `dist/.nojekyll`
#     Load-bearing for Astro: the bundled-asset dir `_astro/` is
#     underscore-prefixed, which Jekyll would strip. `.nojekyll` also guards
#     against a Source-setting regression back to branch-based Pages.
#   - `web/public/robots.txt` → `dist/robots.txt`
#   - `web/public/{css,js,img}/…` → served at `/css/…`, `/js/…`, `/img/…`
#
# The sitemap is generated by @astrojs/sitemap as `sitemap-index.xml` +
# `sitemap-0.xml` (see `web/astro.config.mjs`). Search Console must be
# re-pointed at `/sitemap-index.xml` (the old `/sitemap.xml` no longer
# exists).
#
# Precondition: Settings → Pages → Source = "GitHub Actions".
#
# Concurrency group `pages` is GitHub's documented convention for Pages
# deploys — any future Pages workflow in this repo must share it so deploys
# serialize correctly. `cancel-in-progress: false` is deliberate: cancelling
# a Pages deploy mid-flight can leave the site in an inconsistent state.
#
# A post-deploy smoke check `curl -fsS`'s every deployed URL (HTML, CSS, JS,
# images, sitemaps, robots) so a build/output regression surfaces as a
# workflow failure instead of a 404 noticed days later.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `npm ci` on a cold cache plus `astro build` runs comfortably under this;
    # the bump from the old 5 min absorbs the first uncached install.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Action input path is relative to the repo root, not the
          # `defaults.run.working-directory` above (that only affects `run`).
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke-check deployed URLs
        # Pages deploy can succeed structurally while serving a broken tree
        # (e.g. a build regression that drops an asset). A `curl -fsS` against
        # each expected URL turns those silent failures into a workflow
        # failure. `--retry` covers the short propagation window after
        # `deploy-pages` returns. Covers both sitemap files: the index
        # references the child, so a 404 child is a silent SEO break.
        run: |
          set -euo pipefail
          for url in \
            "https://pastura.app/" \
            "https://pastura.app/css/base.css" \
            "https://pastura.app/css/lp.css" \
            "https://pastura.app/css/page.css" \
            "https://pastura.app/css/anim.css" \
            "https://pastura.app/js/anim.js" \
            "https://pastura.app/img/app-icon.png" \
            "https://pastura.app/img/favicon-64.png" \
            "https://pastura.app/img/app-store-badge-en.svg" \
            "https://pastura.app/img/app-store-badge-ja.svg" \
            "https://pastura.app/support/" \
            "https://pastura.app/docs/scenario/" \
            "https://pastura.app/legal/privacy-policy/" \
            "https://pastura.app/ja/" \
            "https://pastura.app/ja/support/" \
            "https://pastura.app/ja/docs/scenario/" \
            "https://pastura.app/ja/legal/privacy-policy/" \
            "https://pastura.app/sitemap-index.xml" \
            "https://pastura.app/sitemap-0.xml" \
            "https://pastura.app/robots.txt"; do
            echo "Checking ${url}"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${url}"
          done
