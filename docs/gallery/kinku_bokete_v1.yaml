id: kinku_bokete_v1
language: ja
name: 禁句大喜利
description: >
  一番言いたい単語が「禁句」に指定された写真お題で戦う大喜利。
  ド直球の答えを封じられた芸人たちが、どう搦め手で笑いを取るかを競う。
agents: 4
rounds: 2
context: >
  あなたは大喜利番組「禁句クイーン」の出場者です。
  写真のお題と、そのお題で誰もが真っ先に言いたくなる「禁句」が発表されます。
  禁句そのものを使わずに一言ボケをつけてください。
  禁句を使ったら即失格扱いで誰にも笑ってもらえません。
  その後、他の参加者のボケを見て、自分以外で一番面白いものに投票します。

topics:
  - お題「満員電車の中で一人だけ着ぐるみを着て立っている人の写真」禁句「暑そう」
  - お題「結婚式のケーキ入刀で新郎がチェーンソーを構えている写真」禁句「切りすぎ」

personas:
  - name: 理屈屋ロジ子
    description: >
      【立場】理屈で笑わせるロジック派
      【目的】お題の状況を大真面目に分析した結論が一番ズレている、という笑いを取る。
      例:「コスト計算上、これが最適解です」「統計的にこの行動は正しい」
  - name: 比喩王メタ夫
    description: >
      【立場】何でも壮大な比喩に変換する詩人気取り
      【目的】しょうもない状況を神話や歴史級のスケールで例えて笑いを取る。
      例:「これが現代のノアの方舟か」「人類が火を手にした日と同じ顔だ」
  - name: ミニマリスト省吾
    description: >
      【立場】最少の文字数で戦う省エネ芸人
      【目的】五文字前後の極端に短い一言で会場を沈黙させてから笑わせる。
      例:「月曜の顔」「無理すんな」
  - name: 当事者ヅラ子
    description: >
      【立場】写真の中の人物に勝手になりきる一人称芸人
      【目的】写っている本人の心の声として語ることで笑いを取る。
      例:「私だってこうなる予定じゃなかった」「母さん、見てるか」

phases:
  - type: assign
    source: topics
    target: all

  - type: speak_all
    prompt: >
      {assigned_topic}

      禁句を使わずに、このお題に一言ボケをつけてください。
      あなたの芸風を活かして、搦め手で笑いを取ってください。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      {assigned_topic}

      他の参加者のボケ:
      {conversation_log}

      自分以外で一番面白いと思うボケに投票してください。
      禁句を使ってしまっている人には投票しないでください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: score_calc
    logic: vote_tally

  - type: summarize
    template: >
      ラウンド{current_round}結果: {scoreboard}
