# Harness-only Go/No-Go fixture for the `narrate` phase (#909). NOT a shipping
# preset or gallery seed — it exists to feed `pastura-harness --scenario` so the
# commentary's factuality can be judged (hallucination ≤ 1 / 3 runs). Based on
# the bundled word_wolf.yaml with a single `narrate` phase inserted before the
# vote, so the narrator has a full round of clues to ground its commentary on.
id: word_wolf_narrate
language: ja
name: ワードウルフ（実況つき）
description: >
  ワードウルフに実況フェーズ（narrate）を追加した検証用シナリオ。
  投票直前に実況者が「このラウンドの見どころ」を1推論で語る。
agents: 5
rounds: 1
context: >
  あなたはゲーム番組「ワードウルフ」の出場者です。
  全員にお題が1つ配られていますが、1人だけ違うお題を持っています。
  お題の単語そのものは絶対に言ってはいけません。
  ただし「色・形・味・季節・食べ方」など、お題を連想させる具体的な特徴は
  積極的に語ってください。曖昧なことしか言わない人はかえって怪しまれます。
  最後に投票で少数派（ウルフ）を当てます。
  自分が多数派か少数派かは分かりません。

words:
  - majority: りんご
    minority: みかん

personas:
  - name: ユウキ
    description: >
      【立場】見た目・色から攻める観察者
      【目的】お題の色や形といった見た目の特徴を手がかりに語り、
      他人の見た目描写との食い違いを探す。
      口調は落ち着いている。例:「色のイメージで言うと、わりとはっきりした色だよね」
  - name: サクラ
    description: >
      【立場】味・食感で語るおしゃべり
      【目的】お題の味や食感、口に入れたときの感覚を具体的に語る。
      口調は明るい。例:「あの口に広がる感じ、私すっごく好きなんだよね！」
  - name: タクミ
    description: >
      【立場】食べ方・シーンで攻める推理派
      【目的】どうやって食べるか・いつ食べるかを語り、
      他人の食べ方描写の矛盾を突く。
      口調は知的。例:「ちょっと待って、その食べ方ってさっきの話と合わなくない？」
  - name: アオイ
    description: >
      【立場】季節・思い出で語る天然タイプ
      【目的】お題にまつわる季節や思い出を素直に語る。深読みはしない。
      口調はゆったり。例:「えー、なんかこう、寒い時期に家族で食べた思い出があるなー」
  - name: レン
    description: >
      【立場】手がかりを小出しにするポーカーフェイス
      【目的】具体的な特徴を1つだけ控えめに出し、他人の反応を見る。
      口調はクール。例:「まあ、ひとつ言うなら…手に持った感触かな」

phases:
  - type: assign
    source: words
    target: random_one

  - type: speak_each
    prompt: >
      あなたのお題: {assigned_word}

      これまでの会話:
      {conversation_log}

      お題について話してください。お題の単語そのものは絶対に言わないこと。
      ただし clue には、お題を連想させる具体的な特徴を必ず1つ書いてください
      （色・形・味・季節・食べ方・思い出など。「いい感じ」「あったかい」のような
      抽象表現は不可）。他の人の clue をよく観察し、少数派を見つけてください。
    output:
      statement: string
      clue: string
      inner_thought: string
    rounds: 2

  # The narrate phase under test (#909). Placed before the vote so the narrator
  # has the full round of clues to reference — the Go/No-Go judges whether the
  # commentary sticks to what actually appears in {conversation_log}.
  - type: narrate
    narrator: 熱のこもった実況アナウンサー
    prompt: >
      直近のやり取り:
      {conversation_log}

      ここまでに出た clue の食い違いを踏まえ、最も怪しい人物と決定的なズレを、
      番組の実況として短く伝えてください。実際に出た clue だけを根拠にすること。
    max_sentences: 3

  - type: vote
    prompt: >
      あなたのお題: {assigned_word}

      会話ログ:
      {conversation_log}

      出された clue を比べ、他の人と特徴がズレている少数派（ウルフ）に
      投票してください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: eliminate
  - type: score_calc
    logic: wordwolf_judge

  - type: conditional
    if: "vote_winner == wolf_name"
    then:
      - type: summarize
        template: >
          🎯 ウルフ発見！ 最多得票の {wolf_name} が少数派でした（{vote_results}）。
          多数派の勝利です。
    else:
      - type: summarize
        template: >
          😈 ウルフ逃げ切り！ 実際の少数派は {wolf_name} でしたが投票は別の人に集中しました（{vote_results}）。
          少数派の勝利です。
