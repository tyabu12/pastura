turns:
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Globe-Trotter Gary
  fields:
    statement: The jet lag from crossing the International Date Line caused my internal clock to revolt against punctuality.
    inner_thought: This plays on global time zones and personal discomfort.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Dr. Quantum Quinn
  fields:
    statement: My temporal displacement field briefly folded spacetime, rendering my arrival time non-linear.
    inner_thought: This uses high-level physics jargon to sound incredibly technical and unprovable.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Tearjerker Theo
  fields:
    statement: I was unexpectedly held hostage by a flock of migratory geese who demanded I share my emergency thermos.
    inner_thought: This sounds suitably pathetic and dramatic for Tearjerker Theo.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Brazen Bella
  fields:
    statement: Lateness was actually a necessary preamble to establishing an atmosphere of suspense for the ensuing discussion.
    inner_thought: This sounds suitably arrogant and sets me apart from mere physical or temporal mishaps.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Globe-Trotter Gary
  fields:
    vote: Dr. Quantum Quinn
    reason: The concept of temporal displacement fields is significantly more outlandish and memorable than jet lag.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Dr. Quantum Quinn
  fields:
    vote: Brazen Bella
    reason: The concept of using lateness as a deliberate tactic is the most cleverly constructed and memorable excuse presented.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Tearjerker Theo
  fields:
    vote: Dr. Quantum Quinn
    reason: Dr. Quantum Quinn's excuse about temporal displacement sounds the most wonderfully absurd and intellectually engaging.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Brazen Bella
  fields:
    vote: Globe-Trotter Gary
    reason: His excuse about jet lag is relatable, even if it's a bit cliché.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Globe-Trotter Gary
  fields:
    statement: The global supply chain collapse caused a sudden vacuum in desk resources.
    inner_thought: This links the pudding incident to massive geopolitical instability, fitting my scale-fraud persona perfectly.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Dr. Quantum Quinn
  fields:
    statement: The localized temporal distortion field caused the pudding to phase-shift into my digestive tract instantaneously.
    inner_thought: This uses pseudo-physics jargon to sound incredibly complex and unprovable.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Tearjerker Theo
  fields:
    statement: Oh, the sheer tragedy is that a single rogue speck of vanilla bean was trying to escape my grasp.
    inner_thought: This uses classic sentimental drama to make the minor incident sound like a cosmic disaster.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Brazen Bella
  fields:
    statement: I didn't eat it; I was merely conducting a highly experimental, clandestine taste test on the structural integrity of office confectionery.
    inner_thought: This sounds sophisticated and completely unbelievable.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Globe-Trotter Gary
  fields:
    vote: Dr. Quantum Quinn
    reason: The temporal distortion field sounds suitably complex and leaves room for further, ridiculous elaboration.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Dr. Quantum Quinn
  fields:
    vote: Brazen Bella
    reason: Brazen Bella's explanation sounds the most calculated and deceptive, implying intent rather than mere accident.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Tearjerker Theo
  fields:
    vote: Dr. Quantum Quinn
    reason: The temporal distortion field sounds scientifically elaborate and fits the high-concept nature of this competition better than simple supply chain issues.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Brazen Bella
  fields:
    vote: Dr. Quantum Quinn
    reason: The temporal distortion field explanation is the most scientifically absurd and thus quite entertaining.
