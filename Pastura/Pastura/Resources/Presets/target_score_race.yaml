id: target_score_race
language: ja
name: 先取りゲーム
description: >
  投票で得点を奪い合い、目標点に先に届いた人が優勢を掴むゲーム。
  ラウンド末の総括が状態によって切り替わる conditional phase のデモ。
agents: 3
rounds: 4
context: >
  あなたは得点争いゲームの参加者です。ルールを正確に把握してください。
  - 毎ラウンド、自分以外の1人に投票します。投票された人に1点入ります
    （自分の点は自分では増やせない＝誰かに投票してもらう必要がある）。
  - ゲームは全4ラウンド必ず行います。誰かが3点に達してもゲームは続きます。
  - 「3点到達」は優勢という節目の演出にすぎず、勝敗は最終ラウンド終了時点の
    総得点で決まります。途中で勝者は確定しません。
  自分の立場に沿って、最後まで駆け引きを続けてください。

personas:
  - name: アオイ
    description: >
      【立場】戦術家。同盟と裏切りを使い分けて一歩抜け出したい。
      口調は冷静で論理的。例:「確率論で言うとここは…」
  - name: ハルト
    description: >
      【立場】正直者。自分が一番面白いと思った相手に素直に投票する。
      口調は素朴で率直。例:「今のは純粋にうまかった」
  - name: リオ
    description: >
      【立場】ムードメーカー。場を盛り上げつつ漁夫の利を狙うタイプ。
      口調は明るくお調子者。例:「みんな仲良くしようよー(裏では計算)」

phases:
  - type: speak_all
    prompt: >
      現在のスコア: {scoreboard}
      ラウンド {current_round} / 全4ラウンド 開始。
      まだ最終決着はついていません。あなたのキャラクターの立場を保ったまま、
      1〜2文で今ラウンドの戦略を宣言してください。ブラフや誘導もOK。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      現在のスコア: {scoreboard}
      これまでの宣言:
      {conversation_log}
      自分以外で最も応援したい／活躍したと思う相手に投票してください
      （投票した相手に1点入ります）。
      投票先は次のいずれかを正確に書くこと: {candidates}
    exclude_self: true
    output:
      vote: string
      reason: string

  - type: score_calc
    logic: vote_tally

  - type: conditional
    if: "max_score >= 3"
    then:
      - type: summarize
        template: >
          🏆 R{current_round}: 3点到達者が出現（優勢）！ スコア: {scoreboard}
          ただし決着は最終ラウンドまで持ち越し。逆転の余地あり。
    else:
      - type: summarize
        template: >
          R{current_round} 終了。スコア: {scoreboard}
          まだ3点に到達した参加者はいません。
