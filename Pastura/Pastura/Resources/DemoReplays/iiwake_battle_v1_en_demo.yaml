turns:
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Globe-Trotter Gary
  fields:
    statement: The geopolitical instability caused by a rogue satellite drifting across the Pacific directly impacted my ability to adhere to schedule.
    inner_thought: A space-based excuse involving global politics should sound suitably absurd and world-weary.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Dr. Quantum Quinn
  fields:
    statement: My temporal signature experienced a localized phase shift, rendering my arrival time non-linear across standard spacetime metrics.
    inner_thought: This uses quantum physics jargon to sound incredibly complex and completely unprovable.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Tearjerker Theo
  fields:
    statement: I was momentarily paralyzed by the sheer overwhelming grief of realizing I had forgotten to feed my beloved, very ancient houseplant, and its resulting existential despair caused a catastrophic delay.
    inner_thought: This is suitably dramatic and leans into my sentimental nature while sounding completely unbelievable.
- round: 1
  phase_index: 1
  phase_type: speak_each
  agent: Brazen Bella
  fields:
    statement: Look, I wasn't late; I was optimizing my arrival time for maximum dramatic effect, which is clearly superior to boring punctuality.
    inner_thought: This excuse leans into the theme of spectacle and defiance, fitting Brazen Bella's style perfectly.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Globe-Trotter Gary
  fields:
    vote: Dr. Quantum Quinn
    reason: The concept of non-linear spacetime metrics is the most absurd and scientifically detached explanation for being late.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Dr. Quantum Quinn
  fields:
    vote: Globe-Trotter Gary
    reason: The geopolitical instability excuse is the most complex and sounds genuinely serious, leveraging high-level concepts to sound undeniably plausible.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Tearjerker Theo
  fields:
    vote: Dr. Quantum Quinn
    reason: Dr. Quantum Quinn's excuse involving temporal signatures sounds the most scientifically elaborate and therefore the most plausible, even in this ridiculous scenario.
- round: 1
  phase_index: 2
  phase_type: vote
  agent: Brazen Bella
  fields:
    vote: Dr. Quantum Quinn
    reason: The concept of a temporal signature phase shift is far more absurd and abstract than geopolitical instability or plant grief, making it the most memorable and unbelievable excuse.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Globe-Trotter Gary
  fields:
    statement: The sheer geopolitical instability caused a temporal shift that made the pudding temporally inaccessible to my immediate consumption.
    inner_thought: This sounds suitably dramatic and blames global chaos for my minor snack crime.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Dr. Quantum Quinn
  fields:
    statement: My digestive tract initiated a quantum entanglement with the pudding molecules, causing a localized state collapse that resulted in instantaneous molecular assimilation.
    inner_thought: This sounds sufficiently complicated and scientifically absurd.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Tearjerker Theo
  fields:
    statement: Oh, the betrayal! That pudding held a secret recipe my late Aunt Mildred used to make, and I felt compelled by her memory to consume it in silent mourning.
    inner_thought: This one leans into sentimental grief and legacy, which should appeal to the emotional core of the judges.
- round: 2
  phase_index: 1
  phase_type: speak_each
  agent: Brazen Bella
  fields:
    statement: I didn't eat the pudding; I simply initiated a symbiotic relationship with it, and now we are sharing vital nutritional data.
    inner_thought: This sounds both scientific and completely ridiculous, leaning into my 'owning it' persona.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Globe-Trotter Gary
  fields:
    vote: Dr. Quantum Quinn
    reason: The quantum entanglement explanation is the most scientifically absurd and therefore the most memorable way to explain a simple act of eating.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Dr. Quantum Quinn
  fields:
    vote: Brazen Bella
    reason: Brazen Bella's excuse about a symbiotic relationship with the pudding sounds the most uniquely fabricated and memorable.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Tearjerker Theo
  fields:
    vote: Dr. Quantum Quinn
    reason: The quantum entanglement story is the most creative and sounds genuinely baffling, which fits the high-concept nature of this show better than sentimental grief.
- round: 2
  phase_index: 2
  phase_type: vote
  agent: Brazen Bella
  fields:
    vote: Dr. Quantum Quinn
    reason: Dr. Quantum Quinn's explanation involving quantum entanglement is the most creative and absurdly scientific, making it the most memorable excuse among the group.
