<style>
:root{--screen-bg:#FCFAF4;--bubble-bg:#FFFFFF;--promo-bg:#FBFAF2;--ink:#2D2E26;--ink-2:#5A5A55;--muted:#8A8A83;--rule:#E0DBCE;
--moss:#8A9A6C;--moss-dark:#6B7852;--moss-ink:#3D4030;--moss-soft:#D4CBA8;--selected:rgba(138,154,108,.20);
--font-sans:"Noto Sans JP",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--font-sans);background:var(--screen-bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 7px;font-family:var(--font-mono);font-size:14px;font-weight:600}
.sb .r{display:flex;align-items:center;gap:6px;color:var(--ink)}.sb .r svg{display:block}
.title{display:flex;flex-direction:column;align-items:center;padding:13px 0 4px}.title span{font-size:19px;font-weight:700;letter-spacing:.02em}
.title .c{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;margin-top:3px}

.lblrow{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 20px 6px}
.lblrow .l{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-2)}

.meta{display:flex;align-items:center;gap:7px;margin-top:5px}
.meta .sheep{display:flex;gap:2px}.meta .sheep svg{width:18px;height:18px;display:block}
.meta .sep{color:var(--muted);font-size:9px}.meta .tm{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);letter-spacing:.02em}

.list{margin:0 16px;background:var(--bubble-bg);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.row+.row{border-top:1px solid var(--rule)}
.row .bd{flex:1;min-width:0}
.row .nm{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.row .res{font-size:11.5px;color:var(--ink-2);line-height:1.4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{width:15px;height:15px;color:var(--muted);flex:none}

.dock{position:absolute;left:0;right:0;bottom:0;height:100px;display:flex;justify-content:center;align-items:flex-start;padding:14px 0 0}
.tabbar{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.86);border:1px solid var(--rule);border-radius:24px;padding:7px;backdrop-filter:blur(14px);box-shadow:0 4px 14px -8px rgba(90,100,60,.25)}
.tab{width:56px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tab svg{width:24px;height:24px}.tab.on{background:var(--selected);color:var(--moss-dark)}
</style></head><body>
