# .swiftlint.yml
included:
  - Pastura
  # Headless harness package sources (ADR-013) — same lint discipline as app code.
  - tools/harness

excluded:
  - Pastura/Resources
  # Workspace-relative DerivedData lands here; don't lint SPM checkouts
  # + Xcode-generated build artifacts.
  - Pastura/DerivedData

disabled_rules:
  - line_length          # YAML-heavy string literals exceed 120 chars
  - todo                 # Allow TODO/FIXME during MVP development
  - force_cast           # Needed for Yams [String: Any] manual mapping

identifier_name:
  excluded:
    - db  # GRDB convention for database connection parameter
    - t   # GRDB convention for table definition builder
    - i   # Standard loop variable
    - id  # Common identifier property
    - ja  # ISO 639-1 code — Translation Table column key (ADR-010 D7)
    - en  # ISO 639-1 code — Translation Table column key (ADR-010 D7)
    - ok  # Harness JSONL run-status contract value (RunStatus.ok)

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - fatal_error_message
  - first_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing

# Analyzer-only rules (require `swiftlint analyze`, not `swiftlint lint`).
# NOTE: no pipeline runs `analyze` today — CI, the git pre-commit hook, and
# the Claude Code edit hook all run `swiftlint lint` only — so these are
# armed-but-dormant, not enforced. Listed here for correct placement (the
# lint warning that asked for this section) + intent if `analyze` is ever wired up.
analyzer_rules:
  - unused_import

custom_rules:
  # i18n leak tripwire (#292) — fires on the empirical 10 property names
  # surfaced by the PR #288 audit + LocalizedError cleanup in PR #299. This
  # is a TRIPWIRE for the common `errorMessage = "..."` leak shape, NOT a
  # coverage check; broad coverage is Tier 2's job (see
  # `scripts/check_i18n_potential_keys.py`). The narrow property-name list is
  # what keeps the false-positive rate at zero — widening to all `String`
  # assignments would re-introduce noise that drowned out the empirical
  # signal in PR #288's analysis. To extend when a new ViewModel lands a
  # user-facing `String?` property: append the property name to the regex
  # alternation. See `docs/i18n/leak-detection.md` for the full architecture.
  unwrapped_user_facing_string:
    name: "Unwrapped user-facing String"
    regex: '(errorMessage|validationErrors|alertMessage|toastMessage|nameError|descriptionError|conditionError|promptError|outcomeAlert|deepLinkError|loadError)\s*(?:=|\+=)\s*\[?\s*"[^"]+"'
    included:
      - 'Pastura/Pastura/.*\.swift'
    severity: warning
    message: "User-facing String must be wrapped with String(localized: \"...\") so it lands in Localizable.xcstrings and gets a `ja` translation. See the CLAUDE.md 'User-facing String literals' convention and docs/i18n/leak-detection.md."

  # Form A interpolation hazard (#629) — `String(localized: "...\(x)...")`
  # (Swift-interpolation, "Form A") produces a `%arg` catalog key, but the
  # runtime lookup key resolves the interpolation to `%@`/`%lld` and misses
  # it on non-base locales → silent English fallback on ja (observed #578,
  # fixed #579). No prior gate caught this. Use Form B
  # `String(format: String(localized: "...%@..."), arg)` instead. The regex
  # spans the multi-line `localized:`-on-next-line form; `\s*` matches the
  # newline. `match_kinds` restricts to the source-token kinds a real
  # callsite produces so the rule does NOT fire on the same pattern quoted
  # inside a comment (e.g. SettingsView.swift documents Form A as a negative
  # example). Form B is safe: its localized literal holds `%@`, never `\(`.
  form_a_localized_interpolation:
    name: "Form A localized interpolation"
    regex: 'String\(\s*localized:\s*"[^"]*\\\('
    match_kinds:
      - identifier
      - string
      - string_interpolation_anchor
    included:
      - 'Pastura/Pastura/.*\.swift'
    severity: error
    message: "String(localized: \"...\\(x)...\") (Form A) silently falls back to English on ja — the interpolated runtime key misses the %arg catalog entry. Use Form B: String(format: String(localized: \"...%@...\"), x). See .claude/rules/i18n.md § 'Form A is a runtime hazard at user-facing callsites'."

  # ADR-002 §12 — `tryClaimGeneratingGuard` / `forceClaimGeneratingGuard` are
  # internal-access only because the cross-file `+Lifecycle.swift` extension
  # cannot reach the `private` `generatingGuard`. They are NOT a public
  # contract: the only legitimate caller is `acquireGenerateGuard` in
  # `+Lifecycle.swift`. A future caller that touches these directly would
  # resurrect the multi-waiter race that Issue #221 fixed (separate wait +
  # claim != atomic wait-and-claim). This rule blocks accidental re-introduction.
  generating_guard_helpers_scope:
    name: "generating_guard_helpers_scope"
    regex: '\b(tryClaimGeneratingGuard|forceClaimGeneratingGuard)\b'
    match_kinds:
      - identifier
    included:
      - 'Pastura/Pastura/.*\.swift'
    excluded:
      - 'Pastura/Pastura/LLM/LlamaCppService\.swift'
      - 'Pastura/Pastura/LLM/LlamaCppService\+Lifecycle\.swift'
    severity: error
    message: "tryClaim/forceClaimGeneratingGuard are the private contract for acquireGenerateGuard (LlamaCppService+Lifecycle.swift). Use acquireGenerateGuard(caller:) instead — see ADR-002 §12."

  # ADR-028 dark-mode pairing (#1284) — a shadow is an occlusion cue, not a
  # surface, so its colour must be fixed in BOTH appearances. A paired
  # `Color.*` alias inverts: `Color.mossInk` is #3D4030 in light (a correct
  # shadow) but resolves `nightMossInk` #C6CBB1 in dark, turning the shadow
  # into a pale halo. Silent — no diagnostic, and the light build looks right.
  # Read `PasturaPalette.<token>.color` instead; design-system §4.3's
  # `PasturaShadows` already fix their tint for the same reason. A `.stroke` /
  # `.overlay` hairline is the opposite case (it reads AGAINST the surface, so
  # it follows the appearance) and is deliberately not matched.
  #
  # The regex stops at the alias name, before `radius:` / `.opacity(0.22)`:
  # `match_kinds` drops a match that spans a kind not listed, so reaching a
  # numeric literal would make the rule fail OPEN.
  shadow_color_paired_alias:
    name: "Shadow colour reads a paired alias"
    regex: '\.shadow\(\s*color:\s*Color\.[a-zA-Z]'
    match_kinds:
      - identifier
      - typeidentifier
    included:
      - 'Pastura/Pastura/.*\.swift'
    severity: error
    message: "A shadow must be fixed in both appearances — the Color.* aliases pair, so in dark this inverts into a pale halo. Use PasturaPalette.<token>.color. See .claude/rules/swiftui-traps.md § 'A shadow(color:) must not read a paired Color.* alias'."

  # ADR-028 dark-mode pairing (#1284) — `.borderedProminent` fills from the
  # ambient `\.tint` with the system's own white prominent label. `RootTabView`
  # tints the TabView `Color.moss`, a paired token, so the label measures
  # ≈3.03:1 in light and ≈2.13:1 in dark — below even the 3:1 non-text bar, and
  # WORSE under dark. Outside the tab hierarchy it falls back to `AccentColor`,
  # the same moss. Use `PasturaPrimaryButtonStyle` (`mossDark` fill +
  # `inkOnAccent` label: ≈4.74:1 light / ≈7.12:1 dark), which also opts out of
  # iOS 26's Liquid Glass capsule that §5.8 avoids for every other control.
  #
  # One sanctioned exemption, carrying `swiftlint:disable:next` + its rationale:
  # `PasturaApp.swift`'s destructive "Reset Database". `role: .destructive`
  # replaces the tint fill with the system red, so it never had this defect.
  # `match_kinds` keeps the rule off the doc comments that argue for it
  # (`PasturaPrimaryButtonStyle.swift`, `HomePausedCard.swift`).
  bordered_prominent_button_style:
    name: "System prominent button style"
    regex: '\.buttonStyle\(\s*\.borderedProminent\s*\)'
    match_kinds:
      - identifier
    included:
      - 'Pastura/Pastura/.*\.swift'
    severity: error
    message: "`.borderedProminent` fills from the moss tint with a white system label — ≈3.03:1 light, ≈2.13:1 dark. Use PasturaPrimaryButtonStyle. A destructive-role button is the documented exemption; see PasturaPrimaryButtonStyle's doc comment."
