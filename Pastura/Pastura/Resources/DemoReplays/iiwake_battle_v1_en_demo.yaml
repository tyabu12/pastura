metadata:
  title: Excuse Escalation
  description: A battle where contestants take turns making excuses for the same blunder. Each excuse has to be bolder and bigger in scale than the last or it gets buried — a turn-based comedy game where going later is an advantage but overreaching backfires.
  language: en
  recorded_at: '2026-06-23T00:50:58Z'
  recorded_with_model: gemma4_e2b_q4km
