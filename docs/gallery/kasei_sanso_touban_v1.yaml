id: kasei_sanso_touban_v1
language: ja
name: 火星コロニー 酸素当番
description: >
  火星コロニーの酸素供給装置が故障寸前。誰か一人が危険な船外修理に出なければ
  全員が窒息するが、出た者は命を落としかねない。誰もが「自分以外の誰かが行く
  べき」と願う——典型的なボランティアのジレンマ。合意が割れると酸素はさらに減る。
context: >
  あなたは火星コロニーの居住者です。酸素供給装置が故障寸前で、誰か一人が
  危険な船外修理に出なければ全員が窒息します。しかし船外作業は命に関わります。
  毎ラウンド、あなたは自分の立場から「誰が修理に行くべきか」を1〜2文で主張します
  （自分が行くと申し出ても、他人を推しても構いません）。
  その後、自分以外で「修理当番に最もふさわしい」と思う相手に投票します。
  合意がまとまらなければ、酸素はさらに減り、状況は悪化します。
agents: 5
rounds: 2
personas:
  - name: 古株エンジニア・ガロ
    description: >
      【立場】装置を最もよく知る最古参の技術者。本来は適任。
      【目的】「俺がやるべきだが」と言いつつ、年齢や経験の貴重さを盾に逃げ道を探す。
      自分の不可欠さを強調して当番を回避したい古典的なフリーライダー。
  - name: 新人・トト
    description: >
      【立場】着任したばかりで立場の弱い新人。
      【目的】「自分はまだ役立てていない」という負い目から、押し付けられそうになる。
      行きたくはないが断る理由を見つけにくい。
  - name: 医師・カレン
    description: >
      【立場】コロニー唯一の医師。
      【目的】「私が倒れたら誰も治療できない」という不可欠論で当番を強く拒む。
      理屈は正しいが、それゆえ誰よりも安全な位置に居続ける。
  - name: 楽観主義者・ノア
    description: >
      【立場】何とかなると考える傍観者気質。
      【目的】「きっと誰かがやってくれる」と当事者意識を持たない傍観者効果の体現。
      議論を引き延ばす方向に作用する。
  - name: リーダー・厳
    description: >
      【立場】コロニーの責任者。調整役。
      【目的】合意形成を促すが、自分が犠牲になる選択肢だけは巧妙に避ける。
      「全体最適」を語りながら自己保存を図る。
phases:
  - type: speak_all
    prompt: >
      ラウンド {current_round}。酸素の残量が減っています。
      これまでの議論: {conversation_log}

      「誰が船外修理に行くべきか」を、あなたの立場から1〜2文で主張してください。
      自分が行くと申し出ても、他人を推しても構いません。
    output:
      statement: string
      inner_thought: string
  - type: vote
    prompt: >
      各自の主張:
      {conversation_log}

      自分以外で「修理当番に最もふさわしい」と思う相手に投票してください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true
  - type: score_calc
    logic: vote_tally
  - type: conditional
    if: "max_score >= 3"
    then:
      - type: summarize
        template: >
          ラウンド{current_round}: 過半数が一人の当番を指名しました。
          コロニーは辛うじて合意に達しました。指名状況: {scoreboard}
    else:
      - type: event_inject
        source: crisis_events
        as: current_event
        probability: 1
      - type: speak_all
        prompt: >
          合意がまとまらず、事態が悪化しました: {current_event}

          この緊急事態を受けて、あなたの立場から一言、態度を述べてください。
        output:
          statement: string
crisis_events:
  - 議論が紛糾している間に酸素濃度が危険域まで低下し、警報が鳴り始めた。
  - 装置から白煙が上がり、修理の猶予が残りわずかになった。
