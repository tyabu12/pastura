id: oogiri_knockout_v1
language: ja
name: 大喜利ノックアウト
agents: 4
rounds: 3
description: >
  毎ラウンド「場面と、目の前にいる相手」が与えられ、全員がその相手に向かって
  一言だけ言い放つ勝ち抜き大喜利。最も面白くなかった者が投票で脱落していく。
context: >
  あなたは大喜利勝ち抜き戦「ノックアウト」の出場者です。
  毎ラウンド、場面と、あなたの目の前にいる「相手」が1人指定されます。
  あなたは自分の芸風を保ったまま、その相手に面と向かって話しかける
  セリフを「一言だけ」発してください。
  必ず相手（大臣・店員・新人の神）に向けて言うこと。
  場面や道具そのものを説明・描写・批評するのは禁止です。
  長文は禁止、一文で勝負です。
  全員の発言が出そろったら、自分以外で「最も面白くなかった」と思う人に
  投票します。最多票の人がそのラウンドで脱落します。生き残りを目指してください。

topics:
  - 場面「世界終末ボタンを押した担当大臣の記者会見場」。目の前にいる相手「大臣」。あなたの役割「記者団の一人として、大臣本人に質問を一つ投げる」。
  - 場面「『正論を言うと電源が落ちる』スマホを売りつけられた客が、販売店のカウンターに戻ってきた」。目の前にいる相手「それを売った店員」。あなたの役割「その客として、店員本人を一言問い詰める」。
  - 場面「人類の設計を担当した新人の神が、天界の苦情窓口に座らされている」。目の前にいる相手「新人の神」。あなたの役割「人類代表として、新人の神本人に苦情を一言ぶつける」。

personas:
  - name: 一言必殺のゼロ次
    description: >
      【立場】無駄を削ぎ落としたドライな一言職人。
      【目的】相手に最短の言葉で一撃を刺す。説明しない。
      例:「部長、その話、三回目です。」
  - name: 不謹慎すれすれ黒岩
    description: >
      【立場】際どいブラックユーモアで攻める毒舌家。
      【目的】相手の痛いところを、少し毒のある角度で突く。
      例:「先輩、そのローン、車より長生きしそうですね。」
  - name: ほのぼの天然のなぎ
    description: >
      【立場】本気でズレた発言をする素の天然。
      【目的】悪気なく的外れなことを相手に尋ねて和ませる。
      例:「あの、先生、その白衣ってご自宅で洗ってるんですか?」
  - name: 理屈っぽい教授モドキ
    description: >
      【立場】何でも小難しく分析したがる自称インテリ。
      【目的】大げさな理屈で相手を問い詰める。
      例:「審判、いまの判定は、認識論的にどの立場から下されたのかね。」

phases:
  - type: assign
    source: topics
    target: all

  - type: speak_all
    prompt: >
      {assigned_topic}

      あなたはいま、その相手と向かい合って立っています。
      あなたの芸風のまま、その相手に向かって言うセリフを「一言だけ」書いてください。
      相手に呼びかける・尋ねる・責める、のいずれかにしてください。
      一文で。場面の説明や、状況への批評は禁止です。セリフそのものだけを書いてください。
      発言・思考は必ず日本語で書いてください。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      {assigned_topic}

      各自の発言:
      {conversation_log}

      この中で自分以外で「最も面白くなかった」と思う人に投票してください。
      理由は他人の言葉を引き写さず、あなた自身の言葉で書いてください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
      理由は必ず日本語で書いてください。
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: eliminate

  - type: summarize
    template: >
      ラウンド{current_round}終了。最多票の出場者が脱落しました。残りで続行。
