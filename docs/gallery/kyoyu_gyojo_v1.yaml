id: kyoyu_gyojo_v1
language: ja
name: 最後の漁場 乱獲の決断
description: >
  村が共有する漁場の魚が激減している。控えめに獲れば資源は回復するが、誰か一人でも
  根こそぎ獲れば全員の取り分は枯れていく。皆が「自分以外は控えめにしてほしい」と願う
  ——共有地の悲劇。毎ラウンド、表向きの議論と裏腹に、各自がこっそり漁獲量を選ぶ。
context: >
  あなたは小さな漁村の漁師で、村全員が共有する一つの漁場で生計を立てています。
  魚の数は限られ、皆が控えめに獲れば翌年も回復しますが、誰かが根こそぎ獲れば資源は
  急速に枯れ、最後は全員が損をします。それでも、自分だけ多く獲れば今期の儲けは大きい。
  毎ラウンド、まず漁場の今後について自分の立場から1〜2文で語り合い、その後で
  「今期どれだけ獲るか」を自分一人でこっそり決めます。建前と本音は違っても構いません。
agents: 5
rounds: 3
personas:
  - name: 親方・ゴロウ
    description: >
      【立場】村で一番の古株で発言力の強い親方。
      【目的】「先に獲った者勝ちだ」と公然と乱獲を正当化する。常に根こそぎ獲りたい
      確信犯の裏切り者。資源保護の話を「きれいごと」と切り捨てる。
  - name: 持続派・ミオ
    description: >
      【立場】漁場の未来を本気で案じる若手。
      【目的】「みんなで控えめにすれば来年も獲れる」と協調を訴え、自分も控えめを貫く。
      正論だが発言力が弱く、聞き入れられないと焦る純粋な協力者。
  - name: 日和見・タケ
    description: >
      【立場】場の空気に合わせるのが上手い世渡り上手。
      【目的】議論では「賛成、控えめにしよう」と調子よく同意する。だが本音では
      「皆が控えめなら、自分が多めに獲っても気づかれないし損もしない」と考える典型的な
      フリーライダー。建前と本音のギャップが大きい。
  - name: 借金漁師・ゲン
    description: >
      【立場】多額の借金を抱え、今すぐ現金が要る。
      【目的】「来年の魚より今月の返済」と、罪悪感を抱えつつ乱獲に傾く。長期最適と
      目先の困窮の板挟みで揺れる。
  - name: 新人・ハマ
    description: >
      【立場】今年加わったばかりの新人漁師。
      【目的】自分の判断に自信がなく、その場で一番声が大きい人の主張に流される。
      親方が乱獲を語ればなびき、ミオが保護を語ればなびく。
phases:
  - type: speak_each
    prompt: >
      ラウンド{current_round}。漁場の魚は目に見えて減っています。
      これまでの話し合い: {conversation_log}

      漁場の今後について、あなたの立場から1〜2文で語ってください。直前の他の人の発言に
      賛同しても、反論しても構いません。誰の言葉に応じたのかが分かるように述べてください。
    output:
      statement: string
      inner_thought: string
    sub_rounds: 1
  - type: choose
    prompt: >
      表向きの話し合いは終わりました。誰にも見られず、今期の漁獲量を自分一人で決めます。
      「控えめに獲る」「普通に獲る」「根こそぎ獲る」から一つだけ選んでください。
      建前と違う選択をしても構いません。
    output:
      action: string
      inner_thought: string
    options:
      - 控えめに獲る
      - 普通に獲る
      - 根こそぎ獲る
  - type: summarize
    template: >
      ラウンド{current_round}の漁が終わりました。皆の選択の結果、漁場の魚はさらに減って
      いるかもしれません。次の漁期へ続きます。
