# Dependabot version updates for Pastura.
#
# Two ecosystems are tracked:
#   1. swift           SPM dependencies declared in the Xcode project
#                      (Yams, GRDB, mattt/llama.swift). Per GitHub's
#                      2026-03-31 changelog, Dependabot auto-discovers
#                      Xcode-managed Package.resolved files inside any
#                      .xcodeproj / .xcworkspace under the configured
#                      directory, so pointing `directory: "/Pastura"`
#                      at the parent of Pastura.xcodeproj is sufficient.
#                      If Dependency graph reports the SPM ecosystem as
#                      unparseable after merge, swap `directory:` to
#                      `/Pastura/Pastura.xcodeproj/project.xcworkspace/xcshareddata/swiftpm`
#                      as the explicit fallback.
#   2. github-actions  Actions referenced by .github/workflows/*.yml.
#
# Cadence is monthly. With a single maintainer, weekly PRs create more
# review noise than security benefit. CVE patches still flow through
# Dependabot security updates, which are ENABLED separately under
# Settings > Code security and analysis — this file cannot gate whether
# they run, and the cadence above does not apply to them. It can still
# shape them: an `applies-to: security-updates` group below governs how
# they are batched.

version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/Pastura"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ chore(deps)"
    ignore:
      # mattt/llama.swift tags are date-encoded (e.g. 2.8694.0) rather
      # than semver. Dependabot's semver comparator cannot reliably
      # classify a tag bump as patch / minor / major. Suppress the noisy
      # minor/patch buckets so only apparent-major bumps surface as PRs;
      # upstream llama.cpp CVE response is tracked by watching the fork
      # for new tags and reviewing manually.
      #
      # Name format: github.com/<owner>/<repo>. This is the canonical
      # form Dependabot uses for swift-ecosystem deps in PR titles,
      # branch names, and compatibility-score badges. The Package.resolved
      # `identity` short name (e.g. "llama.swift") does NOT match here
      # and makes the filter a silent no-op.
      - dependency-name: "github.com/mattt/llama.swift"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ chore(ci)"
    groups:
      # github/codeql-action/init and .../analyze are separate Dependabot
      # dependencies but the action refuses to run them at different versions.
      # Ungrouped they drift: #1349 and #1351 were both opened for 4.37.3, only
      # #1349 was rebased onto 4.37.4 before merge, and CodeQL then failed on
      # every scheduled run (#1359). Grouping makes one PR move both.
      #
      # `patterns` takes globs, not the exact dependency names the `ignore:`
      # block above needs — but it shares that block's silent-no-op failure
      # mode: a pattern matching nothing is indistinguishable from "no updates
      # available" on a monthly cadence. The names this must match, as they
      # appear in merged PR titles, are `github/codeql-action/init` and
      # `github/codeql-action/analyze` (and the pre-split `github/codeql-action`
      # of #486). Re-check them before editing the glob.
      #
      # Two entries because `applies-to` defaults to version-updates; without
      # the second, a security update would still split into per-sub-action PRs.
      #
      # Grouping only batches updates Dependabot finds co-available in one run
      # — it does not *enforce* equal versions. The sub-actions share one tag
      # stream (so version updates are always co-stale) and one advisory scope
      # (so a GHSA flags both), which is what makes the batch a lockstep in
      # practice. That is an inherited property, not something this block
      # guarantees; the invariant itself is asserted in codeql.yml.
      #
      # codeql-action is currently the only sub-action family needing lockstep
      # (`gradle/actions/wrapper-validation` is a single dependency, used twice).
      # Adding another such family means adding another group here.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
