# CodeQL static analysis for Pastura's Swift source.
#
# Trigger choice: daily schedule + manual dispatch only.
#
# We intentionally do NOT run on push or pull_request. A full Swift
# CodeQL pass requires a macOS runner with Xcode and a real
# `xcodebuild build` (autobuild is not reliable against the wrapper-
# managed simulator destination Pastura uses). Empirically that adds
# 8 to 15 minutes of CI wall-clock, which would push the lint-and-test
# job's contribution past the project's ~10-minute target and bump up
# against the 20-minute "blocks merge" line (see CLAUDE.md / project
# memory on CI time budget).
#
# Daily cadence is free for public repos (Standard GitHub-hosted runners
# bill at $0 for public repositories), so the previous weekly cadence
# was leaving signal-lag on the table. Findings now arrive with up to a
# 24-hour lag. Before tagging the first public release, still dispatch
# a manual run (Actions tab > CodeQL > Run workflow) so the exact
# release commit is analyzed even if scheduled drift skipped it. If
# Pastura starts receiving external PRs regularly, revisit adding a
# `pull_request` trigger gated to `Pastura/Pastura/**` changes (with
# `if:` on author_association to avoid running it for owner PRs).

name: CodeQL

on:
  schedule:
    # 18:05 UTC daily = 03:05 JST. Off-peak globally; minute offset
    # picked via $RANDOM to avoid the 0/15/30/45 boundaries where
    # GitHub Actions schedulers congest worldwide.
    - cron: "5 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ init and analyze MUST stay on the same version — the action refuses a
      # mixed pair ("Loaded a configuration file for version 'X', but running
      # version 'Y'"), and the failure only surfaces on the next scheduled run.
      # Dependabot tracks the two sub-actions separately, so `.github/dependabot.yml`
      # groups them into one PR to keep them in lockstep.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      # KMP umbrella prerequisites (ADR-023 §6 Stage-5 ruling (a), #1635 PR-B).
      # Once PR-B2 links `PasturaSharedEngine.xcframework` into the app, the
      # wrapper below stages it via `scripts/kmp/assemble-xcframework.sh`, which
      # needs a JDK — so this job carries the same JDK + Gradle/konan caches as
      # `kmp-build-test` in ci.yml (keys copied verbatim so a scheduled run
      # restores what the PR lanes saved). This deliberately does NOT set
      # `PASTURA_SKIP_KMP_STAGE=1` (the shape #1635's text first proposed): the
      # only build here is the wrapper's, and a pbxproj that references the
      # framework fails at link when nothing staged it — a skipped stage is a
      # red nightly, not a faster one. Cold-cache cost lands inside the 60-min
      # job budget; the daily cadence makes it affordable. Verify after PR-B2
      # merges with one manual `workflow_dispatch` — nothing else exercises
      # this workflow before the next schedule.
      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle dependencies (~/.gradle/caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-caches-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle wrapper (~/.gradle/wrapper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Pastura
        # CodeQL traces this xcodebuild invocation to populate its Swift
        # database. The wrapper handles DerivedData pinning, matching
        # the project's other CI jobs. The `build` subcommand uses a
        # generic iOS-Simulator destination and bypasses the simulator
        # gate, so sourcing scripts/sim-dest.sh is unnecessary here.
        run: scripts/xcodebuild.sh build

      # Version must match the init step above — see the note there.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"
