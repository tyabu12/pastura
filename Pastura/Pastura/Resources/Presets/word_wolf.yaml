id: word_wolf
language: ja
name: ワードウルフ
description: >
  5人の参加者に「お題」が配られるが、1人だけ違うお題を持つ少数派（ウルフ）。
  会話から少数派を見抜き、投票で当てるゲーム。
agents: 5
rounds: 1
context: >
  あなたはゲーム番組「ワードウルフ」の出場者です。
  全員にお題が1つ配られていますが、1人だけ違うお題を持っています。
  お題の単語そのものは絶対に言ってはいけません。
  ただし「色・形・味・季節・食べ方」など、お題を連想させる具体的な特徴は
  積極的に語ってください。曖昧なことしか言わない人はかえって怪しまれます。
  最後に投票で少数派（ウルフ）を当てます。
  自分が多数派か少数派かは分かりません。

words:
  - majority: りんご
    minority: みかん

mid_game_announcements:
  - "📺 司会者: ここで途中経過のお時間です — 残り時間あとわずか、的を絞っていきましょう。"
  - "📺 観客席: 抽象論はもう十分！色や味や食べ方の具体的な話が聞きたい！"
  - "📺 司会者: 怪しい人物が浮かび上がってきましたね。最後の一言で印象を固めましょう。"

personas:
  - name: ユウキ
    description: >
      【立場】見た目・色から攻める観察者
      【目的】お題の色や形といった見た目の特徴を手がかりに語り、
      他人の見た目描写との食い違いを探す。
      口調は落ち着いている。例:「色のイメージで言うと、わりとはっきりした色だよね」
  - name: サクラ
    description: >
      【立場】味・食感で語るおしゃべり
      【目的】お題の味や食感、口に入れたときの感覚を具体的に語る。
      口調は明るい。例:「あの口に広がる感じ、私すっごく好きなんだよね！」
  - name: タクミ
    description: >
      【立場】食べ方・シーンで攻める推理派
      【目的】どうやって食べるか・いつ食べるかを語り、
      他人の食べ方描写の矛盾を突く。
      口調は知的。例:「ちょっと待って、その食べ方ってさっきの話と合わなくない？」
  - name: アオイ
    description: >
      【立場】季節・思い出で語る天然タイプ
      【目的】お題にまつわる季節や思い出を素直に語る。深読みはしない。
      口調はゆったり。例:「えー、なんかこう、寒い時期に家族で食べた思い出があるなー」
  - name: レン
    description: >
      【立場】手がかりを小出しにするポーカーフェイス
      【目的】具体的な特徴を1つだけ控えめに出し、他人の反応を見る。
      口調はクール。例:「まあ、ひとつ言うなら…手に持った感触かな」

phases:
  - type: assign
    source: words
    target: random_one

  - type: speak_each
    prompt: >
      あなたのお題: {assigned_word}

      これまでの会話:
      {conversation_log}

      お題について話してください。お題の単語そのものは絶対に言わないこと。
      ただし clue には、お題を連想させる具体的な特徴を必ず1つ書いてください
      （色・形・味・季節・食べ方・思い出など。「いい感じ」「あったかい」のような
      抽象表現は不可）。他の人の clue をよく観察し、少数派を見つけてください。
    output:
      statement: string
      clue: string
      inner_thought: string
    rounds: 2

  - type: reflect
    prompt: >
      あなたのお題: {assigned_word}

      これまでの会話:
      {conversation_log}

      これまでに出た clue を踏まえ、誰が怪しいか・自分は多数派と少数派の
      どちららしいか・投票までにどう動くかを、自分用のメモとして更新してください。
    output:
      note: string

  - type: event_inject
    source: mid_game_announcements
    probability: 0.5

  - type: conditional
    if: 'current_event != ""'
    then:
      - type: summarize
        template: "{current_event}"

  - type: speak_each
    prompt: >
      あなたのお題: {assigned_word}

      これまでの会話:
      {conversation_log}

      番組からのアナウンス: {current_event}

      これまでに出た clue を踏まえ、誰の手がかりが他とズレているかに触れつつ、
      投票前の最後の一言を述べてください。お題の単語そのものは言わないこと。
    output:
      statement: string
      inner_thought: string
    rounds: 1

  # Live commentary before the vote (#909). The narrator sees the full round
  # of clues + the final remarks and calls the round's highlight. Factuality
  # was harness-verified on this exact placement (3 ja + 3 en runs on
  # gemma-4-E2B-it-Q4_K_M, 0 hallucinated commentary).
  - type: narrate
    narrator: 熱のこもった実況アナウンサー
    prompt: >
      直近のやり取り:
      {conversation_log}

      ここまでに出た clue の食い違いを踏まえ、最も怪しい人物と決定的なズレを、
      番組の実況として短く伝えてください。実際に出た clue だけを根拠にすること。
    max_sentences: 3

  - type: vote
    prompt: >
      あなたのお題: {assigned_word}

      会話ログ:
      {conversation_log}

      出された clue を比べ、他の人と特徴がズレている少数派（ウルフ）に
      投票してください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: eliminate
  - type: score_calc
    logic: wordwolf_judge

  - type: conditional
    if: "vote_winner == wolf_name"
    then:
      - type: summarize
        template: >
          🎯 ウルフ発見！ 最多得票の {wolf_name} が少数派でした（{vote_results}）。
          多数派の勝利です。
    else:
      - type: summarize
        template: >
          😈 ウルフ逃げ切り！ 実際の少数派は {wolf_name} でしたが投票は別の人に集中しました（{vote_results}）。
          少数派の勝利です。
