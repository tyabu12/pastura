- round: 2
  phase_index: 1
  phase_type: speak_all
  agent: Coach Blaze
  fields:
    statement: Quit whining! You need to channel that frustration into a power move; start hitting the copier like it owes you money until it spits out your document!
    inner_thought: This is exactly the kind of physical solution this pathetic office worker needs, channeling their anger into aggressive machine interaction.
- round: 2
