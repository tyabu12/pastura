<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--screen-bg:#FCFAF4;--bubble-bg:#FFFFFF;--promo-bg:#FBFAF2;--ink:#2D2E26;--ink-2:#5A5A55;--muted:#8A8A83;--rule:#E0DBCE;
--moss:#8A9A6C;--moss-dark:#6B7852;--moss-ink:#3D4030;--moss-soft:#D4CBA8;--selected:rgba(138,154,108,.20);--success:#7A9270;
--font-sans:"Noto Sans JP",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:var(--font-sans);background:var(--screen-bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden}
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 7px;font-family:var(--font-mono);font-size:14px;font-weight:600}
.sb .r{display:flex;align-items:center;gap:6px;color:var(--ink)}.sb .r svg{display:block}
.title{display:flex;justify-content:center;padding:13px 0 4px}.title span{font-size:19px;font-weight:700;letter-spacing:.02em}

.lblrow{display:flex;align-items:flex-end;padding:20px 20px 6px}
.lblrow .l{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-2)}

.list{margin:0 16px;background:var(--bubble-bg);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.srow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.srow+.srow{border-top:1px solid var(--rule)}
.srow .si{width:20px;height:20px;color:var(--moss);flex:none}
.srow .sl{flex:1;font-size:14.5px;font-weight:500;color:var(--ink)}
.srow .sv{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.srow .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.srow .chev{width:15px;height:15px;color:var(--muted);flex:none}
.foot{text-align:center;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;padding:26px 0 0}

.dock{position:absolute;left:0;right:0;bottom:0;height:100px;display:flex;justify-content:center;align-items:flex-start;padding:14px 0 0}
.tabbar{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.86);border:1px solid var(--rule);border-radius:24px;padding:7px;backdrop-filter:blur(14px);box-shadow:0 4px 14px -8px rgba(90,100,60,.25)}
.tab{width:56px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tab svg{width:24px;height:24px}.tab.on{background:var(--selected);color:var(--moss-dark)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<symbol id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
<symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V20a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 18.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="chip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></symbol>
<symbol id="disk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
<symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 21V4M5 4h11l-1.5 3L16 10H5"/></symbol>
</svg>

<div class="screen">
<div class="sb"><span>9:41</span><span class="r">
 <svg width="18" height="13" viewBox="0 0 18 13" fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>
 <svg width="17" height="13" viewBox="0 0 17 13" fill="currentColor"><path d="M8.5 3.2c2.3 0 4.4.9 6 2.4l1.4-1.5A11 11 0 0 0 8.5 1 11 11 0 0 0 1.1 4.1L2.5 5.6a8.6 8.6 0 0 1 6-2.4z"/><path d="M8.5 7c1.2 0 2.3.5 3.1 1.3l1.4-1.5A6.6 6.6 0 0 0 8.5 5 6.6 6.6 0 0 0 4 6.8l1.4 1.5A4.4 4.4 0 0 1 8.5 7z"/><circle cx="8.5" cy="11" r="1.6"/></svg>
 <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1" opacity=".4"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="4.5" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg>
</span></div>

<div class="title"><span>設定</span></div>

<div class="lblrow"><span class="l">モデル</span></div>
<div class="list">
 <div class="srow"><svg class="si"><use href="#chip"/></svg><span class="sl">使用中のモデル</span><span class="sv"><span class="dot"></span>Gemma 3 4B</span><svg class="chev"><use href="#chev"/></svg></div>
 <div class="srow"><svg class="si"><use href="#disk"/></svg><span class="sl">ストレージ</span><span class="sv">2.9 GB</span><svg class="chev"><use href="#chev"/></svg></div>
</div>

<div class="lblrow"><span class="l">情報</span></div>
<div class="list">
 <div class="srow"><svg class="si"><use href="#shield"/></svg><span class="sl">プライバシーポリシー</span><svg class="chev"><use href="#chev"/></svg></div>
 <div class="srow"><svg class="si"><use href="#doc"/></svg><span class="sl">オープンソースライセンス</span><svg class="chev"><use href="#chev"/></svg></div>
 <div class="srow"><svg class="si"><use href="#flag"/></svg><span class="sl">コンテンツを報告</span><svg class="chev"><use href="#chev"/></svg></div>
</div>

<div class="foot">Pastura · バージョン 0.3.0</div>

<div class="dock">
 <div class="tabbar">
  <div class="tab"><svg><use href="#home"/></svg></div>
  <div class="tab"><svg><use href="#search"/></svg></div>
  <div class="tab"><svg><use href="#clock"/></svg></div>
  <div class="tab on"><svg><use href="#gear"/></svg></div>
 </div>
</div>
</div>
</body></html>
