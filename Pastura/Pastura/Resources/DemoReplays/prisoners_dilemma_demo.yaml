- round: 1
  phase_index: 2
  phase_type: choose
  agent: リュウジ
  fields:
    inner_thought: 協力なんて馬鹿げてる。俺が裏切ってでも点数を稼ぐ方がマシだ。ミサキの甘い期待を打ち砕いてやるぜ。
