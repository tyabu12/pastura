# Deploys public-facing HTML under `pages/` to GitHub Pages. Currently:
#
#   - `pages/index.html`                   → `https://pastura.app/`
#     (Marketing landing page — see #345)
#   - `pages/css/base.css`                 → `https://pastura.app/css/base.css`
#   - `pages/css/lp.css`                   → `https://pastura.app/css/lp.css`
#   - `pages/css/page.css`                 → `https://pastura.app/css/page.css`
#     (Shared design tokens + LP layout + prose styling for legal/support)
#   - `pages/css/anim.css`                 → `https://pastura.app/css/anim.css`
#     (Fade-up animation stylesheet — hero entrance + scroll reveal — see #377)
#   - `pages/js/anim.js`                   → `https://pastura.app/js/anim.js`
#     (Vanilla-JS runtime that toggles `.is-entered` / `.is-in` on the LP — see #377)
#   - `pages/img/app-icon.png`             → `https://pastura.app/img/app-icon.png`
#   - `pages/img/favicon-64.png`           → `https://pastura.app/img/favicon-64.png`
#     (Brand mark + favicon, sourced from the iOS app icon)
#   - `pages/img/app-store-badge-en.svg`      → `https://pastura.app/img/app-store-badge-en.svg`
#     (Apple's official "Download on the App Store" badge, used as a
#     dimmed pre-launch CTA. Do not modify the SVG content.)
#   - `pages/img/app-store-badge-ja.svg`      → `https://pastura.app/img/app-store-badge-ja.svg`
#     (Apple's official Japanese App Store badge. Intrinsic size is
#     ~109×40 vs the EN badge's 120×40; the JA LP drops hardcoded
#     width so the badge renders at native aspect. Do not modify the
#     SVG content.)
#   - `pages/support/index.html`           → `https://pastura.app/support/`
#     (App Store Connect Support URL — see ADR-005 §6 / §6.7 / §9.2 row #9 / #182)
#   - `pages/legal/privacy-policy/index.html`
#                                          → `https://pastura.app/legal/privacy-policy/`
#     (App Store privacy policy URL — see ADR-005 §9.2 / #233)
#   - `pages/ja/index.html`                → `https://pastura.app/ja/`
#     (Japanese mirror of the marketing landing page — see #369)
#   - `pages/ja/support/index.html`        → `https://pastura.app/ja/support/`
#     (Japanese mirror of the Support page)
#   - `pages/ja/legal/privacy-policy/index.html`
#                                          → `https://pastura.app/ja/legal/privacy-policy/`
#     (Japanese mirror of the privacy policy page)
#   - `pages/CNAME`                        → `_site/CNAME` (apex custom domain)
#     (Single line `pastura.app`. GitHub Pages reads CNAME from the
#     deployed artifact root to persist `Settings → Pages → Custom
#     domain` across deploys — omission would wipe the custom-domain
#     binding on the next deploy.)
#
# Precondition: Settings → Pages → Source = "GitHub Actions" (NOT
# "Deploy from a branch", which would publish the entire `pages/` tree
# wholesale and bypass the staging discipline below).
#
# Each file under `pages/` is staged into `_site/` by an explicit `cp` so
# that a future addition (favicon, split CSS, additional pages) cannot
# silently 404. **Never** `cp -r pages _site` — that would publish
# editor detritus (`.DS_Store`, drafts) alongside intended content. List
# every new asset in the staging step explicitly.
#
# A `.nojekyll` file is written so a Source-setting regression back to
# branch-based Pages cannot start running the HTML through Jekyll.
#
# Concurrency group `pages` is GitHub's documented convention for Pages
# deploys — any future Pages workflow in this repo must share it so
# deploys serialize correctly. `cancel-in-progress: false` is deliberate:
# cancelling a Pages deploy mid-flight can leave the site in an
# inconsistent state.
#
# A post-deploy smoke check `curl -fsS`'s every deployed URL (HTML AND
# CSS) so silent staging-step omissions surface as a workflow failure
# instead of a 404 noticed days later. CSS coverage matters: HTML 200
# with broken CSS 404 would still pass without it.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage artifact
        # Targeted copy per the discipline note in the file header. If you
        # add a new file under `pages/`, add a matching line here — silent
        # drift on this step means the new asset 404s on the deployed site.
        run: |
          mkdir -p _site/support _site/legal/privacy-policy _site/ja/support _site/ja/legal/privacy-policy _site/css _site/js _site/img
          cp pages/index.html _site/index.html
          cp pages/css/base.css _site/css/base.css
          cp pages/css/lp.css _site/css/lp.css
          cp pages/css/page.css _site/css/page.css
          cp pages/css/anim.css _site/css/anim.css
          cp pages/js/anim.js _site/js/anim.js
          cp pages/img/app-icon.png _site/img/app-icon.png
          cp pages/img/favicon-64.png _site/img/favicon-64.png
          cp pages/img/app-store-badge-en.svg _site/img/app-store-badge-en.svg
          cp pages/img/app-store-badge-ja.svg _site/img/app-store-badge-ja.svg
          cp pages/support/index.html _site/support/index.html
          cp pages/legal/privacy-policy/index.html _site/legal/privacy-policy/index.html
          cp pages/ja/index.html _site/ja/index.html
          cp pages/ja/support/index.html _site/ja/support/index.html
          cp pages/ja/legal/privacy-policy/index.html _site/ja/legal/privacy-policy/index.html
          cp pages/CNAME _site/CNAME
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke-check deployed URLs
        # Pages deploy can succeed structurally while serving the wrong
        # tree (e.g. a stage-step omission that publishes only one of the
        # files). A `curl -fsS` against each registered URL turns those
        # silent failures into a workflow failure. `--retry` covers the
        # short propagation window after `deploy-pages` returns.
        run: |
          set -euo pipefail
          for url in \
            "https://pastura.app/" \
            "https://pastura.app/css/base.css" \
            "https://pastura.app/css/lp.css" \
            "https://pastura.app/css/page.css" \
            "https://pastura.app/css/anim.css" \
            "https://pastura.app/js/anim.js" \
            "https://pastura.app/img/app-icon.png" \
            "https://pastura.app/img/favicon-64.png" \
            "https://pastura.app/img/app-store-badge-en.svg" \
            "https://pastura.app/img/app-store-badge-ja.svg" \
            "https://pastura.app/support/" \
            "https://pastura.app/legal/privacy-policy/" \
            "https://pastura.app/ja/" \
            "https://pastura.app/ja/support/" \
            "https://pastura.app/ja/legal/privacy-policy/"; do
            echo "Checking ${url}"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${url}"
          done
