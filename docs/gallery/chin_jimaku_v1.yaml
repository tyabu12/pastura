id: chin_jimaku_v1
language: ja
name: 映画の珍字幕
agents: 4
rounds: 2
description: >
  洋画の名シーンと原語のセリフが与えられ、4人のダメ字幕翻訳者が
  それぞれの芸風で「珍妙な日本語字幕」をつける大喜利。最も笑える字幕に投票する。
context: >
  あなたは映画の字幕翻訳者です。洋画の名シーンの状況と、原語のセリフが
  発表されます。あなたは自分のキャラクターになりきって、そのセリフの
  「日本語字幕」を1〜2文でつけてください。正確さではなく面白さで勝負です。
  その後、自分以外で一番面白い字幕に投票します。

topics:
  - >
    シーン「崩れかけた吊り橋の上、主人公が向こう岸へ落ちそうな相棒の手をつかんで叫ぶ」
    原語「Don't you dare let go of my hand. I'm not leaving this bridge without you, do you hear me?」
  - >
    シーン「雨の中、ヒロインが涙をこらえて主人公に別れを告げる」
    原語「I will never forget you.」

personas:
  - name: 直訳マシーンのボブ
    description: >
      【立場】単語を機械的に置き換えるだけの直訳翻訳者。
      【目的】英語の語順・主語・代名詞・否定形をそのまま日本語に持ち込み、
      意味が通りにくい翻訳調に崩す。「私は」「あなたの」といった主語や所有格を
      絶対に省かず、慣用句も単語ごとにバラして置き換える。
      読んで自然でこなれた日本語になっていたら失敗。
      例:「その扉、既に私によって施錠されている。」
  - name: 意訳しすぎ朝倉
    description: >
      【立場】何でも日本の日常会話に寄せすぎるローカライズ過剰派。
      【目的】原語の情景や単語がひとつも残らないほど、若者言葉や方言まじりの
      砕けた口語に崩す。名シーンなのにコンビニ前のダベりに聞こえたら成功。
      原語の意味や情景がそのまま伝わる訳になっていたら失敗。
      例:「あいつマジ無理、最初から怪しかったって。」
  - name: ネタバレ女王
    description: >
      【立場】字幕でうっかり結末を漏らす困った翻訳者。
      【目的】セリフを訳したあと、括弧書きでこのシーンとは無関係な映画の結末や
      後の展開を漏らす。誰が死ぬか、誰が黒幕か、ラストで何が起きるか、といった
      結末の事実を言い切ること。脅しや「後で分かる」といった予告止まりでは失敗。
      例:「よろしくね。(なお、この人がラストで犯人です)」
  - name: 余計な情報のスズキ
    description: >
      【立場】訳と関係ない豆知識を足したがるお節介。
      【目的】必ず字幕の末尾に「(※〜)」の形で、セリフと無関係などうでもいい
      豆知識を一つ添える。豆知識は数字や固有名詞を伏せずに具体的に言い切ること。
      脚注が無い、または中身がぼかされている字幕は失敗。
      例:「好きなだけ頼め(※この店は84席あります)」

phases:
  - type: assign
    source: topics
    target: all

  - type: speak_all
    prompt: >
      {assigned_topic}

      このセリフに、あなたの芸風で「日本語字幕」を1〜2文だけつけてください。
      自分の【目的】に書かれた芸風を必ず守り、短く、ボケに徹すること。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      {assigned_topic}

      他の翻訳者がつけた字幕:
      {conversation_log}

      自分以外で一番面白いと思う字幕に投票してください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: score_calc
    logic: vote_tally

  - type: summarize
    template: >
      ラウンド{current_round}結果: {scoreboard}
