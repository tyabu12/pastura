# Nightly full-native backstop for the KMP shared modules (#501 Stage 1 PR-3).
#
# The per-PR counterpart is ci.yml's `kmp-build-test` job, which runs
# JVM tests + a single-target klib COMPILE-ONLY on non-PR events (and on
# most PRs) to stay off the per-PR critical path. That leaves the expensive
# rungs — full native LINK, the Kotlin/Native test-runtime execution of the
# shared `commonTest` suite on the iOS simulator, and XCFramework assembly —
# unverified on `main` until something downstream trips over them. This
# workflow closes that gap as the deferred-verification backstop
# (#501 §"D-B" plan / ADR-023 §6): it exercises the full native rung once a
# day so a K/N-only regression surfaces within 24h instead of at the next
# iOS-consumption attempt.
#
# NOT a required status check. It is a backstop, not a merge gate — adding it
# to the `main` branch-protection ruleset would block every PR until a
# scheduled run happened to exist, which never fits a `schedule`-triggered
# workflow (ci-workflows.md §"Required-check-safe path gating"). Keep it out
# of the ruleset's required-checks list.
name: KMP nightly (#501)

on:
  # Daily full-native run. 01:41 UTC = 10:41 JST sits in the same low-load
  # JST-morning trough ci.yml's daily canary targets (see ci.yml `on.schedule`
  # comment), offset off both existing schedules — ci.yml `11 1` and
  # codeql.yml `5 18` — so the three never contend for a scheduling slot.
  # NOTE: GitHub auto-disables a scheduled workflow after 60 days with no
  # repository activity — harmless for an active repo, the silent stop-firing
  # failure mode otherwise.
  schedule:
    - cron: '41 1 * * *'
  # Manual trigger for on-demand verification (first-run validation of the
  # native rung, and re-checking `main` after a suspected K/N regression).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize runs (a manual dispatch during a scheduled run queues rather than
  # runs concurrently) so two overlapping failures cannot race on the
  # dedupe-by-label issue step below. Non-cancelling: a backstop run should
  # always finish, never be pre-empted.
  group: kmp-nightly
  cancel-in-progress: false

jobs:
  kmp-nightly:
    name: KMP nightly full-native (#501)
    runs-on: macos-26
    # Sizing, MEASURED on run 29509388191 (workflow_dispatch, green, #1135's
    # merge commit). Totals are JOB time — what job-level `timeout-minutes`
    # counts; indented figures are steps within it.
    # ⚠️ The Actions page for that run reads 23.8 min: 9.2 min of it was QUEUE,
    # which the cap does not count. Never size against the run page.
    #
    #   scheduled path .... 9m06s   (546s, derived: total - probe)
    #   + probe step ...... 5m30s   (330s, workflow_dispatch only)
    #   = dispatch path ... 14m36s  (876s, observed)
    #   of which "Full native build + test + XCFramework" .. 7m59s (479s)
    #
    # 30 holds by COMPOSITION rather than a headroom ratio. Every capped step
    # must appear as its cap, and every uncapped one as its measurement:
    #
    #   9m06s   scheduled baseline (measured, pre-#501-PR-C)
    # +   31s   gate-spike build+test step (measured x1.25; UNCAPPED by design)
    # +  15m    Stage-5 probe, at its cap        (workflow_dispatch only)
    # +   2m    gate measurements, at its cap    (workflow_dispatch only)
    # = 26m37s  worst-case dispatch path, against the 30-minute cap
    #
    # ~3m23s of margin. The earlier version of this note omitted the new steps
    # and still concluded "9m06s + 15 = ~24 min", which at the measurement
    # step's original 5-minute cap actually composed to 29m37s — 23s of margin,
    # i.e. the cap was effectively already breached and the note said otherwise.
    # Adding OR REMOVING any step means REDOING this sum, not appending to (or
    # striking from) the prose. The sum's term list must match the job's step
    # list — that is the property that makes an omission detectable. The ~1s
    # SuspendController drift guard once held a term here for exactly that
    # reason; it moved to ci.yml as a per-PR job (#1171), so its term is gone
    # from the sum rather than kept as a harmless rounding error.
    #
    # Note only the `+ 15` and `+ 2` are BOUNDS — the 9m06s and 31s terms are
    # measurements, and the konan clause below is the one known way the first
    # moves. If the cap ever needs raising, relocating the probe to its own
    # workflow is the first lever — the only term the scheduled path does not
    # pay.
    #
    # NOT covered: a cache MISS. That run had a konan exact-key hit; `ci.yml`'s
    # sibling job records the `gradle-caches` restore-key fallback these two
    # share. A prefix-fallback bounds a miss only when a prior entry exists —
    # on a genuinely cold runner, nothing here bounds or quantifies it, and no
    # margin is invented for it. Sizing it: the scheduled term would have to
    # more than triple (9m06s -> 30m) to bust the cap on `schedule`; on
    # `workflow_dispatch` a mere 3x already busts it (27m18s + the probe).
    #
    # ⚠️ Sizing trap, learned here: an earlier draft estimated "~7-8 min" and
    # was wrong on UNITS, not optimism — it scaled `6m24s` (a local Gradle run
    # = STEP-equivalent) against `3m21s` (a JOB figure). The local number was
    # fine: 6m24s x 1.25 ~= the 7m59s step measured. Keep step with step.
    timeout-minutes: 30
    # Job-scoped (overrides the top-level `contents: read`): the failure step
    # opens/updates a tracking issue, which needs `issues: write`.
    permissions:
      contents: read
      issues: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        # fetch-depth 50 (not the default shallow 1) so the failure step can
        # list the recent commits on `main` as triage starting points.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # Bracket the cache restores with a wall-clock timer. `actions/cache`
      # exposes no duration output, and the Stage-5 sizing question the probe
      # step below answers is "can a per-PR job afford this?" — for which
      # restoring a multi-GB ~/.konan is part of the wall clock, not overhead to
      # be ignored. Two `date` calls, so this stays unconditional.
      - name: Start cache-restore timer
        run: echo "CACHE_RESTORE_START=$(date +%s)" >> "$GITHUB_ENV"

      # Three caches, same invalidation model as ci.yml's kmp-build-test (#220
      # D5): ~/.konan (K/N compiler + LLVM toolchain), ~/.gradle/caches
      # (resolved artifacts + plugin classpath), ~/.gradle/wrapper (Gradle
      # distribution zip). Identical key expressions so this job shares the
      # per-PR job's cache entries rather than maintaining a parallel set.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle dependencies (~/.gradle/caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-caches-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle wrapper (~/.gradle/wrapper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-

      - name: Stop cache-restore timer
        run: echo "CACHE_RESTORE_SECONDS=$(( $(date +%s) - CACHE_RESTORE_START ))" >> "$GITHUB_ENV"

      # Supply-chain guard on the checked-in gradle-wrapper.jar (mirrors the
      # per-PR job — "author fresh" must not drop it).
      - name: Validate Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The full native rung, one Gradle invocation (no second cold start):
      #   :shared:engine:build ............ compiles engine on every target
      #                                     (jvm + 3x iOS + macosArm64), pulling
      #                                     :shared:models klibs as its upstream
      #                                     dep. Since #1135's framework export
      #                                     this also LINKS every engine
      #                                     framework (build -> assemble), and
      #                                     since Stage 2-pre landed the first
      #                                     commonTest it RUNS engine tests
      #                                     (build -> check -> allTests) — both
      #                                     were no-ops when this job was
      #                                     written against an empty scaffold.
      #   :shared:models:jvmTest .......... runs the Models suite on the JVM.
      #   :shared:models:iosSimulatorArm64Test .. runs the shared `commonTest`
      #                                     suite on the Kotlin/Native
      #                                     test-runtime on the arm64 iOS
      #                                     simulator — the native execution rung
      #                                     the per-PR compile-only path never
      #                                     reaches. The actual deployment
      #                                     triple.
      #   :shared:models:macosArm64Test ... the same commonTest suite on the K/N
      #                                     macOS host runtime (#1135). Runs
      #                                     natively — no simulator boot. This is
      #                                     the target the Stage-2-gate spike
      #                                     consumer links against; it is NOT the
      #                                     ADR-023 §6 Stage-4 cross-language
      #                                     parity harness, which still lands at
      #                                     Stage 4 (the target registration was
      #                                     pulled forward; the harness was not).
      #   :shared:models:assemblePasturaSharedXCFramework .. links + bundles the
      #                                     models-only umbrella across all three
      #                                     iOS targets (so iosArm64 device +
      #                                     iosX64 are compiled and linked here
      #                                     even though only arm64-sim is
      #                                     test-run). No macOS slice by design —
      #                                     see shared/models/build.gradle.kts.
      #   :shared:engine:assemblePasturaSharedEngineXCFramework .. the engine
      #                                     umbrella, BOTH configs (the per-PR
      #                                     path builds debug only). This is the
      #                                     artifact the Stage-2-gate spike
      #                                     consumer binary-targets.
      #
      # `iosX64Test` is deliberately NOT invoked: on this arm64 runner it would
      # execute an x86_64 test binary on the x86_64 iOS simulator under Rosetta
      # (slow / boot-flaky), and iosX64 is a dev-only slice, not a deployment
      # target — arm64-sim is the representative native rung. iosX64 is still
      # compiled and linked via the XCFramework assembly above, so a native
      # link regression on it is caught.
      - name: Full native build + test + XCFramework
        run: >-
          ./gradlew
          :shared:engine:build
          :shared:models:jvmTest
          :shared:models:iosSimulatorArm64Test
          :shared:models:macosArm64Test
          :shared:models:assemblePasturaSharedXCFramework
          :shared:engine:assemblePasturaSharedEngineXCFramework
          --no-daemon --stacktrace

      # ADR-023 §6 Stage-2 gate consumer (#501 PR-C).
      #
      # UNGUARDED, deliberately unlike the probe below — this is a REGRESSION
      # check, not a measurement. If the boundary adapters stop compiling or
      # their contract tests fail, that IS "a native-path regression the per-PR
      # job could not catch", which is exactly the claim the failure-issue step
      # makes. The per-PR lanes cannot catch it because decision B′ keeps the
      # XCFramework out of them, which is what leaves this job as the only
      # place it can surface.
      #
      # Ordering is load-bearing: this sits BEFORE the probe so a probe that
      # degrades to its 15-minute cap cannot starve the regression check of the
      # job's remaining budget.
      #
      # `stage-framework.sh` re-runs the Gradle assemble (incremental, and the
      # step above already built it) and copies the result inside the package —
      # SwiftPM rejects a `.binaryTarget` path that escapes the package root,
      # so staging is not avoidable.
      #
      # Sizing, by the step-to-step method the job-level note above insists on:
      # local clean build 13s + tests 12s, x1.25 => ~31s. Uncapped by design
      # (see above), so this ~31s is a term the job-level composition must
      # carry on BOTH paths — it is folded into the arithmetic at the top of
      # the job rather than waved off as immaterial.
      #
      # `--no-parallel`: the Pattern 6 probe asserts a MainActor tick floor,
      # which a sibling suite draining paced scripts on the same machine can
      # starve. `.serialized` fixes that within a suite but not across them.
      - name: Gate spike — stage XCFramework, build, test
        run: |
          set -euo pipefail
          tools/kmp-gate-spike/scripts/stage-framework.sh
          swift build --package-path tools/kmp-gate-spike
          swift test --package-path tools/kmp-gate-spike --no-parallel

      # Stage-5 sizing probe (#1135) — NOT a regression check.
      #
      # ADR-023 §6 Stage 5 must decide whether the iOS app's per-PR CI can
      # afford to assemble the XCFramework itself, or needs a prebuilt-artifact
      # scheme. Cold assembly is known (~6m32s, PR-1). The missing number is
      # WARM: build outputs gone, ~/.konan + ~/.gradle still populated — what a
      # per-PR job on a warm runner actually faces.
      #
      # Three deliberate guards, all for the same reason: this job's `failure()`
      # issue-filer below is the backstop's alarm channel, and its issue text
      # asserts a red run means "a native-path regression the per-PR job could
      # not catch". A MEASUREMENT step must never be able to make that claim.
      #   - workflow_dispatch only: the answer is wanted once, not nightly. A
      #     daily re-measure of a number nobody reads costs ~10 min/night and
      #     can only produce false alarms.
      #   - continue-on-error: a probe failure is not a regression signal. (A
      #     continue-on-error step's failure sets its *outcome* to failure but
      #     its *conclusion* to success, so `failure()` below stays false.)
      #   - step timeout: without it a hung probe burns the job cap, and a job
      #     timeout is not something continue-on-error can catch.
      #
      # ⚠️ Do NOT add `always()` / `failure()` to this step's `if:`. An `if:`
      # with no status-check function carries an implicit `success()`, and that
      # implicit gate is the ONLY thing stopping the `clean` below from wiping
      # `build/reports/` out from under the `if: failure()` report upload when
      # the main build has already failed.
      #
      # Validity: no `gradle.properties` exists in this repo, so Gradle's build
      # cache and configuration cache are both OFF by default — `clean` really
      # does force a recompile+relink rather than replaying cached outputs.
      # `--no-daemon` is pinned here, not inherited, so the probe cannot be
      # flattered by a daemon warmed by the step above.
      - name: Measure warm-cache assembly (Stage-5 sizing)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./gradlew :shared:models:clean :shared:engine:clean --no-daemon
          START=$(date +%s)
          ./gradlew \
            :shared:models:assemblePasturaSharedXCFramework \
            :shared:engine:assemblePasturaSharedEngineXCFramework \
            --no-daemon
          ASSEMBLE=$(( $(date +%s) - START ))
          {
            printf '## Stage-5 sizing probe (#1135)\n\n'
            printf '| Measurement | Seconds |\n|---|---|\n'
            printf '| Warm-cache assembly (both umbrellas) | %s |\n' "$ASSEMBLE"
            printf '| Cache restore (~/.konan + ~/.gradle) | %s |\n\n' "${CACHE_RESTORE_SECONDS:-unknown}"
            printf '**The assembly figure is a LOWER BOUND on per-PR cost.** It excludes:\n\n'
            printf -- '- Cache-restore wall time (listed separately above; a per-PR job pays it too).\n'
            # Backticks below are literal markdown, not command substitution —
            # single quotes are deliberate (mirrors the issue-filer step).
            # shellcheck disable=SC2016
            printf -- '- Cache-key MISS. `ci.yml` keys `gradle-caches` on\n'
            # shellcheck disable=SC2016
            printf '  `hashFiles(gradle/libs.versions.toml, **/*.gradle.kts)`, so the PRs most\n'
            printf '  likely to need a full assembly — build-config touches — never get a key\n'
            # shellcheck disable=SC2016
            printf '  hit; they fall back to `restore-keys` prefix matching, a strictly worse\n'
            printf '  cache state than this probe measures.\n'
            printf -- '- A cold OS page cache. This probe inherits a hot one from the assembly\n'
            printf '  the same job just did.\n\n'
            printf 'Compare against the repo CI budget (target <=10 min) only after adding\n'
            printf 'restore time and a key-miss margin.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # ADR-023 §6 gate measurements (i)/(ii)/(iii) — a MEASUREMENT, so it
      # carries the SAME three guards as the sizing probe above, for the same
      # reason: the failure-issue step below claims a red run means a native
      # regression, and a measurement must never be able to make that claim.
      #   - workflow_dispatch only: the gate figures are wanted when someone is
      #     deciding GO/NO-GO, not nightly. (ii) is a timing measurement, so on
      #     a contended runner a nightly re-run would mostly produce noise.
      #   - continue-on-error: a slow or failed measurement is not a regression
      #     signal. The regression half already ran, unguarded, above.
      #   - step timeout: continue-on-error does not cover a job timeout.
      # ⚠️ Same `if:` caveat as the probe — do NOT add always()/failure(); the
      # implicit success() is what keeps this off a already-failed run.
      #
      # Sizing: 2.1s locally (7 iterations x 3 measurements). 2 minutes is ~57x
      # that — ample for a contended runner, and unlike the previous 5 it is a
      # figure the job-level composition can actually absorb (see the note at
      # the top of the job). Depends on the staged framework + build from the
      # gate-spike step above.
      - name: Gate measurements (i)/(ii)/(iii)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            printf '## ADR-023 §6 Stage-2 gate measurements (#501)\n\n'
            printf 'macOS host — per §6, only (ii) absolutes are host-sensitive.\n\n'
            printf '```\n'
            swift run --package-path tools/kmp-gate-spike kmp-gate-bench
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Backstop alarm: a silently-red nightly rots. On failure, open (or, if
      # one is already open, comment on) a single tracking issue with the recent
      # commits as triage starting points.
      #
      # `GH_TOKEN` is REQUIRED even with `permissions: issues: write` above:
      # the permission grants the token its scope, but `gh` reads the token from
      # the environment, so every gh-using step in this repo sets it explicitly
      # (mirrors ci.yml's `classify` / `kmp-changes` steps).
      - name: File or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LABEL="kmp-nightly-failure"
          # Idempotent on the marker label: create it on the first-ever failure,
          # tolerate the already-exists error on every later one.
          gh label create "$LABEL" \
            --color B60205 \
            --description "Automated: KMP nightly full-native workflow failed" \
            2>/dev/null || true
          # `main` is squash-merged (linear history), so each recent commit IS a
          # merged PR — plain `git log` (not `--merges`, which finds nothing) is
          # the right list. fetch-depth 50 guarantees >10 commits are present.
          COMMITS="$(git log -10 --pretty=format:'- %h %s (%an)' || true)"
          if [ -z "$COMMITS" ]; then
            COMMITS="- (commit history unavailable)"
          fi
          # printf-built body (bash 3.2 on the macOS runner; printf sidesteps
          # heredoc escaping of backticks / \$ — ci-workflows.md Rule 1).
          BODY_FILE="$(mktemp)"
          {
            printf 'The **KMP nightly full-native** workflow failed.\n\n'
            printf -- '- Run: %s\n' "$RUN_URL"
            printf -- '- Trigger: %s\n' "$EVENT_NAME"
            printf -- '- Commit: %s\n\n' "$HEAD_SHA"
            printf 'This workflow is the deferred-verification backstop for '
            printf '#501 Stage 1: it runs the full Kotlin/Native rung '
            printf '(iOS-simulator native tests + XCFramework assembly) that the '
            printf 'per-PR CI runs compile-only. A red run here points at a '
            printf 'native-path regression the per-PR job could not catch.\n\n'
            printf '### Recent commits on main (triage starting points)\n'
            printf '%s\n\n' "$COMMITS"
            printf -- '---\n'
            # Backticks below are literal markdown and `%s` is a printf
            # directive (filled by "$LABEL") — single quotes are deliberate.
            # shellcheck disable=SC2016
            printf 'Filed automatically by `kmp-nightly.yml`. Deduped by the '
            # shellcheck disable=SC2016
            printf '`%s` label — reruns comment here instead of opening a new ' "$LABEL"
            printf 'issue. Close once the nightly is green again.\n'
          } > "$BODY_FILE"
          EXISTING="$(gh issue list --state open --label "$LABEL" --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Updated existing failure issue #$EXISTING"
          else
            URL="$(gh issue create \
              --title '🌙 KMP nightly full-native failed' \
              --label "$LABEL" \
              --body-file "$BODY_FILE")"
            echo "Opened failure issue: $URL"
          fi

      - name: Upload Gradle reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmp-nightly-gradle-reports
          path: |
            shared/models/build/reports/
            shared/engine/build/reports/
          retention-days: 7
          if-no-files-found: ignore
