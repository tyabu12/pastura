name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily green-main canary. main's ui-test runs on macos-26, which is most
  # reliable in the low-GitHub-load window (peak load ≈ UTC 12:00-20:00 =
  # JST 21:00-05:00 — the "JST night"). 01:11 UTC = 10:11 JST sits in the
  # low-load trough, and is off the top of the hour where scheduled runs are
  # most delayed. Purpose is high-signal, not flake-hunting: a red run in this
  # low-noise JST-morning window points at a real regression on main, not infra
  # noise (empirically JST 07:00-09:00 ui-test was 20/20 across push/PR runs;
  # the morning trough carries into the 10:xx slot).
  # NOTE: GitHub auto-disables a scheduled workflow after 60 days of *no
  # repository activity* — harmless for an active repo, but that is the silent
  # failure mode if the daily ever stops firing.
  schedule:
    - cron: '11 1 * * *'
  # Manual trigger for an on-demand full main run (a human dispatched it and is
  # watching, so — unlike `schedule` — it is intentionally NOT auto-retried by
  # ci-retry.yml).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled (or workflow_dispatch) run on main shares main's `github.ref`
  # with a push to main, so a plain `ci-${{ github.ref }}` group would let a
  # concurrent push cancel the daily run (or vice versa). Suffix the group with
  # the run id for `schedule` only, giving each daily run its own group so it is
  # never cancelled. push / pull_request / workflow_dispatch keep the empty
  # suffix and their per-ref mutual-cancellation (a manual dispatch on main thus
  # shares push's group — harmless, since a push is itself a full main run).
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  # Path classification (#642). Emits `ios=true` when the changeset contains
  # any build/test-relevant path, so web-only / docs-only PRs skip the heavy
  # macOS jobs below. Reuses scripts/precommit-gate-classify.sh — the SAME
  # conservative-by-inversion classifier as the pre-commit hook (#625) — so CI
  # and pre-commit never drift.
  #
  # Gating is PR-ONLY: push events (merges to main) always emit `ios=true`, so
  # main runs the full suite unconditionally for stability. The optimization
  # only spares redundant work on web/docs-only PRs.
  #
  # Why a job-level `if:` (not a trigger-level `paths:`/`paths-ignore`): a job
  # skipped via `if:` reports "Success" and SATISFIES a required check (even
  # under a ruleset); only a workflow/trigger-level skip leaves the check
  # "Pending" and blocks merge. See .claude/rules/ci-workflows.md.
  #
  # The gated jobs use `if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}`
  # — run UNLESS explicitly classified non-iOS. `!cancelled()` is a status
  # function, so it drops the implicit needs-success gate: if THIS job fails
  # (infra / a future bad edit) its `ios` output is empty, `'' != 'false'` is
  # true, and the macOS jobs run the full suite rather than false-skipping a
  # required check. A genuine non-iOS change still classifies `ios=false` and
  # skips (= Success). Cancellation supersedes the run, so `!cancelled()` skips.
  changes:
    name: Classify changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-scoped (overrides the top-level `contents: read`): the PR-files
    # endpoint needs `pull-requests: read`; checkout needs `contents: read`.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.classify.outputs.ios }}
      # ADR-024 D6: true when a shipped scenario YAML (bundled preset OR
      # gallery) changed, so the harness `lint` gate runs even on a
      # gallery-only PR (which classifies ios=false). See the classify step.
      scenarios: ${{ steps.classify.outputs.scenarios }}
      # True when the changeset can affect the KMP build — either its Kotlin /
      # Gradle inputs, or the workflow YAML that declares its toolchain. The
      # second half is why this is NOT just `ios`: `.github/` is SAFE, so a
      # workflow-only PR classifies ios=false while editing the very JDK /
      # Xcode / cache-key / Gradle-task-token declarations the KMP job runs on.
      # See the classify step and the `kmp-build-test` gate.
      kmp: ${{ steps.classify.outputs.kmp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main stability: a push to main (post-merge) ALWAYS runs the full
          # iOS suite — path-gating is a PR-only optimization. Short-circuit
          # every non-PR event before any classification, so a merged change
          # can never skip tests on main. (Also keeps push off the API path.)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            # Conservative-by-inversion (ci-workflows.md invariant 1): emit
            # scenarios=true on every early-exit too, so the harness lint gate
            # is never left un-triggered by an unset output if the ios arm is
            # ever narrowed. On non-PR events ios=true already runs harness-build.
            echo "scenarios=true" >> "$GITHUB_OUTPUT"
            # ios=true already runs kmp-build-test; emitted anyway so the gate
            # never depends on an unset output if the ios arm is narrowed.
            echo "kmp=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event → always run the full iOS suite (main stability)."
            exit 0
          fi

          # PR event: resolve the changed-file list. `--paginate` defeats the
          # 30-files/page default; the endpoint caps at 3000 files, but
          # truncation only shortens the list, never empties it — and only an
          # EMPTY/errored list trips the conservative default below. `|| FILES=""`
          # keeps `set -e` (GHA default) from aborting on a transient API failure.
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename') || FILES=""

          # CONSERVATIVE DEFAULT (#625 — "a false skip is the worst case"). The
          # classifier emits "" (NOT `build`) on empty input, so the fail-safe
          # must live HERE, before invoking it: an empty / unresolved / errored
          # file list ⇒ run the full iOS suite.
          if [ -z "$FILES" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "scenarios=true" >> "$GITHUB_OUTPUT"
            echo "kmp=true" >> "$GITHUB_OUTPUT"
            echo "No file list resolved → defaulting to the full iOS suite."
            exit 0
          fi

          # Gate on the `build` token (not `lint`): `build ⊇ lint` because every
          # *.swift / .swiftlint.yml path is also non-SAFE, and non-Swift build
          # inputs (project.pbxproj, Localizable.xcstrings) must still run
          # lint-and-test. See scripts/precommit-gate-classify.sh.
          # `if !` keeps a classifier crash from aborting the step under
          # `set -e` (a failing `TOKENS=$(...)` would otherwise fail the whole
          # `changes` job → macOS jobs skip-on-failed-dep = a false skip on a
          # real iOS change). Default to the full suite instead.
          if ! TOKENS=$(printf '%s\n' "$FILES" | bash scripts/precommit-gate-classify.sh); then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "scenarios=true" >> "$GITHUB_OUTPUT"
            echo "kmp=true" >> "$GITHUB_OUTPUT"
            echo "Classifier failed → defaulting to the full iOS suite."
            exit 0
          fi
          echo "Changed paths classified as: '${TOKENS:-<none>}'"
          if printf '%s\n' "$TOKENS" | grep -qw build; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

          # ADR-024 D6: independent of the ios classification, flag whether a
          # shipped scenario YAML changed so `harness-build` runs its `pastura-
          # harness lint` gate. This is the ONLY path that re-triggers the gate
          # on a gallery-only PR (docs/ is build-irrelevant ⇒ ios=false), and it
          # rides the existing `swift build` rather than the heavy macOS suite.
          # Presets already force ios=true (Resources/ is non-SAFE); listing them
          # keeps the output honest about both lint globs. `.ya?ml` matches the
          # bundled/gallery `.yaml` convention (and any stray `.yml`).
          if printf '%s\n' "$FILES" | grep -qE '^(Pastura/Pastura/Resources/Presets/|docs/gallery/).+\.ya?ml$'; then
            echo "scenarios=true" >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=false" >> "$GITHUB_OUTPUT"
          fi

          # Independent of the ios classification, flag whether the KMP build
          # could be affected. The Kotlin/Gradle inputs all classify `build`
          # (⇒ ios=true) on their own — they are listed for honesty, not
          # reach. The load-bearing token is the workflow pair: `.github/` is
          # SAFE, so WITHOUT this a PR editing the KMP job's own toolchain
          # (JDK / DEVELOPER_DIR / cache keys / Gradle task tokens, all
          # declared in YAML) would skip the job that validates it — leaving
          # kmp-nightly.yml as the only backstop, ≤24h later and post-merge.
          # `\.gradle\.kts$` covers both root and per-module build scripts.
          #
          # `kmp-nightly.yml` is in the token deliberately though it is NOT an
          # input to kmp-build-test: every Gradle task this job runs is inside
          # the nightly's task graph, so a PR editing the nightly's task
          # tokens gets a PR-time smoke of the shared ones instead of waiting
          # a full nightly cycle.
          #
          # That containment is TRANSITIVE and non-obvious, so it was verified
          # by `./gradlew <nightly task list> --dry-run`, not inferred: the
          # nightly names no models-side metadata task, and
          # `:shared:models:{jvmTest,iosSimulatorArm64Test,macosArm64Test}` do
          # NOT pull one. `:shared:models:compileCommonMainKotlinMetadata` —
          # the #1157 common-stdlib-leak gate — is reached only because
          # `:shared:engine:build` compiles engine's commonMain against the
          # models metadata klib. Re-run that dry-run before trusting this if
          # the engine→models dependency is ever severed.
          #
          # Over-inclusive in the safe direction either way — it costs one
          # compile-only run (#1148 is the one real instance in 40 merges).
          if printf '%s\n' "$FILES" | grep -qE '^(shared/|gradle/|gradlew|gradle\.properties$)|\.gradle\.kts$|^\.github/workflows/(ci|kmp-nightly)\.yml$'; then
            echo "kmp=true" >> "$GITHUB_OUTPUT"
          else
            echo "kmp=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}
      test-parse-error: ${{ steps.test.outputs.parse_error }}
      coverage-pct: ${{ steps.coverage.outputs.pct }}
      lint-result: ${{ steps.lint.outputs.result }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode and Simulator
        run: |
          ls /Applications/Xcode*.app
          xcodebuild -version
          # List available iPhone simulators for diagnostics
          xcrun simctl list devices available iPhone | head -20
          # Resolve simulator destination via shared script
          source scripts/sim-dest.sh
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      # NOTE: CI intentionally uses the default ~/Library DerivedData path so
      # this cache key keeps hitting. Local dev builds go to
      # Pastura/DerivedData/ via -derivedDataPath — see CLAUDE.md
      # "DerivedData location". If CI ever adopts -derivedDataPath, update
      # this cache path to match (and both instances of it in this file).
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: SwiftLint
        id: lint
        run: |
          brew install swiftlint
          if swiftlint lint --strict --reporter github-actions-logging; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Test with Coverage
        id: test
        run: |
          # Stream xcodebuild output to the job log via tee so per-test lines
          # are visible live (command substitution would buffer until exit,
          # losing all output on timeout-kill). Trailing `|| true` prevents
          # `-e` (a `run:` without `shell:` runs as `bash -e {0}`) from aborting
          # the script before PIPESTATUS is captured.
          #
          # ⚠️ Do NOT add `set -o pipefail` (or `shell: bash`) to this step. The
          # absence of pipefail is LOAD-BEARING here: without it the pipeline
          # exits 0 (tee's status), `|| true` never fires, and PIPESTATUS[0]
          # holds xcodebuild's real status. With pipefail the pipeline exits
          # non-zero, `|| true` fires and RESETS PIPESTATUS to true's — so
          # PIPESTATUS[0] would read 0 and every failing test run would report
          # green. The Release-build step below is the opposite shape and does
          # need pipefail — see .claude/rules/ci-workflows.md Rule 2.
          #
          # `-parallel-testing-enabled NO` — workaround for CI OOM cascade
          # first observed on `main` post-#186 (sha e650f13). Multiple
          # simulator clones on the macos-26 runner (~7 GB RAM) pushed the
          # test host over the OOM threshold; symptoms were trivial unit
          # tests taking ~3.1 s each (vs <10 ms locally) followed by a
          # host kill that marked 262–736 queued tests as "signal trap".
          # With this flag, `lint-and-test` completes in ~8 min — well
          # within the 10-min budget (CLAUDE.md). Root-cause investigation
          # is tracked in #189; when that lands, revisit whether to restore
          # full parallelism or settle on a targeted
          # `-parallel-testing-worker-count N`.
          xcodebuild test \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -destination "$DEST" \
            -only-testing PasturaTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xctest-unit.log || true
          TEST_EXIT=${PIPESTATUS[0]}

          # xcodebuild outputs per-case lines:
          #   Test case '...' passed on '...' (X.XXX seconds)
          #   Test case '...' failed on '...' (X.XXX seconds)
          # `|| true` swallows grep's exit-1 on zero matches and exit-2 on
          # missing file (timeout-kill case). Do NOT use `|| echo 0` here —
          # grep -c already prints "0" on zero matches, so appending another
          # "0" via echo yields a two-line "0\n0" value that corrupts
          # `$GITHUB_OUTPUT` and breaks the numeric comparison below. The
          # `:-0` default covers the missing-file case where grep produced no
          # stdout at all.
          PASSED=$(grep -c "^Test case .* passed " /tmp/xctest-unit.log 2>/dev/null || true)
          FAILED=$(grep -c "^Test case .* failed " /tmp/xctest-unit.log 2>/dev/null || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          if [ "$PASSED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            echo "parse_error=true" >> "$GITHUB_OUTPUT"
          else
            echo "parse_error=false" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          fi

          exit ${TEST_EXIT:-0}

      - name: Coverage Report
        id: coverage
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xccov view --report TestResults.xcresult
            xcrun xccov view --report --json TestResults.xcresult > coverage.json
            PCT=$(python3 -c "import sys,json; print(round(json.load(sys.stdin)['lineCoverage']*10000)/100)" < coverage.json)
            PCT=${PCT:-0.00}
            if ! [[ "$PCT" =~ ^[0-9]+\.[0-9]+$ ]]; then
              PCT=0.00
            fi
            echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          else
            echo "pct=0.00" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            TestResults.xcresult
            coverage.json
          retention-days: 7

  ui-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    # UI tests are far slower on the GPU-less CI simulator than locally
    # (~25s/suite locally either way). With continuous animations suppressed
    # under --ui-test (#728) and the suite now serialized (see the test step's
    # -parallel-testing-enabled NO), a clean CI run lands ~16-24 min with high
    # run-to-run variance. Parallel clones used to inflate that further —
    # 2 simulators contending on the ~7 GB GPU-less runner stalled transitions
    # for tens of seconds and broke test waits (#1053) — so serial is expected
    # comparable-or-tighter, not slower. 30 (was 25) buys headroom over the
    # observed 24-min tail: a timeout produces a `timed_out` conclusion, which
    # ci-retry.yml deliberately does NOT retry, so the ceiling must clear the
    # worst legitimate run. The per-test execution-time cap in the test step
    # bounds a first-clone infra-flake stall on top of that.
    timeout-minutes: 30
    outputs:
      test-passed: ${{ steps.test.outputs.passed }}
      test-failed: ${{ steps.test.outputs.failed }}
      test-parse-error: ${{ steps.test.outputs.parse_error }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode and Simulator
        run: |
          xcodebuild -version
          source scripts/sim-dest.sh
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          # Extract UDID for the pre-boot step. DEST format:
          # "platform=iOS Simulator,id=<UDID>"
          SIM_UDID=$(echo "$DEST" | sed -n 's/.*id=\([^,]*\).*/\1/p')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Pre-boot Simulator
        # UI tests on GitHub Actions macOS runners frequently fail with
        # "Simulator device failed to launch ... xctrunner (RequestDenied)"
        # when xcodebuild test tries to boot, install, and launch the
        # runner all at once on a fresh VM. Booting explicitly first and
        # waiting for the system to be fully up ("-b") avoids the race.
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      # NOTE: CI intentionally uses the default ~/Library DerivedData path so
      # this cache key keeps hitting. Local dev builds go to
      # Pastura/DerivedData/ via -derivedDataPath — see CLAUDE.md
      # "DerivedData location". If CI ever adopts -derivedDataPath, update
      # this cache path to match (and both instances of it in this file).
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test PasturaUITests
        id: test
        run: |
          # Coverage intentionally omitted — UI tests inflate line coverage
          # without adding meaningful unit-level signal, and disabling it
          # shaves a non-trivial amount off the run.
          # -retry-tests-on-failure auto-reruns failing tests up to
          # -test-iterations N total times. Combined with the per-test
          # tearDown that terminates the app, this absorbs intermittent
          # CI-only infrastructure errors like "Failed to get background
          # assertion" without masking real test failures (those fail on
          # every retry).
          # See unit-test step for rationale on tee / PIPESTATUS / || true.
          # ScreenshotTourTests is a review-only capture tour (scripts/
          # ui-tour.sh), not a gate — skipped here so it never burns CI
          # minutes or inherits UI-test infra flakes. StoreScreenshotTests
          # (scripts/store-shots.sh) and MarketingShotTests
          # (scripts/marketing-shots.sh) are the same class of local-only,
          # 6.9"-pinned capture and are skipped for the same reason.
          # -parallel-testing-enabled NO serializes onto the single pre-booted
          # simulator instead of spawning per-suite clones. lint-and-test
          # already does this (#189 OOM mitigation); the UI job kept clones
          # until #1053, where 2 simulators + 2 apps + 2 runners contending on
          # the ~7 GB GPU-less runner stalled transitions for tens of seconds
          # and broke test waits (a run that PASSED still took 3m for one
          # suite). Serial removes that contention and makes the Pre-boot step
          # above load-bearing (the booted device is used directly, not cloned
          # away); it also retires the within-process clone-cascade flake class.
          # -test-timeouts-enabled + -default-test-execution-time-allowance cap
          # each test ITERATION at 250s. After the #728 animation fix the
          # flake-prone heavy tests pass in <=149s on CI (observed across runs,
          # high variance), so 250s clears them with margin while killing a
          # first-clone infra-flake stall (which otherwise crawls to ~350-380s)
          # early enough for the fast retry to keep the job under its 30-min
          # budget. InFlightIndicatorReconnectUITests is slow by design and,
          # now that serial makes its allowance additive rather than overlapped,
          # opts out with a tightened executionTimeAllowance in setUp (#1053).
          xcodebuild test \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -destination "$DEST" \
            -only-testing PasturaUITests \
            -skip-testing PasturaUITests/ScreenshotTourTests \
            -skip-testing PasturaUITests/StoreScreenshotTests \
            -skip-testing PasturaUITests/MarketingShotTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 250 \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xctest-ui.log || true
          TEST_EXIT=${PIPESTATUS[0]}

          PASSED=$(grep -c "^Test case .* passed " /tmp/xctest-ui.log 2>/dev/null || true)
          FAILED=$(grep -c "^Test case .* failed " /tmp/xctest-ui.log 2>/dev/null || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          if [ "$PASSED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            echo "parse_error=true" >> "$GITHUB_OUTPUT"
          else
            echo "parse_error=false" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          fi

          exit ${TEST_EXIT:-0}

      # Surface the failing-test summary inline in the run's Step Summary so a
      # red ui-test can be triaged without downloading the ~130 MB xcresult
      # artifact (#1053). Guarded: a timeout-kill (SIGTERM at timeout-minutes)
      # can leave UITestResults.xcresult absent or half-written — exactly the
      # case this step exists for — so the bundle check + `|| true` degrade to
      # a note instead of adding a second red step to an already-red job.
      # xcresulttool defaults to JSON on Xcode 26; jq renders the failures.
      - name: Summarize UI test failures
        if: failure()
        run: |
          {
            echo "### UI test failures"
            if [ -d UITestResults.xcresult ]; then
              xcrun xcresulttool get test-results summary \
                --path UITestResults.xcresult 2>/dev/null \
                | jq -r '"Result: \(.result) — \(.passedTests) passed, \(.failedTests) failed", "", ((.testFailures // []) | map("- **\(.testIdentifierString // .testName // .targetName)**: \(.failureText)") | .[])' \
                2>/dev/null || echo "_Could not parse the xcresult summary._"
            else
              echo "_No UITestResults.xcresult — likely a timeout-kill before the bundle was written._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  # Enforces ADR-005 §8.5 on every PR: `OllamaService` must not link into the
  # Release-iphoneos binary (App-Store-submission target). Runs in parallel
  # with lint-and-test and ui-test. See ADR-005 §8 and docs/decisions/ADR-005.md.
  release-build:
    name: Release build (iphoneos) + ADR-005 §8 guard
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: xcodebuild -version

      # Same key/path as lint-and-test / ui-test — shared warm SPM cache.
      # See the lint-and-test Cache step for the rationale on CI staying on
      # the default ~/Library DerivedData path.
      - name: Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Deliberately NO `|| true` / PIPESTATUS dance here, unlike the
      # unit/UI test steps above. Those steps must continue past xcodebuild
      # failure to parse log output for the sticky PR comment; this step
      # only needs the binary for the symbol grep, so it should just die on a
      # failed build.
      #
      # `set -o pipefail` is LOAD-BEARING and must stay above the pipe. A `run:`
      # without an explicit `shell:` key executes as `bash -e {0}` — `-e` only,
      # NOT `-eo pipefail` (that form is what `shell: bash` selects). So without
      # this line the pipeline's exit code is `tee`'s 0, and a `** BUILD FAILED
      # **` reports the step GREEN — the failure then resurfaces one step later
      # as the guard's misleading "Expected exactly 1 Release binary, found 0".
      # Observed on PR #1141.
      #
      # -sdk iphoneos (not iphonesimulator) because Release-simulator still
      # defines targetEnvironment(simulator), which would pull OllamaService
      # back in and make the guard fire vacuously.
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Pastura \
            -project Pastura/Pastura.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release-build.log

      - name: Verify ADR-005 §8 — OllamaService excluded
        run: |
          # Locate the Release-iphoneos binary. xcodebuild uses the default
          # ~/Library/... DerivedData on CI (see Cache step). Multiple matches
          # would indicate a cache-layout bug — fail loudly rather than pick one.
          # Portable while/read loop because `mapfile` is bash 4+ and GHA
          # macOS runners default to /bin/bash 3.2 (Apple GPLv3 avoidance).
          BINS=()
          while IFS= read -r -d '' f; do
            BINS+=("$f")
          done < <(find ~/Library/Developer/Xcode/DerivedData \
            -type f \
            -path '*/Build/Products/Release-iphoneos/Pastura.app/Pastura' \
            -print0)
          if [ "${#BINS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 Release binary, found ${#BINS[@]}"
            printf '%s\n' "${BINS[@]}"
            exit 1
          fi
          BIN="${BINS[0]}"
          echo "Checking $BIN"
          # Demangle before grep: failure output stays human-readable and the
          # check catches future helpers like OllamaClient / ollamaBridge that
          # a narrower match would miss. Matches ADR-005 §8.5.
          MATCHES=$(nm -a "$BIN" | xcrun swift-demangle | grep -i ollama || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::ollama symbols leaked into Release binary (ADR-005 §8)"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: zero ollama symbols in Release-iphoneos binary"

      - name: Upload Release build log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: /tmp/release-build.log
          retention-days: 7

  # ADR-013: the harness SwiftPM package compiles the same Engine/LLM/Models
  # sources as the app but is invisible to the pre-commit hook (xcodebuild
  # only) — without this job an iOS-only PR can silently break `swift build`.
  # Runs in parallel with the xcodebuild jobs, so it does not extend the
  # critical path (ui-test remains the slowest job).
  harness-build:
    name: Harness package build + tests (ADR-013)
    needs: changes
    # Runs on any iOS-relevant change (ios != false) OR when a shipped scenario
    # YAML changed (scenarios == true) — the latter re-triggers the ADR-024 D6
    # `lint` gate on a gallery-only PR that would otherwise classify ios=false.
    if: ${{ !cancelled() && (needs.changes.outputs.ios != 'false' || needs.changes.outputs.scenarios == 'true') }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate cache family from the xcodebuild jobs: SwiftPM CLI builds
      # into ./.build (checkouts + the ~555 MB unpacked llama.cpp
      # xcframework artifact), not ~/Library DerivedData. Keyed on the
      # ROOT Package.resolved only — '**/Package.resolved' would also hash
      # the xcodeproj's copy and churn this key on app-only pin changes.
      - name: Cache SwiftPM build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: harness-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: harness-spm-${{ runner.os }}-

      - name: Build harness package
        run: swift build

      - name: Run harness package tests
        run: swift test

      # ADR-024 D6: inference-free zero-regression gate over every shipped
      # scenario YAML (bundled presets + gallery). Reuses the executable built
      # by `swift build` above (no rebuild). Exit non-zero on any parse /
      # validator failure or error-severity lint finding; warnings are listed
      # but non-fatal. Rides this cheap job so it never extends the ui-test
      # critical path.
      - name: Lint shipped scenarios (ADR-024)
        run: swift run pastura-harness lint Pastura/Pastura/Resources/Presets docs/gallery

      # ADR-023 §6 measurement (v): the Kotlin parity fixture is Swift-authored
      # bytes frozen into a generated source file, so a Models change that is
      # not accompanied by a regeneration silently invalidates the measurement.
      # Rides this job because it is the only per-PR lane that already builds
      # the Swift Models — and it acquires NO XCFramework dependency, so
      # decision B′ still holds.
      #
      # Both drift directions reach this job, including a PR that hand-edits ONLY
      # the generated Kotlin file. That is NOT self-evident from the `ios !=
      # false` gate above — it holds because `shared/**` is absent from
      # `scripts/precommit-gate-classify.sh`'s SAFE denylist (`web/`, `docs/`,
      # `.github/`, `.claude/`, `*.md`, repo-meta dotfiles), so such a path is
      # non-SAFE ⇒ `build` ⇒ `ios=true`. Adding `shared/` to that denylist would
      # silently disarm this guard and the parity one below; the invariant is
      # pinned by `scripts/tests/precommit-gate-classify-test.sh`.
      - name: Golden JSON drift guard (ADR-023 measurement (v))
        run: swift run pastura-harness emit-golden --check

      # ADR-023 Stage-4 parity fixtures: `ParityGolden.kt` is generated from the
      # Swift Engine's own behaviour and carries a DO-NOT-EDIT header, so it can
      # go stale from either side — an input change (e.g. Engine semantics, the
      # fixture scenario / `specs`, the `EventLineMapper` projection; the list is
      # open, see `ParityEmitCommand.checkDrift`) or a hand-edit. #1397 changed
      # its contents while nothing detected staleness.
      #
      # Same reach argument as the step above. Inference-free (scripted
      # responder), reusing the executable `swift build` already produced — so
      # decision B′ (no per-PR XCFramework dependency) still holds, and it costs
      # what its `emit-golden` sibling does, 1-2 s of a job whose time goes to
      # `swift build` (27-45 s across the four most recent green main runs).
      - name: Parity golden drift guard (ADR-023 Stage 4)
        run: swift run pastura-harness parity-emit --check

  # ---------------------------------------------------------------------------
  # KMP Models layer build & test (#501 Stage 1, ADR-023). Validates that the
  # `shared/models` Kotlin Multiplatform module lands green and stays green.
  #
  # Job-level `if:` gated on the `changes` classifier, so a SAFE-only PR
  # (docs / web / `.claude/` / `*.md`) skips it. Replaying
  # `scripts/precommit-gate-classify.sh` over the last 40 merges to main: 16
  # classify SAFE-only, 15 of which also miss the `kmp` arm below and so
  # actually skip (the 16th is #1148, a `kmp-nightly.yml` edit that the `kmp`
  # arm deliberately re-arms). On a docs / web / `.claude`-only PR every iOS
  # job skips too, leaving this the sole macOS job and the run's long pole —
  # NOT true of a gallery-YAML PR, which is also SAFE-only but keeps
  # `harness-build` (macos-26) alive via the `scenarios` arm. On an
  # iOS-touching PR this finishes well inside lint-and-test, so the gate saves
  # nothing there by design.
  #
  # This does NOT reintroduce #501 §9.7 landmine (a) (a gate that fails to
  # fire). The form is conservative by inversion per ci-workflows.md invariant
  # 1 — it runs UNLESS explicitly classified out, so every ambiguous branch
  # runs: non-PR events (push→main / daily `schedule` / `workflow_dispatch`)
  # short-circuit to `ios=true` in the classifier, an empty or API-errored
  # PR-files list and a classifier crash both fall back to `ios=true`, and an
  # outright `changes`-job failure leaves the output empty — which `!= 'false'`
  # treats as run, with `!cancelled()` dropping the implicit needs-success gate
  # that would otherwise false-skip a required check. (The T11 spike-branch
  # `on:` triggers are still NOT carried — landmine (c).)
  #
  # The `|| kmp == 'true'` arm is load-bearing, not belt-and-braces: `.github/`
  # is in the classifier's SAFE set, so a workflow-only PR classifies
  # `ios=false` — and this job's entire build environment (JDK, DEVELOPER_DIR,
  # cache-key expressions, action pins, the literal Gradle task-token lists
  # below) is declared in this very file. On `ios` alone, such a PR would skip
  # the job that validates it. Same shape as `harness-build`'s `scenarios` arm.
  #
  # Safety rests on the classifier being default-deny: only the SAFE regex
  # yields an empty token set, so every KMP input outside
  # `docs/` / `web/` / `.github/` / `.claude/` / `*.md` classifies `build`
  # ⇒ `ios=true`. All five step-level `full_native` promotion paths were run
  # through `scripts/precommit-gate-classify.sh` and classify `build`, so this
  # job-level gate is a strict SUPERSET of the step-level promotion set and
  # cannot pre-empt it. (Edge case, harmless: a `shared/**/*.md` is SAFE — it
  # is caught by the `^shared/` token in the `kmp` predicate anyway. The
  # step-level `\.def$` token is unanchored, so a `.def` parked outside
  # `shared/` under a SAFE dir would promote at step level while classifying
  # out here; no `.def` exists yet, but anchor it to `^shared/` if one lands.)
  #
  # Cost of the gate: the job now queues behind the ubuntu `changes` job
  # instead of starting at t=0. Negligible against the compile-only default
  # path, measured at 1.9–3.9 min across the five most recent PR runs at the
  # time of this change.
  #
  # ci-workflows.md invariant 5 (verify BOTH directions) is only HALF
  # discharged here. Because `ci.yml` is in the `kmp` predicate, the PR that
  # introduced this gate classifies `ios=false, kmp=true` and exercises the
  # RUN branch on itself. The SKIP branch — where the required check "KMP
  # build & test (#501)" must report Success, not Pending — cannot be
  # exercised by that PR at all. It is expected safe per ci-workflows.md
  # § "Required-check-safe path gating" (job-level `if:` skip reports
  # Success), but that is reasoning, not verification: confirm it on the first
  # docs-only PR after this merges, and re-verify the same way if the gate is
  # ever widened.
  #
  # Runs as a parallel job to the iOS xcodebuild jobs. The default path (JVM
  # tests + a single-target native klib COMPILE-ONLY) stays shorter than the
  # iOS build, so it is never the per-PR long-pole. Full native build +
  # XCFramework assembly are the nightly workflow's job (#501 PR-3); this job
  # only promotes to full-native on PRs that touch the KMP build config (see
  # the classify step).
  kmp-build-test:
    name: KMP build & test (#501)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.ios != 'false' || needs.changes.outputs.kmp == 'true') }}
    runs-on: macos-26
    # Headroom for the rare cold full-native PROMOTION path (build-config PRs).
    # The compile-only DEFAULT is tripwired far tighter at the step level below
    # (8 min) — this job budget is not that tripwire. Do not read 20 as "the
    # per-PR budget"; the per-PR budget is the 8-min compile-only step.
    #
    # Note this cap CAN bind before either step cap does — JVM 8 + full-native
    # 18 = 26 exceeds it — so raise it alongside the step timeouts, never
    # instead of them. On a real run the step caps bind first; #1135 measured
    # the promotion path rather than estimating it (that PR self-tripped
    # `full_native=true`, so its own run was the measurement):
    #
    #   job 7m30s total = JVM tests 34s + full-native step 5m19s + cache
    #   restore 54s + overhead — against this 20-min cap.
    #
    # State during that run: konan exact-key HIT, `gradle-caches` restore-key
    # FALLBACK. That fallback is the normal state for a build-config PR, since
    # the key hashes `**/*.gradle.kts` — these PRs always miss it. Adding the
    # `PasturaSharedEngine` umbrella cost far less than the >2x estimated: the
    # engine links reuse models klibs already built, and debug links are cheap.
    # So 20 stays.
    timeout-minutes: 20
    # Job-scoped (overrides the top-level `contents: read`): the classify step's
    # PR-files endpoint needs `pull-requests: read`. Explicit so the compile-only
    # fast path can't silently degrade to full-native if a tightened default ever
    # 403s the API (the `|| FILES=""` fail-safe would then promote every PR).
    permissions:
      contents: read
      pull-requests: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # Three caches, different invalidation rates (#220 D5):
      #   ~/.konan         — Kotlin/Native compiler + LLVM toolchain; flips on a
      #                      Kotlin version bump (gradle/libs.versions.toml).
      #   ~/.gradle/caches — resolved Maven artifacts + Gradle plugin classpath.
      #   ~/.gradle/wrapper — bootstrapped Gradle distribution zip.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle dependencies (~/.gradle/caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-caches-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle wrapper (~/.gradle/wrapper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-

      # Supply-chain guard on the checked-in gradle-wrapper.jar. "Author fresh"
      # must not drop this.
      - name: Validate Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Step-level path promotion (#501 D-B). A PR that touches the KMP build
      # config (Gradle build scripts / version catalog / wrapper / cinterop
      # `.def`) promotes from compile-only to a FULL native build + XCFramework
      # assembly, because link / XCFramework breakage is localized to those
      # files and the compile-only default would miss it. Every OTHER case —
      # the common one, incl. all Swift-only PRs, docs PRs, and non-PR events —
      # runs JVM tests + single-target klib compile-only (full-native on main is
      # owned by the nightly workflow, #501 PR-3).
      #
      # Decided HERE at STEP level, never via `on.<event>.paths`: a job-level
      # path filter leaves a required status check stuck "Pending" forever when
      # the paths do not match (ci-workflows.md "Long-lived branch gating").
      # Conservative-by-inversion (ci-workflows.md invariant 1): an unresolved /
      # errored PR file list PROMOTES rather than under-builds.
      - name: Classify KMP build-config touch
        id: kmp-changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Non-PR (push→main / schedule / dispatch): compile-only default.
            # Deep full-native coverage on main is the nightly's job (PR-3);
            # keeping main pushes on compile-only avoids a cold-native tax on
            # every merge.
            echo "full_native=false" >> "$GITHUB_OUTPUT"
            echo "Non-PR event → JVM + klib compile-only (nightly owns full-native)."
            exit 0
          fi
          # `|| FILES=""` keeps GHA's default `set -e` from aborting on a
          # transient API failure; the empty-list branch below is the fail-safe.
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename') || FILES=""
          if [ -z "$FILES" ]; then
            echo "full_native=true" >> "$GITHUB_OUTPUT"
            echo "No file list resolved → full native build (conservative)."
            exit 0
          fi
          # Anything that can change link / XCFramework output. Line-anchored
          # tokens; `.def` = a K/N cinterop def file (none yet, future-proofed).
          if printf '%s\n' "$FILES" | grep -qE '(^|/)(build\.gradle\.kts|settings\.gradle\.kts)$|^gradle/libs\.versions\.toml$|^gradle/wrapper/|\.def$'; then
            echo "full_native=true" >> "$GITHUB_OUTPUT"
            echo "KMP build-config touched → full native build + XCFramework."
          else
            echo "full_native=false" >> "$GITHUB_OUTPUT"
            echo "No KMP build-config touch → JVM + klib compile-only."
          fi

      - name: Run JVM tests
        timeout-minutes: 8
        # `:shared:engine:jvmTest` runs here too since Stage 2-pre (#501) — the
        # ported ConditionEvaluator commonTest is the cross-language executable
        # spec and must run per-PR on JVM, not only nightly-native. Before it,
        # `:shared:engine` had no commonTest (jvmTest was NO-SOURCE).
        run: ./gradlew :shared:models:jvmTest :shared:engine:jvmTest --no-daemon --stacktrace

      # The per-PR budget tripwire lives HERE, on the compile-only step, so a
      # silently-growing compile-only (Gradle pulling in link deps, or native
      # test execution sneaking onto this target) fails loudly. Do NOT loosen it
      # if a one-off cold-cache run trips it — that is a first-run artifact, not
      # a budget regression (#501 D-B). The `compileCommonMainKotlinMetadata`
      # tasks are now part of the budgeted set; they are Kotlin-frontend-only
      # (no LLVM), so they add negligible time (~a few seconds) and the 8-min
      # cap holds — the addition is intentional gate coverage, not the silent
      # growth this tripwire targets.
      - name: Compile native klib (compile-only — per-PR default)
        if: steps.kmp-changes.outputs.full_native != 'true'
        timeout-minutes: 8
        # `:shared:engine` compiles here too so engine-source-only PRs
        # (Stage 2-pre onward) are covered on the per-PR default path.
        #
        # The `:shared:engine` token is NO LONGER identical to the full-native
        # step's (it was, until #1135 gave that step the umbrella assembly).
        # That divergence is safe by SUBSUMPTION, not by matching: the umbrella
        # task depends on `link<Config>Framework<Target>`, which depends on this
        # very `compileKotlinIosSimulatorArm64`. The full-native step is a
        # strict superset — it cannot skip what this step checks.
        #
        # `compileCommonMainKotlinMetadata` compiles commonMain against the
        # COMMON stdlib only, catching platform-specific-API leaks (e.g.
        # `RegexOption.DOT_MATCHES_ALL`, which resolves on JVM+Native but not in
        # common — #1157) that every per-target compile above silently accepts.
        # Before #1157 this task ran ONLY in the KMP nightly (via
        # `:shared:engine:build`), so the class escaped per-PR CI for a full
        # nightly cycle. It is NOT reachable from the XCFramework assembly, so
        # the full-native step must list it EXPLICITLY too to keep that step a
        # strict superset of this one.
        run: ./gradlew :shared:models:compileKotlinIosSimulatorArm64 :shared:engine:compileKotlinIosSimulatorArm64 :shared:models:compileCommonMainKotlinMetadata :shared:engine:compileCommonMainKotlinMetadata --no-daemon --stacktrace

      - name: Full native build + XCFramework (build-config touch)
        if: steps.kmp-changes.outputs.full_native == 'true'
        # 18 kept from before the #1135 umbrella addition: that PR measured this
        # step at 5m19s (warm konan / gradle-caches restore-key fallback), so
        # the added assembly did not warrant a raise. Same tripwire posture as
        # the compile-only step above — if a genuinely konan-cold run trips it,
        # that is a first-run artifact, not a budget regression.
        timeout-minutes: 18
        # Both umbrellas assemble here since #1135 gave `:shared:engine` its own
        # export. A build-config PR is exactly the PR that can break a framework
        # link, and this step is the only per-PR path that links at all — a PR
        # adding the export must not merge with the export unverified.
        #
        # DEBUG-only for the engine umbrella (`…EngineDebugXCFramework`), while
        # models keeps the both-config `assemblePasturaSharedXCFramework` it has
        # always run: K/N release links run full LLVM optimization and dominate
        # the step's cost, and the `export`/API-dependency errors this step
        # exists to catch fire identically on debug. The both-config engine
        # umbrella runs nightly, off the critical path.
        #
        # Task name has the config infix AFTER the umbrella name — verified via
        # `./gradlew :shared:engine:tasks --all`, not inferred. The intuitive
        # `assembleDebugPasturaSharedEngineXCFramework` does NOT exist; Gradle
        # rejects it as an ambiguous abbreviation of the per-platform
        # `assembleDebug<Platform>FatFrameworkFor…` tasks.
        #
        # The two `compileCommonMainKotlinMetadata` tasks are listed EXPLICITLY,
        # mirroring the compile-only step: the XCFramework assembly does NOT
        # depend on the common-metadata klib (it links per-target native
        # compiles), so without them a common-stdlib API leak (#1157) would slip
        # this step too — breaking the strict-superset invariant that the
        # full-native step covers everything the compile-only step does. Both
        # task tokens verified present via `:shared:{models,engine}:tasks --all`.
        run: ./gradlew :shared:models:assemblePasturaSharedXCFramework :shared:engine:assemblePasturaSharedEngineDebugXCFramework :shared:models:compileCommonMainKotlinMetadata :shared:engine:compileCommonMainKotlinMetadata --no-daemon --stacktrace

      - name: Upload Gradle reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmp-gradle-reports
          # Both modules' reports — matches kmp-nightly.yml. `:shared:engine`
          # now runs its own gate tasks on this path (metadata compile + tests),
          # so an engine-side failure must be diagnosable from the per-PR run.
          path: |
            shared/models/build/reports/
            shared/engine/build/reports/
          retention-days: 7

  # Drift guard for bundled DL-time demo replays (#170, spec §3.3 / §5.2).
  # Re-hashes shipped preset YAMLs and validates each bundled demo's
  # `preset_ref.yaml_sha256` + curation-quality floors (turns, language,
  # filter-applied flag, bundle count/size). Pure-python so shell-tool
  # differences across runners don't matter — ubuntu-latest keeps this job
  # fast and cheap.
  demo-replay-drift:
    name: Demo replay drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHA ubuntu-latest ships python3 >= 3.12 and pip. No setup-python
      # action needed — fewer pinned action versions to maintain.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      - name: Run drift guard
        run: python3 scripts/check_demo_replay_drift.py

  blocklist-drift:
    name: ContentBlocklist drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jq is pre-installed on ubuntu-latest runners. The script's
      # --check mode validates source.json shape, contentCategory enum
      # values, and byte-level drift against the bundled
      # ContentBlocklist.json (ADR-005 §10.1). No `|| true` wrapper —
      # any failure must fail the job so merge-time drift cannot land
      # silently.
      - name: Run blocklist drift guard
        run: bash scripts/build-blocklist.sh --check

  shell-tests:
    name: Shell gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gallery-scripts-test.sh delegates to add/check-gallery-entry.sh,
      # which parse YAML via PyYAML. Pin major to match the gallery-drift
      # job's install. The other shell tests don't need it; the install
      # is cheap and unconditional keeps the job simple.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      # Regression tests for the repo's shell gates (p8 secret-gate,
      # gallery tooling, …). Pure git + bash, so ubuntu — no Xcode needed.
      # The `*-test.sh` naming convention is the contract: any matching
      # file becomes a CI gate. A `run:` without `shell:` executes as
      # `bash -e {0}`, so a non-zero test exit fails the job (no `|| true`
      # wrapper). No pipe here, so `-e` alone is sufficient.
      - name: Run scripts/tests/*-test.sh
        run: |
          for f in scripts/tests/*-test.sh; do
            [ -e "$f" ] || continue
            echo "== $f =="
            bash "$f"
          done

      # KMP status-board drift check (#1231) — self-test + the real board vs the
      # ADR-023 port ledger + tracked Kotlin tree. Unconditional (never
      # on.<event>.paths — a required-check ruleset would otherwise pend forever;
      # `.claude/rules/ci-workflows.md` § "Required-check-safe path gating").
      # Defense-in-depth for scripts/kmp-status-precommit-gate.sh (local only).
      - name: KMP status board drift check
        run: |
          python3 scripts/check-kmp-status.py --self-test
          python3 scripts/check-kmp-status.py --check

      # Swift <-> Kotlin `pickLanguage` prompt-literal parity (#1295) — self-test
      # (extractor fixtures + negative controls) then the real pair. Unconditional
      # for the same reason as the step above (`.claude/rules/ci-workflows.md`
      # § "Required-check-safe path gating"). Defense-in-depth for
      # scripts/prompt-literal-parity-precommit-gate.sh (local only).
      - name: Prompt-literal parity check
        run: |
          python3 scripts/check-prompt-literal-parity.py --self-test
          python3 scripts/check-prompt-literal-parity.py --check

      # Fixed-appearance-export injection (#1337) — an `ImageRenderer` that
      # injects no `\.colorScheme` rasterizes light on any device (#1070), and
      # ADR-009 rules out the snapshot test that would observe it. Self-test
      # first (positive control + the `UIGraphicsImageRenderer` substring trap),
      # then the real tree. Unconditional for the same reason as the steps above
      # (`.claude/rules/ci-workflows.md` § "Required-check-safe path gating").
      # Defense-in-depth for scripts/imagerenderer-injection-precommit-gate.sh
      # (local only).
      - name: Fixed-appearance-export injection check
        run: |
          python3 scripts/check_imagerenderer_injection.py --self-test
          python3 scripts/check_imagerenderer_injection.py --check

  gallery-drift:
    name: Gallery drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jq + shasum are pre-installed on ubuntu-latest. PyYAML is the
      # only third-party dep — pin major to keep the install
      # deterministic. The script's --all mode validates yaml_sha256
      # byte-match, size cap (256 KiB), id uniqueness across
      # gallery.json + bundled presets, and filename-stem == id. No
      # `|| true` wrapper — any failure must fail the job so merge-time
      # drift cannot land silently. (GallerySeedYAMLTests inside the
      # iOS test target is the second line of defense.)
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml>=6,<7'

      - name: Run gallery drift guard
        run: bash scripts/check-gallery-entry.sh --all

  # Job-only guard like blocklist-drift / gallery-drift (no pr-comment
  # wiring — the red check itself is the gate; the map is review tooling,
  # not a shipped surface). Pure stdlib — no pip install needed.
  navigation-map-drift:
    name: Navigation map drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run scanner self-test
        run: python3 scripts/generate-navigation-map.py --self-test

      - name: Run navigation map drift guard
        run: python3 scripts/generate-navigation-map.py --check

  # Job-only guard like the drift siblings above. Counts buildScenario()
  # occurrences in ScenarioEditorViewModel*.swift (#338 funnel tripwire);
  # != 3 fails. Pure git + bash, no deps. The shell-tests job exercises the
  # gate logic on synthetic repos; this runs it against the real tree.
  scenario-editor-funnel-drift:
    name: ScenarioEditor funnel drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ScenarioEditor funnel drift guard
        run: bash scripts/scenario-editor-funnel-gate.sh --check

  # ADR-023 §6 decision B′: "No per-PR lane acquires an XCFramework dependency
  # — not the iOS xcodebuild, not the root Package.swift harness build, not a
  # dev `swift build`." The root manifest is the commonest leak, since
  # `harness-build` runs a bare `swift build` and that builds every target the
  # root declares. The gate spike therefore lives in its own nested manifest.
  #
  # The guard covers the iOS lane too — the pbxproj, and a tracked
  # `.xcframework` under `Pastura/` that the project's synchronized root groups
  # would sweep in without any pbxproj entry. Its header states the one lane it
  # cannot see and what B′ is really protecting; read it before widening or
  # trusting the scope.
  #
  # Ungated (ubuntu, seconds): a gated guard would skip on exactly the PRs that
  # only touch the manifest.
  kmp-gate-isolation:
    name: KMP gate-spike isolation guard (B′)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guard logic lives in the script, not inline here, so that
      # scripts/tests/kmp-gate-isolation-test.sh can perturb it against
      # synthetic fixtures — the guard's own success case proves nothing about
      # whether it would fire. The script's header states what it covers and
      # the one lane it cannot (an SPM remote package declaring a
      # .binaryTarget leaves no greppable trace).
      - name: Run B′ isolation guard
        run: tools/kmp-gate-spike/scripts/check-b-prime-isolation.sh

  # Job-only guard like the drift siblings above, and per-PR rather than
  # nightly on purpose. The check is pure bash/awk/diff over two tracked
  # files (~1s, no build dependency), so it never needed the nightly's
  # XCFramework rung. Leaving it there had a cost beyond latency: the
  # nightly's `failure()` issue-filer reports a red run as "a native-path
  # regression the per-PR job could not catch", which a verbatim-copy
  # drift is not — a one-sided edit went green on the PR and then
  # mis-attributed itself overnight.
  #
  # Coverage does not regress in the move: ci.yml's triggers (push→main /
  # pull_request / schedule / workflow_dispatch) are a superset of the
  # nightly's (schedule / workflow_dispatch).
  suspendcontroller-drift:
    name: SuspendController verbatim-copy drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A drifted copy means the gate spike's boundary suite exercises a
      # different object than the app ships — which silently invalidates the
      # evidence for ADR-023 §5.2 invariant 3, since that invariant is
      # defended by the copy being byte-identical rather than by a test.
      - name: Run SuspendController drift guard
        run: tools/kmp-gate-spike/scripts/check-suspendcontroller-drift.sh

  # Job-only guard like the drift siblings above. Asserts every workflow `uses:`
  # is SHA-pinned and that one repository resolves to one SHA. Ungated and cheap
  # (pure stdlib, seconds) per .claude/rules/ci-workflows.md invariant 3.
  #
  # For Dependabot's PRs this is the ONLY gate — those commits never run local
  # hooks. Why the invariant needs a gate rather than a comment:
  # .claude/rules/ci-workflows.md § "One repo, many sub-actions".
  action-pin-consistency:
    name: Action pin consistency guard (#1359)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run checker self-test
        run: python3 scripts/check-action-pin-consistency.py --self-test

      - name: Verify action pins are SHA-pinned and consistent
        run: python3 scripts/check-action-pin-consistency.py --check

  # Job-only guard like the drift siblings above. Keeps ds/tokens.css (the
  # CSS mirror consumed by the claude.ai Design System project) faithful to
  # DesignTokens*.swift, and validates @dsCard markers. Pure stdlib.
  design-tokens-drift:
    name: Design tokens drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run checker self-test
        run: python3 scripts/check_design_tokens_css.py --self-test

      - name: Run design tokens drift guard
        run: python3 scripts/check_design_tokens_css.py --check

  localization-coverage:
    name: Localization coverage (ja 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHA ubuntu-latest ships python3 >= 3.12. No third-party deps —
      # the script uses only stdlib (json, argparse, pathlib).
      - name: Run validator self-test
        run: python3 scripts/check_localization_coverage.py --self-test

      - name: Verify Localizable.xcstrings ja coverage
        run: python3 scripts/check_localization_coverage.py

  engine-language-axis:
    name: Engine language-axis guard (ADR-010 D5 / D8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bash + grep only — both pre-installed on ubuntu-latest. The script
      # blocks future regressions of the `scenario.language` → Engine
      # dispatch antipattern; see docs/decisions/ADR-010.md § D5, D7, D8.
      - name: Run Engine language-axis guard
        run: bash scripts/check_engine_language_axis.sh

      # ADR-010 D8 dependency-rule guard — `import NaturalLanguage` is
      # forbidden in Engine / LLM / Models / Data; only App/ imports the
      # framework. The script catches `@preconcurrency` /
      # `@_implementationOnly` / submodule import shapes alongside the
      # bare `import NaturalLanguage`.
      - name: Run NaturalLanguage import boundary guard
        run: bash scripts/check_naturallanguage_axis.sh

  coverage:
    name: Coverage
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # SECURITY: This condition prevents fork PRs from accessing GIST_SECRET.
    # Do not remove or weaken without reviewing secret exposure implications.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # GIST_SECRET must be a PAT with only the "gist" scope (classic)
      # or "gists: write" (fine-grained). No other permissions needed.
      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2e86dcd3eddf5d5294d75870c9ad62e7
          filename: pastura-coverage.json
          label: coverage
          message: ${{ needs.lint-and-test.outputs.coverage-pct }}%
          valColorRange: ${{ needs.lint-and-test.outputs.coverage-pct }}
          minColorRange: 0
          maxColorRange: 100

  # SECURITY: Do NOT add actions/checkout or run untrusted code in this job.
  # This job has pull-requests: write and must never execute PR code.
  # Do NOT change the trigger to pull_request_target.
  pr-comment:
    name: PR Comment
    needs: [lint-and-test, ui-test, release-build, demo-replay-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate comment body
        env:
          UNIT_JOB_RESULT: ${{ needs.lint-and-test.result }}
          UI_JOB_RESULT: ${{ needs.ui-test.result }}
          RELEASE_JOB_RESULT: ${{ needs.release-build.result }}
          DRIFT_JOB_RESULT: ${{ needs.demo-replay-drift.result }}
          TEST_PASSED: ${{ needs.lint-and-test.outputs.test-passed }}
          TEST_FAILED: ${{ needs.lint-and-test.outputs.test-failed }}
          TEST_PARSE_ERROR: ${{ needs.lint-and-test.outputs.test-parse-error }}
          UI_TEST_PASSED: ${{ needs.ui-test.outputs.test-passed }}
          UI_TEST_FAILED: ${{ needs.ui-test.outputs.test-failed }}
          UI_TEST_PARSE_ERROR: ${{ needs.ui-test.outputs.test-parse-error }}
          COVERAGE_PCT: ${{ needs.lint-and-test.outputs.coverage-pct }}
          LINT_RESULT: ${{ needs.lint-and-test.outputs.lint-result }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## CI Report"
            echo ""

            # Job-level failure banner
            for job_result in "$UNIT_JOB_RESULT" "$UI_JOB_RESULT" "$RELEASE_JOB_RESULT" "$DRIFT_JOB_RESULT"; do
              if [ "$job_result" = "skipped" ] || [ "$job_result" = "cancelled" ]; then
                echo "> One or more CI jobs were ${job_result}."
                echo ""
                break
              fi
            done
            if [ "$UNIT_JOB_RESULT" = "failure" ] \
                || [ "$UI_JOB_RESULT" = "failure" ] \
                || [ "$RELEASE_JOB_RESULT" = "failure" ] \
                || [ "$DRIFT_JOB_RESULT" = "failure" ]; then
              echo "> **CI job failed.** See [CI logs](${CI_RUN_URL}) for details."
              echo ""
            fi

            # Lint results
            echo "### Lint"
            echo ""
            if [ "$LINT_RESULT" = "pass" ]; then
              echo "SwiftLint: **passed**"
            elif [ "$LINT_RESULT" = "fail" ]; then
              echo "SwiftLint: **FAILED**"
            else
              echo "SwiftLint: did not run"
            fi

            # Release build (ADR-005 §8 submission-blocker gate — surfaced
            # here so a silent regression is visible on the PR, not only in
            # the Actions tab)
            echo ""
            echo "### Release Build (ADR-005 §8 guard)"
            echo ""
            if [ "$RELEASE_JOB_RESULT" = "success" ]; then
              echo "Release-iphoneos symbol guard: **passed**"
            elif [ "$RELEASE_JOB_RESULT" = "failure" ]; then
              echo "Release-iphoneos symbol guard: **FAILED** — see [CI logs](${CI_RUN_URL})"
            else
              echo "Release-iphoneos symbol guard: did not run"
            fi

            # Demo replay drift guard (#170 / spec §3.3 / §5.2 — surfaced
            # here so preset-vs-demo SHA mismatches and §5.2 floor violations
            # are visible on the PR, not only in the Actions tab)
            echo ""
            echo "### Demo Replay Drift Guard"
            echo ""
            if [ "$DRIFT_JOB_RESULT" = "success" ]; then
              echo "Demo replay drift guard: **passed**"
            elif [ "$DRIFT_JOB_RESULT" = "failure" ]; then
              echo "Demo replay drift guard: **FAILED** — see [CI logs](${CI_RUN_URL})"
            else
              echo "Demo replay drift guard: did not run"
            fi

            # Test results — unit + UI shown separately so a slow UI suite
            # never blocks fast unit-test feedback signalling
            echo ""
            echo "### Test Results"
            echo ""
            if [ "$TEST_PARSE_ERROR" = "true" ]; then
              echo "- Unit: > Could not parse test output."
            elif [ -n "$TEST_PASSED" ]; then
              PASSED=$(echo "${TEST_PASSED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              FAILED=$(echo "${TEST_FAILED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              if [ "$FAILED" = "0" ]; then
                echo "- Unit: **${PASSED} passed**"
              else
                echo "- Unit: **${PASSED} passed, ${FAILED} FAILED**"
              fi
            else
              echo "- Unit: > did not run"
            fi

            if [ "$UI_TEST_PARSE_ERROR" = "true" ]; then
              echo "- UI: > Could not parse test output."
            elif [ -n "$UI_TEST_PASSED" ]; then
              UI_PASSED=$(echo "${UI_TEST_PASSED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              UI_FAILED=$(echo "${UI_TEST_FAILED:-0}" | grep -oE '^[0-9]+$' || echo "0")
              if [ "$UI_FAILED" = "0" ]; then
                echo "- UI: **${UI_PASSED} passed**"
              else
                echo "- UI: **${UI_PASSED} passed, ${UI_FAILED} FAILED**"
              fi
            else
              echo "- UI: > did not run"
            fi

            # Coverage
            echo ""
            echo "### Coverage"
            echo ""
            if [ "$COVERAGE_PCT" = "0.00" ] || [ -z "$COVERAGE_PCT" ]; then
              echo "> Coverage measurement failed. See [CI logs](${CI_RUN_URL}) for details."
            else
              echo "**${COVERAGE_PCT}%** line coverage"
            fi

            echo ""
            echo "---"
            echo "[View full CI run](${CI_RUN_URL})"
          } > /tmp/pr-comment.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # Fork PRs have read-only GITHUB_TOKEN; comment posting will fail gracefully.
        continue-on-error: true
        with:
          header: ci-report
          path: /tmp/pr-comment.md
