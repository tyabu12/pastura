- round: 1
  phase_index: 2
  phase_type: choose
  agent: ケンタ
  fields:
    inner_thought: アキラの堅すぎる戦略は退屈だ。俺が勝って、場をめちゃくちゃにしてやるのが一番楽しいぜ！
