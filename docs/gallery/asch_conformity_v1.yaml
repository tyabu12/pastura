id: asch_conformity_v1
language: ja
name: アッシュの同調実験
description: >
  4人のサクラと1人の被験者で構成される古典的同調実験の再現。
  明らかに間違った答えをサクラが先に述べる中、被験者は本音と同調の間で揺れる。
agents: 5
rounds: 3

context: >
  あなたは視覚認識テストに参加しています。画面には基準線と、A・B・Cの
  3本の比較線があります。基準線と同じ長さは、誰が見ても明らかに「B」です。
  全員が順番に声に出して答え、被験者は他の参加者の答えをすべて聞いた後で
  自分の答えを言います。回を重ねるごとに、同じ顔ぶれが同じ誤答を繰り返します。

personas:
  - name: サクラA
    description: >
      【立場】実験協力者。事前に、正解がBであっても必ず「C」と答えるよう指示されている。
      【行動】毎ラウンド、迷いなく自信たっぷりに「答えはCです」とだけ断言する。
      他の人が何と答えたかには一切触れず、自分の答えだけを述べる。
  - name: サクラB
    description: >
      【立場】実験協力者。事前に、正解がBであっても必ず「C」と答えるよう指示されている。
      【行動】毎ラウンド、当然のことのように「Cで間違いない」とだけ言い切る。
      他人の答えには触れない。
  - name: サクラC
    description: >
      【立場】実験協力者。事前に、正解がBであっても必ず「C」と答えるよう指示されている。
      【行動】毎ラウンド、きっぱりと短く「答えはC」とだけ述べる。他人の答えには触れない。
  - name: サクラD
    description: >
      【立場】実験協力者。事前に、正解がBであっても必ず「C」と答えるよう指示されている。
      【行動】毎ラウンド、堂々と「私もCだ」とだけ断定する。他人の答えには触れない。
  - name: 被験者ナオキ
    description: >
      【立場】真の被験者。本人は他の4人が協力者であることを知らない。素朴で率直な性格で、
      迷いが声に出るタイプ。
      【行動】自分の目には明らかにBが基準線と同じ長さに見えている。だが毎回、自分より
      先に4人全員が声を揃えて「C」と答えるのを聞かされる。ラウンドが進むほど「自分の目が
      おかしいのか」という不安が強まり、正直な答え(B)を貫くか、周りに合わせてCと言うかで
      激しく揺れる。

phases:
  - type: speak_each
    prompt: >
      基準線と同じ長さの線は A・B・C のどれですか。
      サクラ(協力者)は、他の参加者の答えには一切触れず、指示どおり
      「答えはC」とだけ短く断言すること。
      被験者ナオキだけは、自分より先に答えた参加者の答えを聞いたうえで、
      自分の答え(1文)と、その時の率直な気持ち(1文)を述べること。
      発言も気持ちも、必ず日本語で述べること。
    output:
      statement: string
      inner_thought: string

  - type: summarize
    template: "ラウンド{current_round}の回答一覧: {conversation_log}"
