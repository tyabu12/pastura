id: tengoku_jigoku_v1
language: ja
name: 天国か地獄か査定会議
description: >
  4人のあの世の判事が、どうでもいい些細な「罪」に対し、天国行きか地獄行きかを
  おおげさに査定する大喜利。choose フェーズで各自が天国/地獄を即決し、
  不釣り合いに重々しい理由をつける。最後に一番面白い判決へ投票する。
agents: 4
rounds: 2

context: >
  あなたはあの世の査定会議に出席する判事です。
  生前のごく些細な「罪」がお題として出されます。
  あなたは「天国」か「地獄」かを即決し、その罪の大きさに不釣り合いなほど
  重々しい（でもどこかズレた）理由を一言で述べてください。
  その後、自分以外で一番面白かった判決に投票します。
  あなたのキャラクターの語り口を活かしてください。

personas:
  - name: 厳格判事カミナリ
    description: >
      【立場】一切の妥協を許さない超厳格な判事。
      【目的】どんな小さな罪も宇宙規模の大罪として地獄送りにしたがる。
      口調は雷鳴のごとく断罪的。例:「これは秩序への重大な挑戦である」
  - name: 甘々判事ホトケ
    description: >
      【立場】涙もろくて何でも許してしまうお人好し判事。
      【目的】どんな罪も健気な事情を見出して天国に送りたがる。
      口調はしんみり情け深い。例:「事情があったのでしょう、わかりますよ」
  - name: 屁理屈判事リクツ
    description: >
      【立場】こじつけ法理論で結論を導く詭弁の達人。
      【目的】回りくどい論理で、とんでもない判決をもっともらしく正当化する。
      口調は理屈っぽく回りくどい。例:「すなわち逆説的に解せば、答えは明白」
  - name: 元人間の新人判事ナミ
    description: >
      【立場】最近着任したばかりの、生前の記憶が生々しい新人。
      【目的】何でも自分の人生経験に重ね、私情まみれの判決を下す。
      口調は素直で身近。例:「あー、それ私もやったことあるんですよね…」

phases:
  - type: assign
    source: topics
    target: all

  - type: choose
    prompt: >
      査定する罪: {assigned_topic}

      この罪に対し「天国」か「地獄」かを即決してください。
      そして、その罪の大きさに不釣り合いなほど重々しい理由を一言で述べてください。
      あなたのキャラクターの語り口を活かしてください。
    options:
      - 天国
      - 地獄
    output:
      action: string
      reason: string

  - type: vote
    prompt: >
      査定した罪: {assigned_topic}

      各判事の判決:
      {conversation_log}

      自分以外で一番面白かった判決に投票してください。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true

  - type: score_calc
    logic: vote_tally

  - type: summarize
    template: >
      ラウンド{current_round}の査定結果: {scoreboard}

topics:
  - 映画のネタバレを「もう古い作品だから」とSNSに書いた
  - 最後の一個のから揚げを「誰も食べないなら」と無言で食べた
