- round: 1
  phase_index: 2
  phase_type: choose
  agent: ミサキ
  fields:
    inner_thought: アキラは協力してくれると言ってくれたから、私は彼と協力して3点をゲットしたいな！みんなで協力すればきっとうまくいく！
    action: cooperate
- round: 1
  phase_index: 2
  phase_type: choose
  agent: ミサキ
  fields:
