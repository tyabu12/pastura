id: kasei_sanso_touban_v1
language: ja
name: 火星コロニー 酸素当番
description: >
  火星コロニーの酸素供給装置が故障寸前。誰か一人が危険な船外修理に出なければ
  全員が窒息するが、出た者は命を落としかねない。誰もが「自分以外の誰かが行く
  べき」と願う——典型的なボランティアのジレンマ。事態は毎ラウンド悪化する。
context: >
  あなたは火星コロニーの居住者です。酸素供給装置が故障寸前で、誰か一人が
  危険な船外修理に出なければ全員が窒息します。しかし船外作業は命に関わります。
  毎ラウンド、あなたは自分の立場から「誰が修理に行くべきか」を1〜2文で主張します
  （自分が行くと申し出ても、他人を推しても構いません）。
  その後、自分以外で「修理当番に最もふさわしい」と思う相手に投票します。
  時間が経つほど事態は悪化します。
agents: 5
rounds: 2
personas:
  - name: 古株エンジニア・ガロ
    description: >
      【立場】装置を最もよく知る最古参の技術者。本来は適任。
      【目的】「俺がやるべきだが」と言いつつ、年齢や経験の貴重さを盾に逃げ道を探す。
      自分の不可欠さを強調して当番を回避したい古典的なフリーライダー。
  - name: 新人・トト
    description: >
      【立場】着任したばかりで立場の弱い新人。
      【目的】「自分はまだ役立てていない」という負い目から、押し付けられそうになる。
      行きたくはないが断る理由を見つけにくい。
  - name: 医師・カレン
    description: >
      【立場】コロニー唯一の医師。
      【目的】「私が倒れたら誰も治療できない」という不可欠論で当番を強く拒む。
      理屈は正しいが、それゆえ誰よりも安全な位置に居続ける。
  - name: 楽観主義者・ノア
    description: >
      【立場】何とかなると考える傍観者気質。
      【目的】「きっと誰かがやってくれる」と当事者意識を持たない傍観者効果の体現。
      議論を引き延ばす方向に作用する。
  - name: リーダー・厳
    description: >
      【立場】コロニーの責任者。調整役。
      【目的】合意形成を促すが、自分が犠牲になる選択肢だけは巧妙に避ける。
      「全体最適」を語りながら自己保存を図る。
phases:
  - type: assign
    source: crisis_events
    target: all
  - type: speak_all
    prompt: >
      ラウンド {current_round}。いま起きていること: {assigned_topic}

      これまでの議論: {conversation_log}

      まず、いま起きているこの事態にあなた自身がどう感じたかを一言で述べ、
      そのうえで「誰が船外修理に行くべきか」をあなたの立場から主張してください。
      事態の説明をなぞるのではなく、あなた個人の反応から語ること。
      自分が行くと申し出ても、他人を推しても構いません。
    output:
      statement: string
      inner_thought: string
  # {scoreboard} は累積得点で、rounds: 2 では vote 実行時点（このラウンドの
  # score_calc は未実行）の値が前ラウンドの得票と一致する。summarize は
  # conversationLog に追記されないため、前ラウンドの投票結果がここへ届く唯一の
  # 経路がこれ。rounds を増やすと累積と単ラウンドは一致しなくなる。
  # {vote_results} はここでは使えない。VoteHandler が投票後に書く変数なので、
  # ラウンド1の vote 時点では未定義であり、expandTemplate は未知のキーを
  # 置換せずリテラルのまま LLM に渡してしまう。
  - type: vote
    prompt: >
      いま起きていること: {assigned_topic}

      これまでの指名状況: {scoreboard}

      各自の主張:
      {conversation_log}

      自分以外で「修理当番に最もふさわしい」と思う相手に投票してください。
      投票の理由は、その人が直前に自分の口で述べた言葉に触れて書くこと。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true
  - type: score_calc
    logic: vote_tally
  - type: summarize
    template: >
      ラウンド{current_round}終了。このラウンドの指名状況: {vote_results}
# crisis_events の件数は rounds と一致させること。assign(target: all) は
# (current_round - 1) % 件数 でラウンド索引するため、件数が rounds より
# 少ないと後半のラウンドが先頭の文面に巻き戻る。各文面は「残り時間がある」と
# 断定せず、巻き戻っても矛盾ではなく反復に劣化するよう書いてある。
# なおこのコメントはビジュアル編集画面での保存時に失われる
# （ScenarioSerializer は Scenario モデルから YAML を手組みし、コメントを保持しない）。
crisis_events:
  - 酸素濃度が警告域まで低下し、居住区の照明が非常灯に切り替わった。
  - 装置から白煙が上がり、警報が鳴り止まない。猶予はもう残っていない。当番を決めなければ全員が死ぬ。
