  phase_type: speak_all
  agent: Bandwagon Benny
  fields:
    statement: Well, this blackout is perfect because now I can finally see the hilarious shadow puppet of my own panic!
    inner_thought: I need to embrace the darkness and turn the sudden lack of light into a spotlight for my own exaggerated fear.
- round: 1
  phase_index: 1
  phase_type: speak_all
  agent: Professor Cosmo
  fields:
    statement: The sudden void of darkness reveals the true, unlit tapestry of our collective insignificance under the indifferent gaze of the universe.
    inner_thought: This leans into the pretentious nature of Professor Cosmo and frames the blackout as a profound existential moment.
- round: 1
  phase_index: 1
  phase_type: speak_all
  agent: Panicky Penny
  fields:
