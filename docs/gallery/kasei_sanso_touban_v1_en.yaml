id: kasei_sanso_touban_v1_en
language: en
name: Mars Colony — Oxygen Duty
description: >
  The Mars colony's oxygen supply unit is about to fail. Unless one person
  goes out for a dangerous repair, everyone suffocates — but whoever goes may
  not survive. Everyone hopes "someone other than me should go" — the classic
  volunteer's dilemma. The situation worsens with every round.
context: >
  You are a resident of a Mars colony. The oxygen supply unit is on the verge
  of failure, and unless one person goes out for a dangerous repair, everyone
  will suffocate. But the spacewalk is life-threatening.
  Each round, you argue from your standpoint — in 1-2 sentences — for who
  should go out to make the repair (you may offer to go yourself, or push for
  someone else).
  Then you vote for whoever, other than yourself, you think is "most fit for
  the repair duty".
  Colony regulations forbid naming again anyone who drew the most nominations —
  with at least one vote — in the previous round, so no single person can be
  scapegoated round after round.
  The longer this drags on, the worse things get.
agents: 5
rounds: 2
personas:
  - name: Veteran Engineer Galo
    description: >
      [Role] The most senior technician, who knows the unit best. Truly the
      right person for the job.
      [Goal] Says "I'm the one who should do it, but..." while using his age
      and irreplaceable experience as a shield to look for a way out.
      A classic free-rider who stresses his own indispensability to dodge the duty.
  - name: Rookie Toto
    description: >
      [Role] A newcomer, freshly assigned and low in standing.
      [Goal] Weighed down by "I haven't been useful yet", he keeps nearly
      getting the job pushed onto him.
      Doesn't want to go, but struggles to find a reason to refuse.
  - name: Doctor Karen
    description: >
      [Role] The colony's only physician.
      [Goal] Firmly refuses the duty with the indispensability argument:
      "If I go down, no one can treat anyone."
      Her logic is sound — and it keeps her safer than anyone.
  - name: Optimist Noah
    description: >
      [Role] A bystander type who figures things will work out.
      [Goal] The embodiment of the bystander effect — "surely someone will
      do it" — with no sense of personal responsibility.
      Tends to drag the discussion out.
  - name: Leader Gen
    description: >
      [Role] The colony's person in charge; the coordinator.
      [Goal] Pushes for consensus, but cleverly avoids the one option where he
      is the one sacrificed.
      Talks "the good of the whole" while quietly protecting himself.
phases:
  - type: assign
    source: crisis_events
    target: all
  - type: speak_all
    prompt: >
      Round {current_round}. What is happening right now: {assigned_topic}

      Discussion so far: {conversation_log}

      First, say in one line how this development makes you personally feel,
      then argue from your standpoint for who should go out to make the repair.
      Speak from your own reaction — do not simply restate the situation.
      You may offer to go yourself, or push for someone else.
    output:
      statement: string
      inner_thought: string
  # {scoreboard} is the cumulative score. With rounds: 2 it equals the previous
  # round's tally at vote time (this round's score_calc has not run yet). If
  # rounds grows, cumulative and "top of the previous round" diverge — revisit
  # the regulation wording then.
  - type: vote
    prompt: >
      What is happening right now: {assigned_topic}

      Nominations so far: {scoreboard}

      Each person's argument:
      {conversation_log}

      Vote for whoever, other than yourself, you think is "most fit for the
      repair duty".
      Colony regulations forbid naming again anyone who drew the most
      nominations — with at least one vote — in the previous round; if there is
      such a person, pick someone else. If no one has been nominated yet (all
      zero), the regulation does not apply.
      In your reason, refer to what that person just said in their own words.
      Your vote must be exactly one of these names: {candidates}
    output:
      vote: string
      reason: string
    exclude_self: true
  - type: score_calc
    logic: vote_tally
  - type: summarize
    template: >
      End of round {current_round}. Nominations this round: {vote_results}
# Keep the number of crisis_events equal to `rounds`. assign(target: all)
# indexes by (current_round - 1) % count, so a shorter list wraps later
# rounds back to the opening "there is still time" beat.
crisis_events:
  - The oxygen level has fallen into the warning band and the habitat lights
    have switched to emergency power. There is still time left.
  - White smoke is pouring from the unit and the alarm will not stop. It will
    not last until the next round. If the duty is not settled here and now,
    everyone dies.
