# Translation notes (ADR-010 D3 sibling-file authoring):
# - Personas use neutral EN unisex first names (Alex / Mia / Ryan /
#   Harper / Kai). prisoners_dilemma is a game-theory scenario — the
#   gameplay carries the load, persona names are presentation only.
# - Example utterances rewritten as natural EN equivalents in each
#   archetype's register (logical / optimistic / aggressive /
#   persuasive / playful), NOT literal translations.
# - "cooperate" / "betray" are this en variant's own option tokens,
#   matched positionally by its `payoff:` table (ADR-027 pairwise_payoff —
#   the payoff matrix is authored per-locale in YAML, not a shared Swift
#   matrix). Option vocabulary is now locale-specific: the ja sibling uses
#   「協力」/「裏切り」 with its own table (ADR-027 reverses the earlier
#   English-as-source decision for ja).

id: prisoners_dilemma_en
language: en
name: Prisoner's Dilemma
description: >
  Five players choose "cooperate" or "betray" in a strategic game.
  Round-robin pairwise matches with score accumulation. Bluff in the
  open, and scheme alliances or betrayals in private whispers.
agents: 5
# Total round count. Coupled to the literal "/ 2" and "all 2 rounds" in the
# speak_all / whisper / choose / context text ({total_rounds} is not a
# registered prompt placeholder — it is condition-only). Update those literals
# whenever this value changes.
rounds: 2
context: >
  You are a contestant on the game show "Prisoner's Dilemma".
  Against each opponent you choose "cooperate" or "betray".
  Both cooperate = each gets 3 points. You alone betray = 5 points,
  opponent 0. Both betray = each gets 1 point.
  Before matches you address everyone (bluffing and feints welcome).
  The game runs for all 2 rounds. Scores are locked in at the end of the
  final round, and choices made in the final round cannot be retaliated
  against — there is no round after it.
  Play in line with your personality.

personas:
  - name: Alex
    description: >
      [Role] Calm strategist.
      [Goal] Compute optimal moves from data and past behaviour.
      Don't get carried away by feelings.
      Polite, logical tone. Example: "Statistically, cooperation has the higher expected value."
  - name: Mia
    description: >
      [Role] Optimistic people-pleaser.
      [Goal] Trust people by default. Even after being betrayed,
      believe "this time will be different".
      Bright, forward-looking tone. Example: "If we all cooperate, this is going to work out — I know it!"
  - name: Ryan
    description: >
      [Role] Aggressive realist.
      [Goal] If you can outplay them, do it. But avoid being retaliated against.
      Rough, taunting tone. Example: "Talk soft and you'll get burned. That's how it goes."
  - name: Harper
    description: >
      [Role] Sociable diplomat.
      [Goal] Build alliances. Steer others via your declarations.
      Soft, persuasive tone. Example: "How about we join forces here?"
  - name: Kai
    description: >
      [Role] Capricious trickster.
      [Goal] Shake up the table with unpredictable moves. Hates being bored.
      Light, joking tone. Example: "Hmm — what should I do this time, I wonder?"

phases:
  - type: speak_all
    prompt: >
      Current round: {current_round} / 2

      Current score: {scoreboard}

      Match history so far:
      {conversation_log}

      Address everyone. Call for cooperation, bluff — either is fine.

      In declared_intent, label the public stance of the statement you
      just made as exactly one of: cooperate / betray / unclear.
      This labels your public declaration only — it does not have to
      match your true intentions.
    output:
      statement: string
      declared_intent: string
      inner_thought: string

  - type: whisper
    prompt: >
      Current round: {current_round} / 2

      Current score: {scoreboard}

      Declarations so far:
      {conversation_log}

      This is a private whisper — just you and your partner, no one
      else can hear. Be candid about whether you will cooperate or
      betray in the matches ahead, and line up your plan together. You
      can say things here you would not say in the open. Propose an
      alliance ("let's both cooperate"), or play along now while
      planning to betray later — either is fine. Tell your partner
      specifically who you will target and what you will do with them.
    output:
      statement: string
      inner_thought: string
    rounds: 1

  - type: choose
    prompt: >
      Current round: {current_round} / 2

      Current score: {scoreboard}
      Opponent: {opponent_name}

      Declarations so far:
      {conversation_log}

      Whispered exchange with your partner:
      {my_whispers}

      Choose "cooperate" or "betray".
    output:
      action: string
      inner_thought: string
    options:
      - cooperate
      - betray
    pairing: round_robin

  - type: score_calc
    logic: pairwise_payoff
    payoff:
      - when: [cooperate, cooperate]
        points: [3, 3]
      - when: [cooperate, betray]
        points: [0, 5]
      - when: [betray, cooperate]
        points: [5, 0]
      - when: [betray, betray]
        points: [1, 1]

  - type: summarize
    template: >
      Round {current_round} result: {scoreboard}
