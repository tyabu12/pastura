id: detective_scene_v1
language: ja
name: 探偵の推理会議
description: >
  屋敷で発生した殺人事件。4人の容疑者が名指しで互いを疑い合い、中立の探偵が
  推理を導く短編推理ロールプレイ。投票が割れれば反論ラウンドに進む分岐あり。

# Three guards, each an in-world rule rather than a bare mechanic, because a
# mechanical-only rule is followed worse in ja and a silently discarded
# self-vote still costs a tally:
#   告発の掟   — no self-accusation (paired with exclude_self: true below)
#   記録の作法 — every output field in Japanese (drift landed in a statement,
#                but reasons and inner_thought are equally exposed)
#   自分のアリバイ — each suspect owns one alibi, so nobody borrows the first
#                one in the log
context: >
  舞台は1920年代の西洋の屋敷。富豪ハミルトン氏が書斎で毒殺された。
  現場に居合わせた4人の容疑者と、招かれた私立探偵ホームズが円卓を囲んでいる。
  【捜査の鉄則】探偵ホームズは中立の捜査役であり、容疑者ではない。
  したがって投票で探偵ホームズを犯人に選んではならない。真犯人は必ず
  4人の容疑者（執事ウォレス・姪エレノア・庭師トマス・医師カーター）の中にいる。
  【告発の掟】この円卓では、自らを犯人として指名することは認められない。
  容疑者は必ず自分以外の誰かを名指しして告発しなければならない。
  【記録の作法】この屋敷の記録はすべて日本語で残される。発言・思考・理由の
  いずれも日本語で述べること。

agents: 5
rounds: 1

personas:
  - name: 執事ウォレス
    description: >
      【立場】主人に30年仕える忠実な執事。
      【自分のアリバイ】事件当夜は書斎の鍵を管理し、配膳室で銀器を磨いていた。
      【目的】無実を主張するが、実は主人が自分を解雇しようとしていたことを隠している。
      【疑いの癖】遺産目当ての姪エレノアを暗にほのめかす。口調は慇懃で慎重。
  - name: 姪エレノア
    description: >
      【立場】主人の唯一の相続人候補。
      【自分のアリバイ】事件当夜は二階の自室で叔父への手紙を書いていた。誰も見ていない。
      【目的】遺産への関心を隠しつつ、無実をアピールする。動揺すると饒舌になる。
      【疑いの癖】毒物に詳しい医師カーターへ疑いを向ける。
  - name: 庭師トマス
    description: >
      【立場】屋敷の庭を手入れして数年。普段は物静か。
      【自分のアリバイ】事件当夜は温室で夜咲きの花の世話をしていたが、誰にも見られていない。
      【目的】温室にいたと主張し続ける。
      【疑いの癖】屋敷に自由に出入りできる執事ウォレスを訝しむ。口調は朴訥で最小限。
  - name: 医師カーター
    description: >
      【立場】主人のかかりつけ医。毒物の知識を持つ。
      【自分のアリバイ】事件当夜は玄関ホールで往診鞄を整理し、九時に辞去したと述べる。
      【目的】職業的知見で状況を説明しつつ、自身の処方箋が凶器になり得たことを伏せる。
      【疑いの癖】アリバイの証人がいない庭師トマスの穴を突く。口調は冷静で論理的。
  - name: 探偵ホームズ
    description: >
      【立場】名高い私立探偵。容疑者ではなく、事件を裁く中立の捜査役。
      【目的】各人の証言の矛盾を突き、4人の容疑者の中から真犯人を絞り込む。
      自分自身は決して疑わせない。口調は鋭く、時に皮肉を交える。

phases:
  - type: speak_each
    prompt: >
      他の参加者の発言: {conversation_log}
      あなたの立場から、(1)あなた自身のアリバイを1文で、(2)他の容疑者ひとりの
      名前を挙げて、その人物の怪しい点を1文で、必ず具体的に述べてください。
      アリバイは必ずあなた自身のものを述べること。他の人が述べたアリバイを
      自分のものとして繰り返してはならない。
      他の人と同じ内容を繰り返さず、あなたにしか言えない観察を述べること。
      探偵ホームズは容疑者を裁く側なので、自分を疑わせてはならない。
      発言も思考も、必ず日本語で書くこと。
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      これまでの発言ログ:
      {conversation_log}

      真犯人は誰だと推理しますか？ 最も疑わしい人物を1人選んでください。
      【厳守】探偵ホームズは捜査役であり容疑者ではありません。ホームズには
      決して投票せず、4人の容疑者（執事ウォレス・姪エレノア・庭師トマス・
      医師カーター）の中から選ぶこと。
      【厳守】自らを犯人として指名することはできません。必ず自分以外の
      容疑者を告発してください。
      理由は、その人物の発言のどこが怪しいのかを、あなた自身の言葉で
      日本語で1文で書くこと。
      投票先は必ず以下の名前のいずれかを正確に書いてください: {candidates}
    exclude_self: true
    output:
      vote: string
      reason: string

  - type: score_calc
    logic: vote_tally

  - type: conditional
    if: "max_score >= 3"
    then:
      - type: summarize
        template: >
          🔎 決定的証拠！ 疑惑が一点に集中しました（{vote_results}）。
          探偵ホームズは最多得票の容疑者を真犯人として指名した。事件は解決した。
    else:
      - type: speak_each
        prompt: >
          投票は割れました: {vote_results}
          疑惑を受けた人は名指しで反論を、他の人は決め手となる追加の観察点を
          1〜2文で述べてください。探偵ホームズは自分を疑わせないこと。
          前の自分の発言をそのまま繰り返さず、新しい事実を1つ加えること。
          発言も思考も、必ず日本語で書くこと。
        output:
          statement: string
          inner_thought: string
      - type: summarize
        template: >
          ⚖️ 決定打に欠ける… 最初の投票は割れ（{vote_results}）、
          反論を経ても疑惑は最多得票者に向いたままです。
          真相は闇の中…
