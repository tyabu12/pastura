# Translation notes (ADR-010 D3 sibling-file authoring):
# - 3 personas, distinct unisex EN first names (Quinn / Theo / Drew).
#   Names carry no comedic load — gameplay is the point. The conditional
#   summarize template demonstrating round-end branching is the
#   pedagogical purpose of this preset (per the ja file's description).

id: target_score_race_en
language: en
name: Score Race
description: >
  A vote-driven points race where the first to reach a target score
  gets the lead. A demo of conditional phases — the round-end summary
  branches on game state.
agents: 3
rounds: 4
context: >
  You are a contestant in a scoring race. Get the rules right:
  - Each round you vote for exactly one other participant; the one you
    vote for gains 1 point (you cannot raise your own score — you need
    others to vote for you).
  - The game always runs all 4 rounds. Reaching 3 points does NOT end it.
  - Hitting 3 points is only a "lead" milestone for flavor; the winner is
    decided by total score at the end of the final round. No winner is
    locked in partway.
  Stay in your role and keep maneuvering to the very end.

personas:
  - name: Quinn
    description: >
      [Role] Tactician. Alternates alliances and betrayals to break out one step ahead.
      Calm, logical tone. Example: "Probabilistically speaking, here's the play..."
  - name: Theo
    description: >
      [Role] Straight shooter. Votes honestly for whoever was actually the most interesting.
      Plain, candid tone. Example: "That was genuinely well done."
  - name: Drew
    description: >
      [Role] Mood-keeper. Lifts the energy on the surface while calculating underneath.
      Bright, jokey tone. Example: "C'mon, can't we all just get along? (...calculating beneath)"

phases:
  - type: speak_all
    prompt: >
      Current score: {scoreboard}
      Round {current_round} / 4 begins. Nothing is decided yet. Staying in
      character, declare your strategy for this round in one or two sentences.
      Bluffs and misdirection welcome.
    output:
      statement: string
      inner_thought: string

  - type: vote
    prompt: >
      Current score: {scoreboard}
      Declarations so far:
      {conversation_log}
      Vote for the participant other than yourself you most want to
      support / who you thought played best (the one you vote for gains 1 point).
      Write the vote target exactly as one of these names: {candidates}
    exclude_self: true
    output:
      vote: string
      reason: string

  - type: score_calc
    logic: vote_tally

  - type: conditional
    if: "max_score >= 3"
    then:
      - type: summarize
        template: >
          🏆 R{current_round}: Someone hit 3 points (the lead)! Scores: {scoreboard}
          But it carries to the final round — a comeback is still possible.
    else:
      - type: summarize
        template: >
          R{current_round} ended. Scores: {scoreboard}
          No one has reached 3 points yet.
