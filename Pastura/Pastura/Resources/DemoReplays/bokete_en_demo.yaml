turns:
  - round: 1
    phase_index: 1
    phase_type: speak_all
    agent: Snappy Sam
    fields:
      statement: 'That''s not a hill — that''s just life going downhill.'
      inner_thought: 'Short and clean. Twist the frame in one line.'
  - round: 1
    phase_index: 1
    phase_type: speak_all
    agent: Surreal Sue
    fields:
      statement: 'At the bottom of that hill, her ten-years-younger self is waiting.'
      inner_thought: 'The less it connects, the funnier. Bend the timeline.'
  - round: 1
    phase_index: 1
    phase_type: speak_all
    agent: Mr. Relatable
    fields:
      statement: 'Country grandmas — somehow at full sprint the night before sports day.'
      inner_thought: 'Lean into recognition. Pick a familiar scene.'
  - round: 1
    phase_index: 1
    phase_type: speak_all
    agent: Cynical Carl
    fields:
      statement: 'Day before pension day — racing the account balance.'
      inner_thought: 'A little sting. Sour laugh over the obvious one.'
  - round: 1
    phase_index: 1
    phase_type: speak_all
    agent: Ditzy Daisy
    fields:
      statement: 'Wow, grandma''s got a new hobby! Does she need a license for that?'
      inner_thought: 'Don''t calculate — just say the first thing.'
  - round: 1
    phase_index: 2
    phase_type: vote
    agent: Snappy Sam
    fields:
      vote: Cynical Carl
      reason: 'The bite lands. Short and clean structure.'
  - round: 1
    phase_index: 2
    phase_type: vote
    agent: Surreal Sue
    fields:
      vote: Cynical Carl
      reason: 'Room to imagine. Reads better the second time.'
  - round: 1
    phase_index: 2
    phase_type: vote
    agent: Mr. Relatable
    fields:
      vote: Cynical Carl
      reason: 'The mix of recognisable and bittersweet is exactly the dial.'
  - round: 1
    phase_index: 2
    phase_type: vote
    agent: Cynical Carl
    fields:
      vote: Ditzy Daisy
      reason: 'The unfiltered honesty is its own punchline. Can''t fake that.'
  - round: 1
    phase_index: 2
    phase_type: vote
    agent: Ditzy Daisy
    fields:
      vote: Cynical Carl
      reason: 'Hmm, kinda grown-up — I like it!'

