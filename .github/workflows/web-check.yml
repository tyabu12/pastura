# PR-time gate for the public site (Astro project under `web/`, issue #475).
#
# The deploy workflow (`deploy-pages.yml`) only builds on push to `main`, so
# without this a broken `.astro` change would not surface until after merge.
# This job runs on every PR (and push to main) that touches `web/**`:
#
#   - `astro check` — type-checks the .astro files (@astrojs/check + tsc).
#   - `astro build` — full render; catches frontmatter/runtime errors that
#     the type check alone does not.
#
# Runs on ubuntu (cheap, fast) — the iOS suite in `ci.yml` is macOS-only and
# unrelated to the web project.

name: Web Check

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Astro build
        run: npm run build
